 dan taman nasional.\n\n# Pengomposan\nKompos adalah pupuk alami hasil penguraian sampah organik oleh mikroorganisme. Salah satu metode pengomposan sederhana adalah metode **Takakura**, yaitu pengomposan menggunakan keranjang berlubang yang dilapisi kardus dan diisi kompos jadi sebagai starter. Metode ini cocok untuk rumah tangga dan sekolah karena tidak berbau jika dikelola dengan benar.\n\n[STEM: Menghitung Sampah yang Terselamatkan] Jika satu kelas menghasilkan 1,5 kg sampah organik setiap hari sekolah, dalam 20 hari sekolah terkumpul 30 kg sampah organik (matematika). Dengan komposter (enjinering), sampah itu diurai mikroorganisme (sains) menjadi pupuk bagi kebun sekolah. Suhu dan kelembapan komposter dapat dipantau dengan termometer digital (teknologi)."}], "dimensi": [{"dimensi": "Kewargaan", "indikator": "Siswa mampu berperan aktif mengurangi sampah dan menjaga kelestarian lingkungan sekolah."}, {"dimensi": "Kolaborasi", "indikator": "Siswa mampu bekerja sama dalam membuat dan merawat komposter."}, {"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu menganalisis dampak hilangnya satu komponen terhadap jaring-jaring makanan."}], "rangkuman": ["Ekosistem adalah kesatuan makhluk hidup dan lingkungannya yang saling berinteraksi.", "Komponen biotik terdiri atas produsen, konsumen, dan dekomposer, sedangkan komponen abiotik meliputi cahaya, air, udara, tanah, suhu, dan kelembapan.", "Tingkatan organisasi dalam ekosistem meliputi individu, populasi, komunitas, ekosistem, dan biosfer.", "Rantai makanan dan jaring-jaring makanan menggambarkan aliran energi dalam ekosistem.", "Simbiosis terdiri atas mutualisme, komensalisme, dan parasitisme.", "Kegiatan manusia seperti penebangan liar dan pencemaran dapat merusak ekosistem.", "Pelestarian lingkungan dapat dilakukan melalui 3R, pemilahan sampah, pengomposan, dan penanaman pohon."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat membedakan komponen biotik dan abiotik?", "Apakah setelah mempelajari bab ini kalian dapat menyusun rantai makanan dan jaring-jaring makanan?", "Apakah setelah mempelajari bab ini kalian dapat menjelaskan jenis-jenis simbiosis?", "Apakah setelah mempelajari bab ini kalian dapat merancang upaya nyata untuk melestarikan lingkungan?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Setiap hari, kantin sekolah menghasilkan sampah sisa makanan dan kulit buah yang menimbulkan bau. Sementara itu, kebun sekolah memerlukan pupuk. Rancanglah komposter sederhana dari keranjang atau wadah bekas yang dapat mengubah sampah organik kantin menjadi kompos tanpa menimbulkan bau.", "judul": "Komposter Takakura Mini untuk Kantin Sekolah", "steam": {"S": "Memahami peran mikroorganisme pengurai serta pengaruh udara, kelembapan, dan suhu terhadap proses pengomposan.", "T": "Memantau suhu kompos dengan termometer digital dan mendokumentasikan perubahan kompos melalui foto berkala.", "E": "Merancang wadah berlubang dengan lapisan kardus, alas sekam, dan tutup kain agar sirkulasi udara baik dan tidak berbau.", "M": "Menimbang sampah yang dimasukkan setiap hari, menghitung total sampah terolah, dan membuat grafik suhu kompos."}, "alat": ["Keranjang plastik berlubang atau ember bekas yang diberi lubang", "Kardus bekas untuk melapisi dinding", "Sekam padi sebagai bantalan atas dan bawah", "Kompos jadi sebagai starter", "Kain penutup berpori", "Sampah organik yang dicacah kecil", "Termometer dan timbangan"], "langkah": ["Empati dan Bertanya: Wawancarai pengelola kantin dan petugas kebersihan tentang jumlah dan jenis sampah organik, lalu rumuskan pertanyaan: bagaimana mengolah sampah itu tanpa menimbulkan bau?", "Bertukar Pikiran: Bandingkan beberapa cara pengomposan, seperti lubang tanah, ember tertutup, dan metode Takakura, lalu pilih cara yang paling sesuai.", "Mendesain Solusi: Buat sketsa susunan komposter: lapisan kardus, bantalan sekam, kompos starter, tempat sampah dimasukkan, dan penutup kain.", "Membuat Solusi: Rakit komposter sesuai sketsa dan masukkan sampah organik yang telah dicacah kecil setiap hari, lalu aduk dan tutup kembali.", "Menguji dan Mengevaluasi: Ukur suhu kompos dan catat bau, kelembapan, serta massa sampah yang dimasukkan setiap hari selama dua minggu.", "Mendesain Ulang: Jika kompos terlalu basah atau berbau, perbaiki dengan menambah sekam, mengurangi sampah berair, atau menambah lubang udara.", "Mengomunikasikan: Presentasikan data suhu dan jumlah sampah terolah dalam grafik, lalu ajak warga sekolah memilah sampah organik untuk komposter."], "produk": "Produk akhir berupa komposter mini yang berfungsi, tabel dan grafik suhu serta massa sampah terolah, dan poster ajakan memilah sampah. Kompos yang dihasilkan dapat digunakan untuk kebun sekolah.", "kriteria": ["Fungsi komposter dan kondisi kompos yang tidak berbau", "Kelengkapan data harian dan ketepatan grafik", "Penjelasan peran mikroorganisme pengurai", "Perbaikan desain berdasarkan pengamatan", "Dampak bagi lingkungan sekolah dan presentasi"], "pertanyaan": "Bagaimana mengolah sampah organik kantin sekolah menjadi kompos tanpa menimbulkan bau dalam waktu dua minggu?", "prediksi": ["Menurut kalian, apakah komposter yang ditutup rapat dengan plastik akan lebih cepat menghasilkan kompos? Jelaskan alasannya.", "Mengapa suhu di dalam tumpukan kompos dapat naik walaupun tidak dipanaskan?"], "sukses": ["Komposter tidak menimbulkan bau menyengat selama dua minggu", "Suhu kompos mencapai di atas suhu udara sekitar yang menandakan aktivitas mikroorganisme", "Paling sedikit 5 kg sampah organik kantin terolah"], "batasan": ["Wadah dari keranjang atau ember bekas", "Hanya sampah organik yang dicacah kecil yang boleh dimasukkan", "Komposter diletakkan di tempat teduh yang tidak mengganggu warga sekolah"], "data": {"kolom": ["Hari ke-", "Massa Sampah Masuk (g)", "Suhu Kompos (°C)", "Suhu Udara (°C)", "Bau dan Kelembapan"], "keterangan": "Isi setiap hari sekolah setelah sampah dimasukkan dan kompos diaduk."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan masalah sampah kantin dan batasan penempatan komposter", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menjelaskan peran mikroorganisme pengurai serta pengaruh udara dan kelembapan berbasis data", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Memantau, menganalisis penyebab bau, dan merevisi susunan komposter", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Menimbang sampah, mencatat suhu, dan membuat grafik suhu terhadap waktu", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Bagaimana pengetahuan tentang mikroorganisme pengurai dapat membantu mengurangi sampah di rumahmu?"]}, "pg": [{"q": "Berikut yang termasuk komponen abiotik adalah ....", "opsi": ["cahaya matahari", "cacing", "jamur", "rumput"], "kunci": "A"}, {"q": "Sekelompok ikan nila yang hidup di sebuah kolam disebut ....", "opsi": ["individu", "komunitas", "populasi", "ekosistem"], "kunci": "C"}, {"q": "Makhluk hidup yang berperan menguraikan sisa makhluk hidup yang telah mati adalah ....", "opsi": ["produsen", "dekomposer", "konsumen tingkat II", "konsumen tingkat I"], "kunci": "B"}, {"q": "Pada rantai makanan padi → tikus → ular → elang, ular berperan sebagai ....", "opsi": ["produsen", "konsumen tingkat I", "konsumen tingkat III", "konsumen tingkat II"], "kunci": "D"}, {"q": "Jika populasi ular di sawah diburu habis, akibat yang paling mungkin terjadi adalah ....", "opsi": ["populasi tikus meningkat dan padi rusak", "populasi tikus menurun", "populasi elang meningkat", "padi tumbuh lebih subur"], "kunci": "A"}, {"q": "Hubungan antara lebah dan bunga merupakan contoh simbiosis ....", "opsi": ["parasitisme", "komensalisme", "mutualisme", "kompetisi"], "kunci": "C"}, {"q": "Benalu yang hidup pada pohon mangga merupakan contoh simbiosis ....", "opsi": ["mutualisme", "parasitisme", "komensalisme", "predasi"], "kunci": "B"}, {"q": "Menurut piramida energi, makin tinggi tingkat trofik maka energi yang tersedia ....", "opsi": ["makin besar", "tidak dapat ditentukan", "tetap sama", "makin kecil"], "kunci": "D"}, {"q": "Menggunakan botol minum isi ulang sebagai pengganti botol plastik sekali pakai merupakan penerapan prinsip ....", "opsi": ["reduce", "recycle", "replant", "recovery"], "kunci": "A"}, {"q": "Agar komposter sampah organik tidak berbau, tindakan yang tepat adalah ....", "opsi": ["menutupnya rapat dengan plastik tanpa lubang", "menambahkan banyak air setiap hari", "menjaga sirkulasi udara dan mengaduk kompos secara teratur", "mencampurkan sampah plastik ke dalamnya"], "kunci": "C"}], "esai": ["Jelaskan perbedaan individu, populasi, komunitas, dan ekosistem dengan contoh di lingkungan sekolah kalian!", "Buatlah satu jaring-jaring makanan di ekosistem sawah yang terdiri atas paling sedikit enam jenis makhluk hidup!", "Jelaskan dampak penebangan hutan secara liar terhadap ekosistem dan kehidupan manusia!", "Sebuah sekolah menghasilkan 4 kg sampah organik setiap hari sekolah. Berapa kilogram sampah organik yang dapat diolah menjadi kompos dalam satu bulan dengan 22 hari sekolah? Jelaskan manfaatnya bagi lingkungan!", "Usulkan tiga program sederhana yang dapat dilakukan di sekolah kalian untuk mengurangi sampah plastik, lengkap dengan cara mengukur keberhasilannya!"], "hots": [{"level": "A", "kasus": "Komposter A berlubang dan diaduk setiap hari, sedangkan komposter B ditutup rapat tanpa lubang. Setelah lima hari, komposter B berbau busuk.", "tuntutan": "Jelaskan satu alasan ilmiah yang menyebabkan komposter B berbau."}, {"level": "B", "kasus": "Suhu komposter kalian tidak pernah lebih tinggi daripada suhu udara selama satu minggu.", "tuntutan": "Data apa yang perlu dikumpulkan sebelum memutuskan apa yang harus diperbaiki?"}, {"level": "C", "kasus": "Komposter X mengolah 8 kg sampah tetapi sempat berbau pada hari ke-6. Komposter Y mengolah 5,5 kg sampah dan tidak pernah berbau.", "tuntutan": "Berdasarkan kriteria keberhasilan proyek, komposter mana yang lebih berhasil? Buktikan dengan argumen data."}]}, {"judul": "Bumi dan Tata Surya", "ide": "Jam matahari (gnomon) sederhana", "pemantik": ["Mengapa matahari tampak terbit di timur dan terbenam di barat setiap hari?", "Mengapa bentuk bulan yang kita lihat berubah-ubah dari malam ke malam?", "Bagaimana orang zaman dahulu mengetahui waktu tanpa jam dinding atau telepon genggam?"], "tujuan": ["Siswa dapat mendeskripsikan anggota sistem tata surya dan karakteristiknya.", "Siswa dapat menjelaskan akibat rotasi dan revolusi bumi terhadap kehidupan.", "Siswa dapat menjelaskan fase bulan, gerhana, dan pasang surut air laut berdasarkan posisi bumi, bulan, dan matahari.", "Siswa dapat menganalisis pengaruh benda langit dan aktivitas manusia terhadap iklim bumi.", "Siswa dapat merancang jam matahari sederhana dan menggunakannya untuk menentukan waktu."], "kataKunci": ["tata surya", "planet", "rotasi", "revolusi", "fase bulan", "gerhana", "pasang surut", "iklim"], "petaKonsep": [{"poin": ["Matahari dan planet", "Satelit, asteroid, komet"]}, {"poin": ["Rotasi dan revolusi bumi", "Fase bulan, gerhana, pasang surut"]}, {"poin": ["Musim dan iklim", "Pemanasan global"]}], "apersepsi": "Sejak dahulu, masyarakat Nusantara mengamati langit untuk mengatur kehidupan. Para pelaut Bugis membaca posisi bintang untuk menentukan arah pelayaran. Petani Jawa mengenal pranata mangsa, yaitu penanggalan musim yang disusun berdasarkan pengamatan alam, termasuk kemunculan rasi bintang tertentu, untuk menentukan waktu bercocok tanam.\n\n[GAMBAR: Langit Malam dengan Rasi Bintang | Ilustrasi Penulis (2026) | langit malam bertabur bintang di atas perahu tradisional di laut]\n\nPengamatan sederhana itu merupakan awal dari ilmu astronomi. Kini, para ilmuwan menggunakan teleskop dan wahana antariksa untuk mempelajari tata surya. Pada bab ini, kalian akan mempelajari anggota tata surya, gerak bumi dan bulan, serta pengaruhnya terhadap kehidupan di bumi.", "subbab": [{"judul": "Sistem Tata Surya", "isi": "Tata surya adalah susunan benda-benda langit yang beredar mengelilingi matahari sebagai pusatnya. Anggota tata surya meliputi matahari, delapan planet beserta satelitnya, planet kerdil, asteroid, komet, dan meteoroid.\n\n# Matahari\nMatahari adalah bintang, yaitu benda langit yang memancarkan cahaya dan panasnya sendiri. Matahari berbentuk bola gas raksasa yang sebagian besar tersusun atas hidrogen dan helium. Energi matahari dihasilkan oleh reaksi fusi nuklir di intinya. Jarak rata-rata bumi ke matahari sekitar 150 juta kilometer.\n\n# Planet\nPlanet adalah benda langit yang mengelilingi matahari, berbentuk hampir bulat, dan telah membersihkan lintasan orbitnya dari benda-benda lain. Urutan planet dari yang terdekat dengan matahari adalah:\n**Merkurius – Venus – Bumi – Mars – Yupiter – Saturnus – Uranus – Neptunus**\n\n[TABEL: Karakteristik Planet-Planet dalam Tata Surya]\n| Planet | Jenis | Ciri Khas |\n| Merkurius | Planet kebumian | Planet terkecil dan terdekat dengan matahari |\n| Venus | Planet kebumian | Planet terpanas karena atmosfernya tebal |\n| Bumi | Planet kebumian | Satu-satunya planet yang diketahui memiliki kehidupan |\n| Mars | Planet kebumian | Dijuluki planet merah |\n| Yupiter | Planet raksasa gas | Planet terbesar dalam tata surya |\n| Saturnus | Planet raksasa gas | Memiliki cincin yang sangat jelas |\n| Uranus | Planet raksasa es | Sumbu rotasinya sangat miring |\n| Neptunus | Planet raksasa es | Planet terjauh dari matahari |\n\nSejak tahun 2006, Pluto tidak lagi digolongkan sebagai planet, tetapi sebagai planet kerdil.\n\n# Benda Langit Lainnya\n- **Satelit** adalah benda langit yang mengelilingi planet. Bulan adalah satelit alami bumi.\n- **Asteroid** adalah benda langit berbatu berukuran kecil, banyak dijumpai di sabuk asteroid antara Mars dan Yupiter.\n- **Komet** adalah benda langit yang tersusun atas es dan debu. Ketika mendekati matahari, komet membentuk ekor yang selalu menjauhi matahari.\n- **Meteoroid** adalah pecahan benda langit. Jika memasuki atmosfer bumi dan terbakar, tampak sebagai **meteor** atau bintang jatuh. Sisa yang jatuh sampai ke permukaan bumi disebut **meteorit**.\n\n[GAMBAR: Susunan Planet dalam Tata Surya | Ilustrasi Penulis (2026) | matahari dan delapan planet sesuai urutan orbitnya]\n\n[STEM: Model Skala Tata Surya] Jika jarak bumi ke matahari (sekitar 150 juta km) diperkecil menjadi 1 m, jarak Neptunus ke matahari menjadi sekitar 30 m (matematika). Kalian dapat membuat model skala ini di lapangan sekolah (enjinering) untuk merasakan betapa luasnya tata surya. Data jarak planet dapat dicari dari situs lembaga antariksa (teknologi)."}, {"judul": "Pengaruh Gerak Bumi dan Bulan terhadap Kehidupan", "isi": "Bumi bergerak dengan dua cara, yaitu berputar pada porosnya (rotasi) dan beredar mengelilingi matahari (revolusi). Bulan pun berotasi dan beredar mengelilingi bumi. Gerakan-gerakan ini menimbulkan berbagai peristiwa yang memengaruhi kehidupan.\n\n# Rotasi Bumi\nBumi berotasi dari barat ke timur dengan periode sekitar 24 jam. Akibat rotasi bumi:\n- terjadi siang dan malam;\n- matahari tampak terbit di timur dan terbenam di barat (gerak semu harian matahari);\n- terdapat perbedaan waktu di berbagai tempat. Indonesia memiliki tiga zona waktu, yaitu WIB, WITA, dan WIT, dengan selisih masing-masing satu jam.\n\n# Revolusi Bumi\nBumi beredar mengelilingi matahari dengan periode sekitar 365,25 hari atau satu tahun. Sumbu bumi miring sekitar 23,5° terhadap garis tegak lurus bidang orbitnya. Akibat revolusi dan kemiringan sumbu bumi:\n- terjadi pergantian musim di daerah subtropis, yaitu musim semi, panas, gugur, dan dingin;\n- terjadi gerak semu tahunan matahari, yaitu matahari tampak bergeser antara garis balik utara dan garis balik selatan;\n- panjang siang dan malam berubah sepanjang tahun di daerah yang jauh dari khatulistiwa.\n\nIndonesia terletak di sekitar khatulistiwa sehingga panjang siang dan malam hampir sama sepanjang tahun. Musim di Indonesia, yaitu musim hujan dan kemarau, terutama dipengaruhi oleh angin muson.\n\n# Fase Bulan\nBulan tidak memancarkan cahaya sendiri, tetapi memantulkan cahaya matahari. Bagian bulan yang terkena cahaya matahari dan terlihat dari bumi berubah-ubah sesuai posisi bulan saat mengelilingi bumi. Perubahan bentuk bulan yang tampak ini disebut fase bulan, yaitu bulan baru, sabit, paruh (kuartal), cembung, dan purnama. Satu siklus fase bulan berlangsung sekitar 29,5 hari dan menjadi dasar kalender Hijriah.\n\n# Gerhana\n## Gerhana Matahari\nGerhana matahari terjadi ketika bulan berada di antara matahari dan bumi sehingga bayangan bulan jatuh ke permukaan bumi. Gerhana matahari terjadi pada fase bulan baru. Jangan melihat gerhana matahari secara langsung karena dapat merusak mata.\n## Gerhana Bulan\nGerhana bulan terjadi ketika bumi berada di antara matahari dan bulan sehingga bayangan bumi menutupi bulan. Gerhana bulan terjadi pada fase bulan purnama.\n\n[GAMBAR: Posisi Matahari, Bumi, dan Bulan saat Gerhana | Ilustrasi Penulis (2026) | diagram gerhana matahari dan gerhana bulan dengan bayangan umbra dan penumbra]\n\n# Pasang Surut Air Laut\nPasang surut air laut terutama disebabkan oleh gaya gravitasi bulan dan, dalam ukuran yang lebih kecil, gravitasi matahari. Pasang tertinggi terjadi saat bulan baru dan purnama ketika matahari, bumi, dan bulan berada hampir segaris. Nelayan dan petani garam memanfaatkan pengetahuan pasang surut untuk menentukan waktu melaut dan mengalirkan air laut ke tambak.\n\n[STEM: Tabel Pasang Surut untuk Nelayan] Badan Informasi Geospasial dan lembaga terkait menerbitkan prakiraan pasang surut (teknologi) berdasarkan perhitungan posisi bulan dan matahari (matematika dan sains). Nelayan menggunakan informasi ini untuk merencanakan waktu melaut yang aman, sedangkan insinyur menggunakannya untuk merancang dermaga dan tanggul (enjinering)."}, {"judul": "Perubahan Iklim Bumi dan Pengaruh Benda Langit", "isi": "Cuaca adalah keadaan udara pada waktu dan tempat tertentu yang relatif sempit, misalnya hujan pada sore hari ini di kota kalian. Iklim adalah rata-rata keadaan cuaca dalam jangka waktu panjang, sekitar 30 tahun, di wilayah yang luas.\n\n# Matahari sebagai Sumber Energi Iklim\nMatahari adalah sumber utama energi bagi sistem iklim bumi. Daerah di sekitar khatulistiwa menerima sinar matahari yang hampir tegak lurus sehingga bersuhu tinggi sepanjang tahun. Daerah di dekat kutub menerima sinar matahari yang miring sehingga bersuhu rendah. Perbedaan pemanasan ini menyebabkan pergerakan udara dan air laut yang membentuk pola iklim di bumi.\n\n# Efek Rumah Kaca\nAtmosfer bumi mengandung gas-gas seperti karbon dioksida (CO₂), metana (CH₄), dan uap air yang mampu menahan sebagian panas. Peristiwa ini disebut efek rumah kaca. Efek rumah kaca alami sangat penting karena tanpanya suhu rata-rata bumi akan sangat dingin.\n\n# Pemanasan Global dan Perubahan Iklim\nSejak revolusi industri, kegiatan manusia seperti pembakaran bahan bakar fosil, penebangan hutan, dan penumpukan sampah meningkatkan kadar gas rumah kaca di atmosfer. Akibatnya, suhu rata-rata bumi meningkat. Peristiwa ini disebut pemanasan global. Pemanasan global memicu perubahan iklim dengan dampak berikut:\n- es di kutub dan gletser mencair sehingga permukaan air laut naik;\n- cuaca ekstrem seperti kekeringan panjang dan hujan lebat menjadi lebih sering;\n- musim tanam menjadi sulit diperkirakan sehingga memengaruhi hasil pertanian;\n- terumbu karang memutih dan rusak akibat suhu laut yang meningkat.\n\n[GAMBAR: Dampak Pemanasan Global | Ilustrasi Penulis (2026) | kolase es kutub mencair, sawah kering, dan terumbu karang yang memutih]\n\n# Upaya Mengurangi Perubahan Iklim\n- Menghemat listrik dan menggunakan energi terbarukan, seperti tenaga surya dan angin.\n- Menggunakan transportasi umum, bersepeda, atau berjalan kaki.\n- Menanam pohon dan menjaga hutan.\n- Mengurangi sampah dan mengolah sampah organik menjadi kompos.\n\n[TABEL: Contoh Perhitungan Hemat Listrik di Rumah]\n| Perangkat | Daya | Lama Dihemat per Hari | Energi Dihemat per Bulan (30 hari) |\n| Lampu LED | 10 W | 5 jam | 1,5 kWh |\n| Kipas angin | 40 W | 2 jam | 2,4 kWh |\n| Televisi | 80 W | 1 jam | 2,4 kWh |\n\n[STEM: Panel Surya di Atap Sekolah] Panel surya mengubah cahaya matahari menjadi listrik (sains dan teknologi). Insinyur menentukan arah dan kemiringan panel agar menerima cahaya maksimal (enjinering), serta menghitung jumlah panel yang diperlukan berdasarkan kebutuhan listrik sekolah (matematika)."}], "dimensi": [{"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu menjelaskan peristiwa alam berdasarkan posisi bumi, bulan, dan matahari."}, {"dimensi": "Kewargaan", "indikator": "Siswa mampu melakukan tindakan nyata untuk mengurangi dampak perubahan iklim."}, {"dimensi": "Kreativitas", "indikator": "Siswa mampu merancang jam matahari sederhana dari bahan di sekitarnya."}], "rangkuman": ["Tata surya terdiri atas matahari sebagai pusat, delapan planet, satelit, planet kerdil, asteroid, komet, dan meteoroid.", "Rotasi bumi menyebabkan siang dan malam, gerak semu harian matahari, dan perbedaan waktu.", "Revolusi bumi dan kemiringan sumbunya menyebabkan pergantian musim dan gerak semu tahunan matahari.", "Fase bulan terjadi karena perubahan bagian bulan yang terkena cahaya matahari dan terlihat dari bumi.", "Gerhana matahari terjadi saat bulan berada di antara matahari dan bumi, sedangkan gerhana bulan terjadi saat bumi berada di antara matahari dan bulan.", "Pasang surut air laut terutama disebabkan oleh gaya gravitasi bulan.", "Peningkatan gas rumah kaca akibat kegiatan manusia menyebabkan pemanasan global dan perubahan iklim."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat menyebutkan anggota tata surya dan ciri-cirinya?", "Apakah setelah mempelajari bab ini kalian dapat menjelaskan akibat rotasi dan revolusi bumi?", "Apakah setelah mempelajari bab ini kalian dapat menjelaskan terjadinya gerhana dan pasang surut?", "Apakah setelah mempelajari bab ini kalian dapat melakukan tindakan untuk mengurangi dampak perubahan iklim?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Sebelum ada jam modern, banyak masyarakat menentukan waktu dari bayangan matahari. Jam matahari juga dapat menjadi media belajar yang menarik di halaman sekolah. Rancanglah jam matahari sederhana yang dapat menunjukkan waktu dengan selisih sekecil mungkin dari jam sungguhan.", "judul": "Jam Matahari Halaman Sekolah", "steam": {"S": "Memahami bahwa gerak semu harian matahari akibat rotasi bumi membuat panjang dan arah bayangan berubah sepanjang hari.", "T": "Menggunakan kompas atau aplikasi kompas pada telepon genggam untuk menentukan arah utara–selatan, serta jam digital sebagai pembanding.", "E": "Merancang papan jam dan tiang penunjuk (gnomon) yang tegak dan kokoh, menandai garis jam, lalu menguji dan memperbaikinya.", "M": "Mengukur panjang bayangan setiap jam, membuat grafik panjang bayangan terhadap waktu, dan menghitung selisih waktu dengan jam digital."}, "alat": ["Papan triplek bekas atau karton tebal", "Tongkat lurus atau pensil sebagai gnomon", "Kompas atau aplikasi kompas", "Penggaris, busur derajat, dan spidol", "Jam digital atau telepon genggam", "Batu atau pemberat"], "langkah": ["Empati dan Bertanya: Diskusikan cara masyarakat dahulu menentukan waktu, lalu rumuskan pertanyaan: dapatkah bayangan matahari digunakan untuk menentukan waktu secara akurat?", "Bertukar Pikiran: Bandingkan beberapa bentuk jam matahari, seperti jam horizontal dan jam bayangan tongkat, lalu pilih desain yang paling mudah dibuat.", "Mendesain Solusi: Buat sketsa papan jam, posisi gnomon, dan arah utara–selatan papan.", "Membuat Solusi: Pasang gnomon tegak lurus di tengah papan, letakkan papan di tempat terbuka yang datar, dan arahkan sesuai kompas.", "Menguji dan Mengevaluasi: Setiap satu jam dari pukul 08.00 sampai 14.00, tandai ujung bayangan dan tuliskan jamnya. Ukur panjang bayangan, lalu hari berikutnya bandingkan waktu yang ditunjukkan jam matahari dengan jam digital.", "Mendesain Ulang: Perbaiki posisi gnomon atau garis jam jika selisih waktu terlalu besar, lalu uji kembali.", "Mengomunikasikan: Sajikan grafik panjang bayangan terhadap waktu, jelaskan mengapa bayangan terpendek terjadi sekitar tengah hari, dan pasang jam matahari sebagai media belajar di sekolah."], "produk": "Produk akhir berupa jam matahari sederhana yang terpasang di halaman sekolah, tabel dan grafik panjang bayangan, serta penjelasan hubungan gerak semu matahari dengan rotasi bumi.", "kriteria": ["Ketepatan waktu yang ditunjukkan dibanding jam digital", "Ketepatan pengukuran dan grafik panjang bayangan", "Penjelasan konsep rotasi bumi dan gerak semu matahari", "Perbaikan desain berdasarkan hasil uji", "Kerja sama dan presentasi"], "pertanyaan": "Bagaimana merancang jam matahari dari bahan sederhana yang dapat menunjukkan waktu dengan selisih sekecil mungkin dari jam digital?", "prediksi": ["Menurut kalian, pada pukul berapa bayangan tongkat akan paling pendek? Jelaskan alasannya.", "Apakah arah bayangan pada pagi hari sama dengan arah bayangan pada sore hari? Mengapa?"], "sukses": ["Selisih waktu yang ditunjukkan jam matahari dengan jam digital tidak lebih dari 15 menit", "Gnomon tetap tegak lurus selama pengamatan", "Garis jam ditandai paling sedikit dari pukul 08.00 sampai 14.00"], "batasan": ["Menggunakan papan bekas dan tongkat atau pensil sebagai gnomon", "Dipasang di tempat terbuka yang datar dan tidak terhalang bayangan bangunan", "Arah papan ditentukan dengan kompas"], "data": {"kolom": ["Pukul (Jam Digital)", "Panjang Bayangan (cm)", "Arah Bayangan", "Waktu Menurut Jam Matahari", "Selisih (menit)"], "keterangan": "Tandai ujung bayangan setiap satu jam, lalu pada hari berikutnya bandingkan waktu jam matahari dengan jam digital."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan kebutuhan penanda waktu dan batasan pemasangan", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menjelaskan gerak semu harian matahari akibat rotasi bumi berbasis data bayangan", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Menguji, menghitung selisih waktu, dan merevisi posisi gnomon atau garis jam", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Mengukur panjang bayangan dengan tepat dan membuat grafik panjang bayangan terhadap waktu", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Bagaimana pengetahuan tentang gerak semu matahari dapat dimanfaatkan untuk menentukan arah atau mengatur posisi panel surya?"]}, "pg": [{"q": "Pusat sistem tata surya adalah ....", "opsi": [" function rebalanceKunci(){

    const t=next();

/* ================= NAVIGASI ================= */
function status(id){
  const b=book;
  const f=(x)=>x?'full':'';
  if(id==='mulai') return f(b.meta.judul&&b.meta.penulis[0]);
  if(id==='kerangka') return b.chapters.every(c=>c.judul&&c.subbab.every(s=>s.judul))?'full':(b.chapters.some(c=>c.judul)?'half':'');
  if(id==='prakata') return f(b.prakata);
  if(id==='acuan') return 'full';
  if(id==='mesin'){ const parts=book.chapters.length?book.chapters.map((c,i)=>status('bab'+i)):['']; return parts.every(x=>x==='full')&&book.prakata&&book.glosarium.length?'full':(parts.some(Boolean)?'half':''); }
  if(id==='cp') return f(b.cp);
  if(id.startsWith('bab')){ const c=b.chapters[+id.slice(3)]; if(!c) return ''; const parts=[c.apersepsi,c.subbab.every(s=>s.isi),c.rangkuman.length,c.ayoMencoba.judul&&auditOK(c),c.pg.length]; const n=parts.filter(Boolean).length; return n===parts.length?'full':n?'half':''; }
  if(id==='aas') return f(b.aas.pg.length);
  if(id==='glos') return f(b.glosarium.length);
  if(id==='pustaka') return f(b.pustaka.length);
  if(id==='profil') return f(b.profil[0]&&b.profil[0].nama);
  return '';
}
function renderNav(){
  const it=(id,t,n)=>`<button class="nav-i ${cur===id?'on':''}" onclick="go('${id}')"><span class="st ${status(id)}"></span><span class="t">${esc(t)}</span>${n?`<span class="n">${n}</span>`:''}</button>`;
  let h='<h6>Mesin</h6>'+it('mesin','⚡ Mesin Buku Otomatis')+'<h6>Persiapan</h6>'+it('mulai','Identitas & Pengaturan')+it('kerangka','Kerangka Buku');
  h+=it('acuan','🔒 Acuan STEM');

  h+='<h6>Isi Buku</h6>'+book.chapters.map((c,i)=>it('bab'+i,'BAB '+(i+1)+(c.judul?' · '+c.judul:''))).join('');
  h+='<h6>Bagian Akhir</h6>'+it('aas','Asesmen Akhir Semester')+it('glos','Glosarium')+it('pustaka','Daftar Pustaka')+it('profil','Profil Penulis');

}
function go(id){ cur=id; document.querySelector('nav.side').classList.remove('open'); render(); $('#main').scrollTop=0; }
function render(){

/* ---- binding generik: data-b="path" ---- */
function getPath(p){ return p.split('.').reduce((o,k)=>o==null?o:o[k],book); }
function setPath(p,val){ const ks=p.split('.'); const last=ks.pop(); const o=ks.reduce((o,k)=>o[k],book); o[last]=val; }
function bindAll(){
  document.querySelectorAll('[data-b]').forEach(el=>{
    const p=el.dataset.b, kind=el.dataset.k||'str';
    let v=getPath(p);
    if(kind==='lines') v=(v||[]).join('\n');
    if(kind==='csv') v=(v||[]).join(', ');
    if(kind==='pipe') v=(v||[]).map(x=>x[el.dataset.a]+' | '+x[el.dataset.c]).join('\n');
    if(kind==='cols'){ const cs=el.dataset.cols.split(','); v=(v||[]).map(x=>cs.map(c=>x[c]||'').join(' | ')).join('\n'); }
    if(el.type==='checkbox') el.checked=!!v; else el.value=v==null?'':v;
    const ev=(el.tagName==='SELECT'||el.type==='checkbox')?'change':'input';
    el.addEventListener(ev,()=>{
      let nv=el.type==='checkbox'?el.checked:el.value;
      if(kind==='lines') nv=lines(nv);
      if(kind==='csv') nv=String(nv).split(',').map(s=>s.trim()).filter(Boolean);
      if(kind==='num') nv=Math.max(1,Math.min(12,parseInt(nv)||1));
      if(kind==='cols'){ const cs=el.dataset.cols.split(','); nv=lines(nv).map(l=>{ const parts=l.split('|').map(x=>x.trim()); const o={}; cs.forEach((c,i)=>o[c]=i<cs.length-1?(parts[i]||''):parts.slice(i).join(' | ')); return o; }); }
      if(kind==='pipe') nv=lines(nv).map(l=>{ const [a,...r]=l.split('|'); return {[el.dataset.a]:(a||'').trim(),[el.dataset.c]:r.join('|').trim()}; });
      setPath(p,nv); persist();
      if(el.dataset.r) render(); else { renderNav(); const w=el.parentElement.querySelector('.wc'); if(w) w.textContent=wc(el.value)+' kata'; }
    });
  });
}
function F(label,path,o){ o=o||{}; const id='i'+Math.random().toString(36).slice(2,8);
  const attrs=`data-b="${path}" ${o.k?`data-k="${o.k}"`:''} ${o.cols?`data-cols="${o.cols}"`:''} ${o.a?`data-a="${o.a}" data-c="${o.c}"`:''} ${o.r?'data-r="1"':''} placeholder="${esc(o.ph||'')}"`;
  let inp;
  if(o.type==='area') inp=`<textarea ${attrs} rows="${o.rows||4}" class="${o.code?'code':''}"></textarea>`;
  else if(o.type==='select') inp=`<select ${attrs}>${o.opts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`;
  else inp=`<input type="${o.type||'text'}" ${attrs}>`;
  return `<label class="f">${label}${o.h?` <span class="h">${o.h}</span>`:''}${inp}</label>`;
}

function toolbar(path){

function ins(path,txt){
  const el=document.querySelector(`[data-b="${path}"]`); if(!el) return;
  const s=el.selectionStart, e=el.selectionEnd, v=el.value;
  let t=txt; const sel=v.slice(s,e);
  if(sel && /^\*\*teks\*\*$|^\*teks\*$/.test(txt)) t=txt.replace('teks',sel);
  el.value=v.slice(0,s)+t+v.slice(e); el.focus(); el.selectionStart=el.selectionEnd=s+t.length; el.dispatchEvent(new Event('input'));
}

let figKeys=[];
function upImg(inp,fi){ const key=figKeys[fi];
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const max=1400; const sc=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc); const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(im,0,0,cv.width,cv.height); book.images[key]=cv.toDataURL('image/jpeg',0.85); persist(); render(); toast('Gambar ditambahkan.'); }; im.src=r.result; }; r.readAsDataURL(f);
}

function listHTML(arr,ol){ arr=arr||[]; if(!arr.length) return '<p class="empty">(belum diisi)</p>'; return (ol?'<ol>':'<ul>')+arr.map(x=>'<li>'+S.inlineHTML(x)+'</li>').join('')+(ol?'</ol>':'</ul>'); }
function pgHTML(pg,esai){
  return `<p><b>A. Pilihan Ganda</b></p><p><i><b>Pilihlah jawaban yang paling tepat dengan memberikan tanda silang (X) pada huruf A, B, C, atau D!</b></i></p>`+
   ((pg||[]).length?'<ol>'+pg.map(q=>`<li>${S.inlineHTML(q.q)}<div style="margin-left:.4cm">${(q.opsi||[]).map((o,i)=>`${'ABCD'[i]}. ${S.inlineHTML(o)}`).join('<br>')}</div></li>`).join('')+'</ol>':'<p class="empty">(belum ada soal)</p>')+
   `<p><b>B. Esai</b></p><p><i><b>Jawablah pertanyaan di bawah ini dengan jelas dan benar!</b></i></p>${listHTML(esai,true)}`;
}

      <h4>Ayo Mencoba</h4><p class="pv-p">${S.inlineHTML(c.ayoMencoba.pengantar)}</p>${c.ayoMencoba.judul?`<p style="color:#0b6e4f;font-weight:700">Proyek STEM: ${esc(c.ayoMencoba.judul)}</p>`:''}

      ${(c.ayoMencoba.prediksi||[]).length?'<p><b>Sebelum Memulai: Prediksi Awal</b></p>'+listHTML(c.ayoMencoba.prediksi,true):''}
      <table><tr><th>Unsur STEM</th><th>Fungsi Nyata dalam Pemecahan Masalah</th></tr>${[['S','Science (Sains)'],['T','Technology (Teknologi)'],['E','Engineering (Enjinering)'],['M','Mathematics (Matematika)']].map(([k,n])=>`<tr><td><b>${k}</b> – ${n}</td><td>${esc(c.ayoMencoba.steam[k])}</td></tr>`).join('')}</table>
      ${(c.ayoMencoba.sukses||[]).length||(c.ayoMencoba.batasan||[]).length?'<p><b>Kriteria Keberhasilan dan Batasan</b></p><p class="pv-p"><b>Berhasil jika:</b></p>'+listHTML(c.ayoMencoba.sukses)+'<p class="pv-p"><b>Batasan:</b></p>'+listHTML(c.ayoMencoba.batasan):''}${c.ayoMencoba.alat.length?'<p><b>Alat dan Bahan</b></p>'+listHTML(c.ayoMencoba.alat):''}${c.ayoMencoba.langkah.length?'<p><b>Langkah Kerja (7 Tahap STEM)</b></p>'+listHTML(c.ayoMencoba.langkah,true):''}${c.ayoMencoba.produk?'<p><b>Produk dan Presentasi</b></p><p class="pv-p">'+S.inlineHTML(c.ayoMencoba.produk)+'</p>':''}${(c.ayoMencoba.data&&c.ayoMencoba.data.kolom||[]).length?'<p><b>Lembar Data Pengujian</b></p><p class="pv-p">'+S.inlineHTML(c.ayoMencoba.data.keterangan||'')+'</p><table><tr>'+c.ayoMencoba.data.kolom.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr>'+[1,2,3].map(()=>'<tr>'+c.ayoMencoba.data.kolom.map(()=>'<td>&nbsp;</td>').join('')+'</tr>').join('')+'</table>':''}

  pages+=`<div class="pgx"><h2 class="bab">ASESMEN AKHIR SEMESTER</h2>${pgHTML(book.aas.pg,book.aas.esai)}</div>`;
  pages+=`<div class="pgx"><h2 class="bab">GLOSARIUM</h2>${book.glosarium.slice().sort((a,b)=>String(a.istilah).localeCompare(String(b.istilah),'id')).map(g=>`<p class="pv-p"><b>${esc(g.istilah)}</b> : ${S.inlineHTML(g.arti)}</p>`).join('')||'<p class="empty">(belum diisi)</p>'}</div>`;
  pages+=`<div class="pgx"><h2 class="bab">DAFTAR PUSTAKA</h2>${allPustaka().sort((a,b)=>a.replace(/\*/g,'').localeCompare(b.replace(/\*/g,''),'id')).map(p=>`<p class="pv-p" style="padding-left:1cm;text-indent:-1cm">${S.inlineHTML(p)}</p>`).join('')||'<p class="empty">(belum diisi)</p>'}</div>`;
  return `<h1 class="pt">Pratinjau & Ekspor</h1><p class="sub">Unduh naskah Word dengan ukuran 17,6 × 25 cm dan gaya paragraf template penerbit (A., 1., a., gambar, tabel), lengkap dengan Daftar Isi, Daftar Tabel, Daftar Gambar, Sumber Kredit Gambar, dan Indeks bernomor halaman otomatis.</p>
  <div class="card"><div class="hd"><h3>✅ Kelengkapan Naskah</h3><span class="sp"></span><label class="row" style="font-size:13px"><input type="checkbox" data-b="kunci"> Sertakan kunci jawaban</label><button class="btn pri" onclick="exportDocx()">⬇ Unduh .docx</button><button class="btn pri" onclick="saveToDrive()">☁ Simpan ke Drive</button><button class="btn" onclick="saveProject()">Simpan Proyek (.json)</button><button class="btn" onclick="bukaGamePapan()">🎮 Game Papan Interaktif</button><button class="btn" onclick="bukaBookToGame()">📚 Book to Game</button></div>
   <div class="chk">${checks.map(([t,s])=>`<div class="${s==='full'?'ok':''}">${esc(t)}</div>`).join('')}</div>
   <p class="hint" style="margin-top:10px">Saat dibuka di Word, pilih <b>Ya</b> bila diminta memperbarui kolom (fields) agar nomor halaman daftar isi dan indeks terisi.</p></div>
  <div class="pv">${pages}</div>`;

/* ================= GAME PAPAN INTERAKTIF =================
   Membuka Arena Papan STEM dengan buku ini: 3 game (Duel Kilat, Memori Istilah,
   Susun Langkah Proyek) dibuat otomatis dari soal, glosarium, dan langkah proyek. */
function bukaGamePapan(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(book)); }catch(e){}
  const salin=JSON.parse(JSON.stringify(book)); salin.images={}; salin.profil=[]; if(salin.meta) salin.meta.penulis=[];
  const url=new URL('../game-papan-stem/index.html?sumber=serat-stem', location.href).href;
  const w=window.open(url,'_blank');
  if(!w){ toast('Izinkan pop-up untuk membuka Game Papan, atau buka menu Koleksi › Arena Papan STEM.',true); return; }
  const kirim=e=>{ if(e.source===w && e.data && e.data.type==='gp-minta'){ w.postMessage({type:'gp-buku',buku:salin},'*'); window.removeEventListener('message',kirim); } };
  window.addEventListener('message',kirim);
}

/* Book to Game: buku yang sedang ditulis langsung menjadi game petualangan.
   Di koleksi (asal yang sama) game ikut berubah otomatis setiap naskah disimpan. */
function bukaBookToGame(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(book)); }catch(e){}
  const salin=JSON.parse(JSON.stringify(book)); salin.profil=[]; if(salin.meta) salin.meta.penulis=[];
  const w=window.open(new URL('../book-to-game/index.html?sumber=serat-stem', location.href).href,'_blank');
  if(!w){ toast('Izinkan pop-up untuk membuka Book to Game.',true); return; }
  const kirim=e=>{ if(e.source===w && e.data && e.data.type==='b2g-minta'){ w.postMessage({type:'b2g-buku',buku:salin},'*'); window.removeEventListener('message',kirim); } };
  window.addEventListener('message',kirim);
}

document.addEventListener('change',e=>{
  if(e.target.id==='cfgEngine'){ cfg.engine=e.target.value; saveCfg(); updatePill(); render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='cfgKey'){ cfg.key=e.target.value.trim(); saveCfg(); updatePill(); }
  if(e.target.id==='cfgModel'){ cfg.model=e.target.value.trim(); saveCfg(); }
  if(e.target.id==='cfgDrive'){ cfg.driveUrl=e.target.value.trim(); saveCfg(); }
});
const _render=render;
render=function(){ syncCP(); _render(); const a=$('#cfgEngine'); if(a){ a.value=cfg.engine; $('#cfgKey').value=cfg.key; $('#cfgModel').value=cfg.model; $('#cfgDrive').value=cfg.driveUrl||''; } };
render();
updatePill();
setTimeout(initCaps,0);
</script>
