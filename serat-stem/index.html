<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SERAT STEM — Penulis Naskah Buku Berbasis STEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{
  --ink:#16302a; --ink2:#46605a; --muted:#7b8f8a; --line:#e3e0d6; --paper:#fbf8f2; --card:#ffffff;
  --brand:#0b5d46; --brand2:#0e7a5c; --brandSoft:#e4f2ec; --warn:#b45309; --warnSoft:#fef3c7; --err:#b91c1c;
  --S:#2563eb; --T:#7c3aed; --E:#ea580c; --M:#059669;
  --r:12px; --sh:0 1px 2px rgba(22,48,42,.06),0 4px 16px rgba(22,48,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header.top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--brand);color:#fff;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-family:Fraunces,serif;font-size:24px;letter-spacing:.5px}
.logo .stem{display:inline-flex;gap:2px;margin-left:2px}
.logo .stem i{font-style:normal;font-weight:700;font-size:12px;width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;color:#fff}
.logo small{opacity:.85;font-size:12.5px}
.top .sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;color:#fff}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}
.pill.ok .dot{background:#34d399}
.tbtn{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.12)}
.tbtn.solid{background:#fff;color:var(--brand);border-color:#fff}
.body{display:grid;grid-template-columns:270px 1fr;min-height:0}
nav.side{border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px;background:#f6f2e9}
.side h6{margin:14px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13.5px}
.nav-i:hover{background:#ece6d8}
.nav-i.on{background:var(--brand);color:#fff}
.nav-i .st{width:9px;height:9px;border-radius:50%;border:2px solid #b9b2a2;flex:none}
.nav-i .st.half{background:linear-gradient(90deg,#d97706 50%,transparent 50%);border-color:#d97706}
.nav-i .st.full{background:var(--brand2);border-color:var(--brand2)}
.nav-i.on .st{border-color:#fff}
.nav-i .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .n{font-size:11px;opacity:.7}
main{overflow:auto;padding:22px 28px 80px}
.wrap{max-width:980px;margin:0 auto}
h1.pt{font-family:Fraunces,serif;font-size:28px;margin:0 0 4px;font-weight:700}
.sub{color:var(--ink2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px 16px;margin-bottom:16px}
.card h3{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card .hd .sp{flex:1}
.card .hint{color:var(--muted);font-size:12.5px;margin:-6px 0 10px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brandSoft);color:var(--brand)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink2)}
label.f span.h{font-weight:400;color:var(--muted);font-size:11.5px}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid #d6d1c4;border-radius:8px;padding:8px 10px;background:#fff;width:100%;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:70px;line-height:1.55}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;min-height:260px;background:#fffdf8}
input:focus,select:focus,textarea:focus{outline:2px solid #9bd3bf;border-color:var(--brand2)}
.btn{border:1px solid #cfc9ba;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{background:#f6f2e9}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand2)}
.btn.ai{background:linear-gradient(135deg,#0b5d46,#2563eb);border:0;color:#fff}
.btn.ai:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.del{color:var(--err)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;background:#f6f2e9;border:1px solid #e3ddcf;border-bottom:0;border-radius:8px 8px 0 0}
.tb + textarea{border-radius:0 0 8px 8px}
.tb button{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;font-weight:600;color:var(--ink2)}
.tb button:hover{background:#fff;border-color:#ddd5c4}
.wc{font-size:11.5px;color:var(--muted);margin-left:auto;padding-right:4px;align-self:center}
.note{background:var(--warnSoft);border:1px solid #fcd34d;color:#78350f;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.note.info{background:#e8f1fd;border-color:#bcd3f5;color:#1e3a8a}
.chapters .ch{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fffdf9}
.ch .chh{display:flex;gap:8px;align-items:center}
.ch .num{font-family:Fraunces,serif;font-weight:700;color:var(--brand);min-width:56px}
.stem4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stem4 label.f{border-left:4px solid var(--c);padding-left:10px}
.stem4 .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--c);color:#fff;font-size:11px;margin-right:6px}
.pg{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fffdf9}
.pg .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pg .opts label{display:flex;gap:6px;align-items:center;font-size:12.5px}
.pg .opts input[type=radio]{accent-color:var(--brand)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fig{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fffdf9;font-size:12.5px}
.fig .im{height:110px;border-radius:6px;background:#f1eee6 center/contain no-repeat;display:grid;place-items:center;color:var(--muted);font-size:11.5px;text-align:center;padding:6px;margin-bottom:6px}
.prog{position:fixed;right:18px;bottom:18px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.15);border-radius:12px;padding:12px 14px;width:340px;display:none;z-index:50}
.prog.on{display:block}
.prog .bar{height:6px;background:#eee;border-radius:9px;overflow:hidden;margin:8px 0}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--S),var(--T),var(--E),var(--M));width:0;transition:width .3s}
.prog .msg{font-size:12.5px;color:var(--ink2)}
.prog .live{font-size:11.5px;color:var(--muted);max-height:70px;overflow:hidden;margin-top:6px;white-space:pre-wrap}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.toast.err{background:var(--err)}
.modal{position:fixed;inset:0;background:rgba(10,25,20,.45);display:none;place-items:center;z-index:70;padding:16px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-family:Fraunces,serif}
/* pratinjau buku */
.pv{background:#d9d4c7;border-radius:12px;padding:24px 0}
.pv .pgx{width:17.6cm;max-width:calc(100% - 24px);min-height:12cm;margin:0 auto 18px;background:#fff;padding:1.4cm 1.4cm 1.4cm 1.8cm;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:"Trebuchet MS",Tahoma,sans-serif;font-size:10.5pt;color:#111;line-height:1.45}
.pv h2.bab{text-align:center;font-family:"Arial Rounded MT Bold","Plus Jakarta Sans",sans-serif;font-size:13pt;margin:0 0 18px}
.pv h4{font-family:"Arial Rounded MT Bold","Plus Jakarta Sans",sans-serif;font-size:11.5pt;margin:14px 0 6px}
.pv .pv-p{text-align:justify;margin:0 0 6px}
.pv .pv-h1,.pv .pv-h2,.pv .pv-h3{font-weight:700;margin:10px 0 4px}
.pv .pv-num{display:inline-block;min-width:.55cm}
.pv .pv-li{margin:0 0 3px}
.pv ol{margin:0 0 6px;padding-left:.9cm}
.pv .pv-steam{background:#eaf6f1;border-left:5px solid #0b9e6f;padding:8px 12px;margin:8px 0;font-size:10pt;text-align:justify}
.pv .pv-steam-t{font-weight:700;color:#0b6e4f;margin-bottom:3px}
.pv .pv-fig{margin:10px auto;text-align:center}
.pv .pv-fig img{max-width:7.5cm;max-height:6cm}
.pv .pv-figph{width:7.4cm;height:3.4cm;margin:0 auto;border:2px dashed #8b97a5;background:#f3f5f8;display:grid;place-items:center;color:#5b6776;font-size:9pt;padding:6px}
.pv figcaption{font-family:Tahoma,sans-serif;font-size:9.5pt;margin-top:4px}
.pv figcaption span{font-size:9pt}
.pv .pv-tabt{text-align:center;font-weight:700;font-family:Tahoma,sans-serif;font-size:9.5pt;margin:10px 0 4px}
.pv table{border-collapse:collapse;width:100%;font-size:9.5pt;margin:4px 0 10px}
.pv th,.pv td{border:1px solid #333;padding:3px 6px;vertical-align:top}
.pv th{background:#e7eef7}
.pv .pk{display:grid;gap:0;border:1px solid #333;margin:6px 0 10px}
.pv .pk .r1{background:#d5efe4;text-align:center;font-weight:700;padding:6px;border-bottom:1px solid #333}
.pv .pk .r2{display:grid}
.pv .pk .r2>div{background:#fff6e0;padding:6px;font-size:9pt;border-right:1px solid #333}
.pv .pk .r2>div:last-child{border-right:0}
.pv .empty{color:#aaa;font-style:italic}
.cbt{border-collapse:collapse;width:100%;font-size:13px}.cbt th,.cbt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.cbt th{background:var(--brandSoft);color:var(--brand)}
.audit{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:#f6f8f4;border:1px dashed #b9d8c8;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:12.5px}.audit b{width:100%}.audit .y{color:var(--brand2)}.audit .n{color:var(--err)}
.mlog{margin-top:14px;max-height:360px;overflow:auto;font-size:13px;border-top:1px solid var(--line);padding-top:8px}.mlog .lg{display:flex;gap:8px;padding:3px 0}.mlog .lg small{color:var(--muted)}.mlog .lg.err{color:var(--err)}.mlog .lg.run{font-weight:700;color:var(--brand)}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px}
.chk div::before{content:"○ ";color:#b45309}
.chk div.ok::before{content:"● ";color:var(--brand2)}
@media (max-width:860px){.body{grid-template-columns:1fr}nav.side{display:none}nav.side.open{display:block;position:fixed;inset:56px 0 0 0;z-index:40}.g2,.g3,.g4,.stem4,.pg .opts,.chk{grid-template-columns:1fr}main{padding:16px}.menu-btn{display:inline-flex!important}}
.menu-btn{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="tbtn menu-btn" onclick="document.querySelector('nav.side').classList.toggle('open')">☰</button>
    <div class="logo"><b>SERAT</b><span class="stem"><i style="background:var(--S)">S</i><i style="background:var(--T)">T</i><i style="background:var(--E)">E</i><i style="background:var(--M)">M</i></span><small>Penulis Naskah Buku Berbasis STEM</small></div>
    <span class="sp"></span>
    <button class="pill" id="aiPill" onclick="go('mulai');setTimeout(()=>document.getElementById('aiCard').scrollIntoView({behavior:'smooth'}),50)"><span class="dot"></span><span id="aiPillT">Mesin AI: memeriksa…</span></button>
    <button class="tbtn" onclick="newProject()">Baru</button>
    <button class="tbtn" onclick="openDialog()">Buka</button>
    <button class="tbtn" onclick="saveProject()">Simpan Proyek</button>
    <button class="tbtn" onclick="saveToDrive()">☁ Simpan ke Drive</button>
    <button class="tbtn solid" onclick="exportDocx()">⬇ Unduh .docx</button>
    <button class="tbtn" onclick="bukaGamePapan()" title="Buat 3 game papan interaktif dari buku ini">🎮 Game Papan</button>
    <button class="tbtn" onclick="bukaBookToGame()" title="Jadikan buku ini game petualangan edukasi">📚 Book to Game</button>
    <input type="file" id="fOpen" accept=".json,application/json" hidden onchange="openProject(this)">
  </header>
  <div class="body">
    <nav class="side" id="side"></nav>
    <main id="main"><div class="wrap" id="view"></div></main>
  </div>
</div>
<div class="prog" id="prog"><b id="progT">Menulis…</b><div class="bar"><i id="progBar"></i></div><div class="msg" id="progMsg"></div><div class="msg" id="progClock" style="font-variant-numeric:tabular-nums;opacity:.75"></div><div class="live" id="progLive"></div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="cancelAI()">Hentikan</button></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
/* SERAT STEM — inti: parser markup naskah, pratinjau HTML, dan ekspor .docx sesuai template */
(function (root) {
  'use strict';

  const ROMAN_UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const ALPHA = 'abcdefghijklmnopqrstuvwxyz';

  /* ---------- Parser markup ----------
     # Judul            -> sub-sub bab bernomor 1., 2., ...
     ## Judul           -> a., b., ...
     ### Judul          -> 1), 2), ...
     - teks             -> butir daftar
     [GAMBAR: judul | sumber | deskripsi]
     [TABEL: judul] lalu baris | sel | sel |
     [STEM: judul] isi -> kotak Pojok STEM
     **tebal**, *miring*
  */
  function stripNum(t) {
    return t.replace(/^\s*(\d+[.)]|[a-zA-Z][.)])\s+/, '').trim();
  }
  function parseMarkup(src) {
    const lines = String(src || '').replace(/\r/g, '').split('\n');
    const blocks = [];
    let c1 = 0, c2 = 0, c3 = 0, lvl = 0, i = 0;
    while (i < lines.length) {
      let ln = lines[i];
      const t = ln.trim();
      if (!t) { i++; continue; }
      let m;
      if ((m = t.match(/^###\s+(.*)$/))) { c3++; blocks.push({ t: 'h3', num: c3 + ')', text: stripNum(m[1]) }); lvl = 3; i++; continue; }
      if ((m = t.match(/^##\s+(.*)$/))) { c2++; c3 = 0; blocks.push({ t: 'h2', num: ALPHA[(c2 - 1) % 26] + '.', text: stripNum(m[1]) }); lvl = 2; i++; continue; }
      if ((m = t.match(/^#\s+(.*)$/))) { c1++; c2 = 0; c3 = 0; blocks.push({ t: 'h1', num: c1 + '.', text: stripNum(m[1]) }); lvl = 1; i++; continue; }
      if ((m = t.match(/^\[GAMBAR\s*:\s*(.*?)\]\s*$/i))) {
        const p = m[1].split('|').map(s => s.trim());
        blocks.push({ t: 'fig', title: p[0] || 'Ilustrasi', src: (p[1] || '').replace(/^sumber\s*:\s*/i, ''), desc: p[2] || '', lvl });
        i++; continue;
      }
      if ((m = t.match(/^\[TABEL\s*:\s*(.*?)\]\s*$/i))) {
        const rows = []; i++;
        while (i < lines.length && /^\s*\|/.test(lines[i])) {
          const r = lines[i].trim().replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(s => s.trim());
          if (!r.every(c => /^:?-{2,}:?$/.test(c) || c === '')) rows.push(r);
          i++;
        }
        blocks.push({ t: 'tab', title: m[1], rows, lvl });
        continue;
      }
      if ((m = t.match(/^\[STEA?M\s*:\s*(.*?)\]\s*(.*)$/i))) {
        let body = m[2]; i++;
        while (i < lines.length && lines[i].trim() && !/^(#|\[|-\s|\|)/.test(lines[i].trim())) { body += ' ' + lines[i].trim(); i++; }
        blocks.push({ t: 'steam', title: m[1] || 'Pojok STEM', text: body.trim(), lvl });
        continue;
      }
      if ((m = t.match(/^[-•]\s+(.*)$/))) { blocks.push({ t: 'li', text: m[1], lvl }); i++; continue; }
      // paragraf: gabungkan baris berturutan
      let para = t; i++;
      while (i < lines.length && lines[i].trim() && !/^(#|\[|[-•]\s|\|)/.test(lines[i].trim())) { para += ' ' + lines[i].trim(); i++; }
      blocks.push({ t: 'p', text: para, lvl });
    }
    return blocks;
  }

  // inline **tebal** *miring*
  function inlineTokens(text) {
    const out = [];
    const re = /(\*\*[^*]+\*\*|\*[^*]+\*)/g;
    let last = 0, m;
    const s = String(text || '');
    while ((m = re.exec(s))) {
      if (m.index > last) out.push({ text: s.slice(last, m.index) });
      const tok = m[0];
      if (tok.startsWith('**')) out.push({ text: tok.slice(2, -2), bold: true });
      else out.push({ text: tok.slice(1, -1), italics: true });
      last = m.index + tok.length;
    }
    if (last < s.length) out.push({ text: s.slice(last) });
    return out;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function inlineHTML(text) {
    return inlineTokens(text).map(t => t.bold ? '<b>' + esc(t.text) + '</b>' : t.italics ? '<i>' + esc(t.text) + '</i>' : esc(t.text)).join('');
  }

  /* ---------- Penomoran gambar & tabel per bab ---------- */
  function figKey(ch, title) { return 'b' + ch + '::' + String(title).toLowerCase().trim(); }

  function collectChapter(book, ci) {
    const ch = book.chapters[ci];
    const n = ci + 1;
    let fig = 0, tab = 0;
    const figs = [], tabs = [];
    const parts = [{ key: 'apersepsi', blocks: parseMarkup(ch.apersepsi) }];
    (ch.subbab || []).forEach((sb, si) => parts.push({ key: 's' + si, blocks: parseMarkup(sb.isi) }));
    parts.forEach(pt => pt.blocks.forEach(b => {
      if (b.t === 'fig') { fig++; b.no = n + '.' + fig; b.bm = '_fig_' + n + '_' + fig; b.key = figKey(n, b.title); figs.push(b); }
      if (b.t === 'tab') { tab++; b.no = n + '.' + tab; b.bm = '_tab_' + n + '_' + tab; tabs.push(b); }
    }));
    return { parts, figs, tabs };
  }

  /* ---------- Pratinjau HTML ---------- */
  function blocksHTML(blocks, book, baseInd) {
    const ind = l => (baseInd + (l || 0) * 0.5) + 'cm';
    return blocks.map(b => {
      switch (b.t) {
        case 'h1': return `<p class="pv-h1" style="margin-left:${ind(1)}"><span class="pv-num">${b.num}</span>${inlineHTML(b.text)}</p>`;
        case 'h2': return `<p class="pv-h2" style="margin-left:${ind(2)}"><span class="pv-num">${b.num}</span>${inlineHTML(b.text)}</p>`;
        case 'h3': return `<p class="pv-h3" style="margin-left:${ind(3)}"><span class="pv-num">${b.num}</span>${inlineHTML(b.text)}</p>`;
        case 'li': return `<p class="pv-li" style="margin-left:${ind(b.lvl)}">•&nbsp;&nbsp;${inlineHTML(b.text)}</p>`;
        case 'p': return `<p class="pv-p" style="margin-left:${ind(b.lvl)}">${inlineHTML(b.text)}</p>`;
        case 'steam': return `<div class="pv-steam" style="margin-left:${ind(b.lvl)}"><div class="pv-steam-t">🔬 ${esc(b.title)}</div>${inlineHTML(b.text)}</div>`;
        case 'fig': {
          const img = book.images && book.images[b.key];

  /* ---------- Ekspor DOCX ---------- */
  const PAGE = { w: 9979, h: 14175, top: 1134, right: 1134, bottom: 1134, left: 1418 };
  const CONTENT_W = PAGE.w - PAGE.left - PAGE.right; // 7427
  const IND = [284, 568, 851, 1135, 1418];
  const BODY_FONT = 'Trebuchet MS';
  const HEAD_FONT = 'Arial Rounded MT Bold';

  function buildDocx(D, book, opts) {
    opts = opts || {};
    const { Document, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, BorderStyle,

    const meta = book.meta || {};

    const toc = [], tocTab = [], tocFig = [];

    function secTitle(text, id, opt) {

    function compHead(text, id, toToc) {
      if (toToc) toc.push({ text, id, lvl: 1 });

        indent: { left: 0, hanging: 0 }, children: [toToc ? new Bookmark({ id, children: [r] }) : r] });
    }
    function bodyP(text, ind, extra) {
      return para(Object.assign({ alignment: AlignmentType.JUSTIFIED, spacing, indent: { left: ind || 0 }, children: B(text) }, extra || {}));
    }
    function numItem(num, text, left, bold, hang) {
      hang = hang || 284;
      return para({ alignment: AlignmentType.JUSTIFIED, spacing: { line: 276, after: 40 }, indent: { left, hanging: hang },
        tabStops: [{ type: TabStopType.LEFT, position: left }],
        children: [new TextRun({ text: num + '\t', font: BODY_FONT, size: 22, bold })].concat(B(text, bold ? { bold: true } : {})) });
    }
    const thin = { style: BorderStyle.SINGLE, size: 4, color: '000000' };

    function cell(text, o) {

        shading: o.shade ? { type: ShadingType.CLEAR, color: 'auto', fill: o.shade } : undefined,
        margins: { top: 60, bottom: 60, left: 100, right: 100 },
        children: lines.map(l => para({ alignment: o.center ? AlignmentType.CENTER : AlignmentType.LEFT, spacing: { after: 0 },
          children: B(l, { size: o.size || 20, bold: o.bold }) }))
      });
    }
    function table(rows, widths, headRows) {
      headRows = headRows == null ? 1 : headRows;
      const total = widths.reduce((a, b) => a + b, 0);
      return new Table({
        width: { size: total, type: WidthType.DXA }, columnWidths: widths, borders,
        rows: rows.map((r, ri) => new TableRow({
          tableHeader: ri < headRows,
          children: r.map((c, ci) => (c instanceof TableCell) ? c : cell(c, { w: widths[ci], bold: ri < headRows, shade: ri < headRows ? 'E7EEF7' : null, center: ri < headRows }))
        }))

    }
    function caption(kind, no, title, id, list) {
      list.push({ text: kind + ' ' + no + ' ' + title, id });
      return para({ style: kind === 'Gambar' ? 'gambarcaption' : 'judultabel', alignment: AlignmentType.CENTER, keepNext: kind === 'Tabel',
        spacing: { before: kind === 'Gambar' ? 40 : 160, after: kind === 'Gambar' ? 0 : 60 },
        children: [new Bookmark({ id, children: [new TextRun({ text: kind + ' ' + no + ' ', bold: true, font: 'Tahoma', size: 20 })] })]
          .concat(inlineTokens(title).map(t => new TextRun({ text: t.text, italics: t.italics, bold: kind === 'Tabel', font: 'Tahoma', size: 20 }))) });
    }
    function imageSize(dataUrl) {
      const m = dataUrl.match(/^data:image\/(png|jpe?g|gif|bmp);base64,(.*)$/);
      if (!m) return null;
      const bin = typeof atob === 'function' ? atob(m[2]) : Buffer.from(m[2], 'base64').toString('binary');
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      let w = 0, h = 0;
      if (m[1] === 'png') { w = (u8[16] << 24 | u8[17] << 16 | u8[18] << 8 | u8[19]); h = (u8[20] << 24 | u8[21] << 16 | u8[22] << 8 | u8[23]); }
      else if (/jpe?g/.test(m[1])) {
        let p = 2;
        while (p < u8.length) {
          if (u8[p] !== 0xFF) { p++; continue; }
          const mk = u8[p + 1];
          if (mk >= 0xC0 && mk <= 0xC3) { h = u8[p + 5] << 8 | u8[p + 6]; w = u8[p + 7] << 8 | u8[p + 8]; break; }

        if (am.data.keterangan) children.push(bodyP(am.data.keterangan, 284));
        const ncol = dk.length, wcol = Math.floor((CONTENT_W - 284) / ncol);
        const rows = [dk].concat([1, 2, 3, 4].map(() => dk.map(() => '')));
        const tb = table(rows, Array(ncol).fill(wcol), 1);
        children.push(tb);
      }
      if (am.produk) { children.push(sub('Produk dan Presentasi')); children.push(bodyP(am.produk, 284)); }
      const rb = am.rubrik || [];
      if (rb.length) {
        children.push(sub('Rubrik Penilaian Proyek'));
        children.push(bodyP('Yang dinilai adalah kualitas proses berpikir, bukan sekadar kerapian produk. Prototipe yang gagal tetapi dianalisis kelemahannya tetap bernilai tinggi.', 284));
        children.push(table([['Aspek', 'Skor 4 (Sangat Baik)', 'Skor 1 (Perlu Bimbingan)']].concat(rb.map(r => [r.aspek, r.skor4, r.skor1])), [1700, 2864, 2863], 1));
        children.push(para({ spacing: { before: 60, after: 80 }, children: B('*Nilai akhir (opsional) = jumlah skor ÷ ' + (rb.length * 4) + ' × 100.*', { size: 19 }) }));
      } else if ((am.kriteria || []).length) {
        children.push(sub('Kriteria Penilaian Proyek')); am.kriteria.forEach(a => children.push(numItem('•', a, 568)));
      }
      if ((am.refleksi || []).length) {
        children.push(sub('Refleksi Diri (dijawab masing-masing)'));
        am.refleksi.forEach((a, i) => children.push(numItem((i + 1) + '.', a, 568)));
      }

      // Asesmen Sumatif
      children.push(compHead('Asesmen Sumatif', id + '_as', true));
      pushAsesmen(ch.pg || [], ch.esai || [], ch.hots || []);
      kunci.push({ judul: 'Bab ' + n, pg: ch.pg || [] });
    });

    function pushAsesmen(pg, esai, hots) {
      children.push(para({ style: 'A0', spacing: { before: 120, after: 40 }, indent: { left: 284, hanging: 284 }, children: [new TextRun({ text: 'A.\tPilihan Ganda', bold: true, font: BODY_FONT, size: 22 })], tabStops: [{ type: TabStopType.LEFT, position: 284 }] }));
      children.push(para({ spacing: { after: 80 }, indent: { left: 284 }, children: [new TextRun({ text: 'Pilihlah jawaban yang paling tepat dengan memberikan tanda silang (X) pada huruf A, B, C, atau D!', bold: true, italics: true, font: BODY_FONT, size: 22 })] }));
      pg.forEach((q, i) => {
        children.push(numItem((i + 1) + '.', q.q, 568));
        (q.opsi || []).forEach((o, oi) => children.push(numItem('ABCD'[oi] + '.', o, 852)));
      });
      children.push(para({ style: 'A0', spacing: { before: 200, after: 40 }, indent: { left: 284, hanging: 284 }, children: [new TextRun({ text: 'B.\tEsai', bold: true, font: BODY_FONT, size: 22 })], tabStops: [{ type: TabStopType.LEFT, position: 284 }] }));
      children.push(para({ spacing: { after: 80 }, indent: { left: 284 }, children: [new TextRun({ text: 'Jawablah pertanyaan di bawah ini dengan jelas dan benar!', bold: true, italics: true, font: BODY_FONT, size: 22 })] }));
      esai.forEach((q, i) => children.push(numItem((i + 1) + '.', q, 568)));
      if ((hots || []).length) {
        children.push(para({ style: 'A0', spacing: { before: 200, after: 40 }, indent: { left: 284, hanging: 284 }, children: [new TextRun({ text: 'C.\tPenalaran Proyek (HOTS)', bold: true, font: BODY_FONT, size: 22 })], tabStops: [{ type: TabStopType.LEFT, position: 284 }] }));
        children.push(para({ spacing: { after: 80 }, indent: { left: 284 }, children: [new TextRun({ text: 'Bacalah kasus berikut, lalu jawablah tuntutannya dengan alasan ilmiah dan data!', bold: true, italics: true, font: BODY_FONT, size: 22 })] }));
        const LV = { A: 'Level A – Memahami', B: 'Level B – Mengaplikasi', C: 'Level C – Mengevaluasi' };
        hots.forEach((h, i) => {
          children.push(numItem((i + 1) + '.', '**' + (LV[String(h.level || '').trim().charAt(0).toUpperCase()] || ('Level ' + (h.level || ''))) + '.** ' + (h.kasus || ''), 568));
          children.push(para({ alignment: AlignmentType.JUSTIFIED, spacing: { after: 60 }, indent: { left: 568 }, children: B('*Tuntutan:* ' + (h.tuntutan || '')) }));
        });
      }
    }

    // ===== Asesmen Akhir Semester
    const aas = book.aas || {};
    children.push(secTitle('ASESMEN AKHIR SEMESTER', '_sec_aas'));
    pushAsesmen(aas.pg || [], aas.esai || []);
    kunci.push({ judul: 'Asesmen Akhir Semester', pg: aas.pg || [] });

    // ===== Glosarium
    children.push(secTitle('GLOSARIUM', '_sec_glos'));
    (book.glosarium || []).slice().sort((a, b) => String(a.istilah).localeCompare(String(b.istilah), 'id')).forEach(g =>
      children.push(para({ alignment: AlignmentType.JUSTIFIED, spacing: { after: 80 }, indent: { left: 567, hanging: 567 },
        children: [new TextRun({ text: g.istilah, bold: true, font: BODY_FONT, size: 22 })].concat(B(' : ' + (g.arti || ''))) })));

    // ===== Daftar Pustaka
    children.push(secTitle('DAFTAR PUSTAKA', '_sec_pus'));
    (book.pustaka || []).filter(Boolean).slice().sort((a, b) => a.localeCompare(b, 'id')).forEach(p =>
      children.push(para({ alignment: AlignmentType.LEFT, spacing: { after: 80 }, indent: { left: 567, hanging: 567 }, children: B(p) })));

    // ===== Sumber Kredit Gambar
    children.push(secTitle('SUMBER KREDIT GAMBAR', '_sec_kredit'));
    book.chapters.forEach((ch, ci) => collectChapter(book, ci).figs.forEach(f =>
      children.push(para({ spacing: { after: 60 }, indent: { left: 1418, hanging: 1418 }, tabStops: [{ type: TabStopType.LEFT, position: 1418 }],
        children: [new TextRun({ text: 'Gambar ' + f.no + '\t', bold: true, font: BODY_FONT, size: 20 })].concat(B(f.src || '…', { size: 20 })) }))));

    // ===== Indeks
    children.push(secTitle('INDEKS', '_sec_indeks'));
    indexTerms(book).forEach(it => {
      const kids = [new TextRun({ text: it.term, font: BODY_FONT, size: 20, italics: it.foreign }), new TextRun({ text: '\t', font: BODY_FONT, size: 20 })];
      it.refs.forEach((r, ri) => { if (ri) kids.push(new TextRun({ text: ', ', font: BODY_FONT, size: 20 })); kids.push(new PageReference(r)); });
      children.push(para({ spacing: { after: 20 }, tabStops: [{ type: TabStopType.RIGHT, position: CONTENT_W, leader: LeaderType.DOT }], children: kids }));
    });

    // ===== Profil Penulis
    children.push(secTitle('PROFIL PENULIS', '_sec_profil'));
    (book.profil || []).forEach((p, pi) => {
      if (pi) children.push(para({ spacing: { before: 360 }, children: [] }));
      [['Nama', p.nama], ['Telp. /HP', p.telp], ['Email', p.email], ['Akun Instagram', p.ig], ['Alamat Rumah', p.alamat], ['Bidang Keahlian', p.keahlian]].forEach(([k, v]) =>
        children.push(para({ spacing: { after: 20 }, indent: { left: 2268, hanging: 2268 }, tabStops: [{ type: TabStopType.LEFT, position: 2268 }], children: B(k + '\t: ' + (v || '')) })));
      const sect = (t, lines, numbered) => {
        if (!lines || !lines.length) return;
        children.push(para({ spacing: { before: 200, after: 60 }, children: [new TextRun({ text: t, bold: true, font: BODY_FONT, size: 22 })] }));
        lines.forEach((l, i) => {
          if (numbered) children.push(numItem((i + 1) + '.', l, 284));
          else {
            const m = l.split(/\s*:\s*/);
            children.push(para({ spacing: { after: 20 }, indent: { left: 2268, hanging: 2268 }, tabStops: [{ type: TabStopType.LEFT, position: 2268 }], children: B(m.length > 1 ? m[0] + '\t: ' + m.slice(1).join(': ') : l) }));
          }
        });
      };
      sect('Riwayat Pekerjaan/Profesi (10 Tahun Terakhir)', lines(p.pekerjaan), false);
      sect('Riwayat Pendidikan Tinggi dan Tahun Belajar', lines(p.pendidikan), true);
      sect('Judul Buku dan Tahun Terbit (10 Tahun Terakhir)', lines(p.buku), true);
      if (p.ringkas) { children.push(para({ spacing: { before: 200, after: 60 }, children: [new TextRun({ text: 'Informasi Lain dari Penulis', bold: true, font: BODY_FONT, size: 22 })] })); children.push(bodyP(p.ringkas, 0)); }
    });

    // ===== Kunci jawaban (opsional)
    if (opts.kunci) {
      children.push(secTitle('KUNCI JAWABAN', '_sec_kunci'));
      kunci.forEach(k => {
        if (!k.pg.length) return;
        children.push(para({ spacing: { before: 160, after: 60 }, children: [new TextRun({ text: k.judul, bold: true, font: BODY_FONT, size: 22 })] }));
        children.push(bodyP(k.pg.map((q, i) => (i + 1) + '. ' + (q.kunci || '-')).join('    '), 284));
      });
    }

    // ===== Daftar Isi, Daftar Tabel, Daftar Gambar (dengan nomor halaman otomatis)
    const tocParas = [];
    const tocLine = (text, id, left, bold) => para({ spacing: { after: 40 }, indent: { left, hanging: 0, right: 500 },
      tabStops: [{ type: TabStopType.RIGHT, position: CONTENT_W, leader: LeaderType.DOT }],
      children: inlineTokens(text).map(t => new TextRun({ text: t.text, italics: t.italics, bold: bold || t.bold, font: BODY_FONT, size: 21 }))
        .concat([new TextRun({ text: '\t', font: BODY_FONT, size: 21 }), new PageReference(id)]) });
    const tocAll = [{ text: 'Prakata', id: '_sec_prakata', lvl: 0 }, { text: 'Daftar Isi', id: '_sec_isi', lvl: 0 }, { text: 'Daftar Tabel', id: '_sec_tabel', lvl: 0 }, { text: 'Daftar Gambar', id: '_sec_gambar', lvl: 0 }]
      .concat(toc.filter(t => t.id !== '_sec_prakata'));
    tocParas.push(secTitle('Daftar Isi', '_sec_isi'));
    tocAll.forEach(t => tocParas.push(tocLine(t.text, t.id, t.lvl ? 284 : 0, t.lvl === 0 && /^BAB /.test(t.text))));
    tocParas.push(secTitle('Daftar Tabel', '_sec_tabel'));
    if (!tocTab.length) tocParas.push(bodyP('–', 0));
    tocTab.forEach(t => tocParas.push(tocLine(t.text, t.id, 0)));
    tocParas.push(secTitle('Daftar Gambar', '_sec_gambar'));
    if (!tocFig.length) tocParas.push(bodyP('–', 0));
    tocFig.forEach(t => tocParas.push(tocLine(t.text, t.id, 0)));
    children.splice(tocIndex, 0, ...tocParas);

    const page = { size: { width: PAGE.w, height: PAGE.h }, margin: { top: PAGE.top, right: PAGE.right, bottom: PAGE.bottom, left: PAGE.left, header: 720, footer: 560 } };
    const footer = new Footer({ children: [para({ alignment: AlignmentType.CENTER, children: [new TextRun({ children: [PageNumber.CURRENT], font: BODY_FONT, size: 20 })] })] });
    return new Document({
      creator: (meta.penulis || []).filter(Boolean).join(', ') || 'SERAT STEM',
      title: meta.judul || mapel,
      description: 'Naskah buku disusun dengan SERAT STEM',
      externalStyles: opts.stylesXml,
      features: { updateFields: true },
      sections: [
        { properties: { page }, children: cover },
        { properties: { page: Object.assign({}, page, { pageNumbers: { start: 3 } }) }, footers: { default: footer }, children }
      ]
    });

    function lines(t) { return String(t || '').split('\n').map(s => s.trim()).filter(Boolean); }
  }

  // Indeks: istilah dari glosarium + kata kunci, rujuk ke sub bab tempat istilah muncul
  function indexTerms(book) {
    const terms = new Map();
    (book.glosarium || []).forEach(g => { const t = String(g.istilah || '').replace(/\s*\(.*?\)\s*/g, '').trim(); if (t) terms.set(t.toLowerCase(), t); });
    const foreign = new Set();
    book.chapters.forEach(ch => (ch.kataKunci || []).forEach(k => { const t = String(k).replace(/\*/g, '').trim(); if (/\*/.test(k)) foreign.add(t.toLowerCase()); if (t && !terms.has(t.toLowerCase())) terms.set(t.toLowerCase(), t); }));
    const out = [];
    terms.forEach((t, low) => {
      const refs = [];
      book.chapters.forEach((ch, ci) => (ch.subbab || []).forEach((s, si) => {
        if (refs.length < 3 && (String(s.isi || '') + ' ' + s.judul).toLowerCase().includes(low)) refs.push('_bab_' + (ci + 1) + '_s' + si);
      }));
      if (!refs.length) book.chapters.forEach((ch, ci) => { if (refs.length < 1 && (ch.kataKunci || []).some(k => String(k).toLowerCase().replace(/\*/g, '') === low)) refs.push('_bab_' + (ci + 1)); });
      if (refs.length) out.push({ term: t, refs, foreign: foreign.has(low) });
    });
    return out.sort((a, b) => a.term.localeCompare(b.term, 'id'));
  }

  const api = { parseMarkup, inlineHTML, inlineTokens, esc, blocksHTML, collectChapter, buildDocx, figKey, indexTerms, ROMAN_UP };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.SERAT = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

Mengenali, memprediksi, dan menggeneralisasi pola dalam bentuk susunan benda dan bilangan; menyatakan suatu situasi ke dalam bentuk aljabar; menggunakan sifat-sifat operasi (komutatif, asosiatif, dan distributif) untuk menghasilkan bentuk aljabar yang ekuivalen; memahami relasi dan fungsi serta menyajikannya dalam bentuk diagram panah, tabel, himpunan pasangan berurutan, dan grafik; membedakan beberapa fungsi nonlinear dari fungsi linear secara grafik; menyelesaikan persamaan dan pertidaksamaan linear satu variabel; serta menyajikan, menganalisis, dan menyelesaikan masalah dengan menggunakan relasi, fungsi, persamaan linear, dan sistem persamaan linear dua variabel.

Membuat jaring-jaring bangun ruang (prisma, tabung, limas, dan kerucut) dan membuat bangun ruang tersebut dari jaring-jaringnya; menggunakan hubungan antarsudut yang terbentuk oleh dua garis yang berpotongan dan oleh dua garis sejajar yang dipotong sebuah garis transversal untuk menyelesaikan masalah, termasuk menentukan jumlah besar sudut dalam sebuah segitiga, menentukan besar sudut yang belum diketahui pada sebuah segitiga, dan menjelaskan sifat-sifat kekongruenan dan kesebangunan pada segitiga dan segi empat; menunjukkan kebenaran teorema Pythagoras dan menggunakannya dalam menyelesaikan masalah, termasuk jarak antara dua titik pada bidang koordinat Kartesius; serta melakukan transformasi tunggal (refleksi, translasi, rotasi, dan dilatasi) titik, garis, dan bangun datar pada bidang koordinat Kartesius dan menggunakannya untuk menyelesaikan masalah.

async function callAI(prompt, o){

  aiAbort=new AbortController();
  if(e==='claude'){
    try{
      const r=await sampleCap(prompt,{signal:aiAbort.signal,modelTier:o.tier||'default',onText:o.onText?(x=>o.onText(x.text||'')):undefined});
      return r.text||'';
    }catch(err){
      if(err&&err.code==='not_granted') throw new Error('Akses Claude belum diizinkan untuk halaman ini.');
      if(err&&err.code==='rate_limited') throw new Error('Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.');
      throw new Error((err&&err.message)||'Gagal memanggil Claude.');
    }
  }
  const daftar=[...new Set([cfg.model||'gemini-3.8-flash','gemini-3.8-flash','gemini-flash-latest','gemini-flash-lite-latest'])];
  let lastErr=null; const mati=new Set(); let adaSibuk=false;
  for(let ronde=0; ronde<3; ronde++){
   if(ronde>0){
     if(!adaSibuk) break;
     const jeda=ronde*8;
     for(let d=jeda; d>0; d--){ if(aiCancelled) throw new Error('Dihentikan.'); if(o.onText) o.onText('Server Gemini sedang sibuk. Mencoba lagi dalam '+d+' detik…'); await new Promise(r=>setTimeout(r,1000)); }
     adaSibuk=false;
   }
   for(const model of daftar){
    if(mati.has(model)) continue;
    for(let pakaiHemat of (cfg.noThink?[false]:[true,false])){
      const body={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.8,maxOutputTokens:16384}};
      if(o.json) body.generationConfig.responseMimeType='application/json';
      if(pakaiHemat) body.generationConfig.thinkingConfig={thinkingLevel:'low'};
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':streamGenerateContent?alt=sse';
      let res, macet=false, idleT=null;
      const tunda=()=>{ clearTimeout(idleT); idleT=setTimeout(()=>{ macet=true; aiAbort.abort(); }, 90000); };
      tunda();
      try{ res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gKey()},body:JSON.stringify(body),signal:aiAbort.signal}); }
      catch(err){ clearTimeout(idleT); if(macet) throw new Error('Gemini tidak merespons dalam 90 detik. Mencoba lagi…'); if(err.name==='AbortError') throw new Error('Dihentikan.'); throw new Error('Tidak dapat menghubungi Gemini. Periksa koneksi internet.'); }
      if(!res.ok){
        clearTimeout(idleT);
        let j=await res.json().catch(()=>({})); if(Array.isArray(j)) j=j[0]||{};
        const msg=(j.error&&j.error.message)||String(res.status);
        if(pakaiHemat && res.status===400 && /think/i.test(msg)){ cfg.noThink=true; saveCfg(); continue; }
        const modelMati = res.status===404 || /no longer available|not found|not supported|deprecated|update your code/i.test(msg);
        if(modelMati){ mati.add(model); lastErr=new Error('Gemini ('+model+'): '+msg); break; }
        const sibuk = res.status===503 || res.status===429 || res.status===500 || /high demand|overloaded|unavailable|try again later|resource.?exhausted|quota|rate limit/i.test(msg);
        if(sibuk){ adaSibuk=true; lastErr=new Error('Server Gemini sedang sibuk (banyak pengguna). Tunggu 1–2 menit lalu klik lagi; bagian yang sudah jadi tetap tersimpan.'); if(o.onText) o.onText('Model '+model+' sedang sibuk, mencoba model lain…'); break; }
        throw new Error('Gemini: '+msg);
      }
      if(model!==cfg.model && mati.has(cfg.model)){ cfg.model=model; saveCfg(); const m=document.getElementById('cfgModel'); if(m) m.value=model; toast('Model Gemini otomatis diganti ke '+model+'.'); }
      let t='', buf='', blok='';
      const dec=new TextDecoder();
      const olah=line=>{
        if(!line.startsWith('data:')) return;
        const d=line.slice(5).trim(); if(!d||d==='[DONE]') return;
        let j; try{ j=JSON.parse(d); }catch(e){ return; }
        if(j.error) throw new Error('Gemini: '+(j.error.message||'galat'));
        const c=(j.candidates||[])[0]; if(!c) return;
        if(c.finishReason&&/SAFETY|BLOCK|PROHIBITED/i.test(c.finishReason)) blok=c.finishReason;
        for(const p of ((c.content||{}).parts||[])){ if(p.text && !p.thought) t+=p.text; }
      };
      try{
        if(res.body && res.body.getReader){
          const rd=res.body.getReader();
          for(;;){
            const {done,value}=await rd.read(); if(done) break;
            tunda(); buf+=dec.decode(value,{stream:true});
            let k; while((k=buf.indexOf('\n'))>=0){ olah(buf.slice(0,k).replace(/\r$/,'')); buf=buf.slice(k+1); }
            if(o.onText) o.onText('Menerima '+t.length.toLocaleString('id-ID')+' karakter…\n'+t);
          }
          if(buf) olah(buf.trim());
        } else { (await res.text()).split('\n').forEach(l=>olah(l.trim())); }
      }catch(err){ clearTimeout(idleT); if(macet) throw new Error('Gemini berhenti mengirim data selama 90 detik. Mencoba lagi…'); if(err.name==='AbortError') throw new Error('Dihentikan.'); throw err; }
      clearTimeout(idleT);
      if(!t) throw new Error(blok?'Jawaban Gemini terblokir filter ('+blok+').':'Gemini tidak mengembalikan teks.');
      return t;
    }
   }
  }
  throw lastErr||new Error('Model Gemini tidak tersedia. Ganti nama model di kartu "Mesin AI".');
}
function parseJSON(t){
  let s=String(t||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{ return JSON.parse(s); }catch(e){}
  const a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a>=0&&b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
  const a2=s.indexOf('['), b2=s.lastIndexOf(']');
  if(a2>=0&&b2>a2){ try{ return JSON.parse(s.slice(a2,b2+1)); }catch(e){} }
  throw new Error('Jawaban AI tidak terbaca sebagai JSON. Coba ulangi.');
}
async function aiJSON(prompt,o){ const t=await callAI(prompt+'\n\nKembalikan HANYA JSON yang valid, tanpa penjelasan dan tanpa ```.',Object.assign({json:true},o||{})); return parseJSON(t); }

function progStart(title){ progT0=Date.now(); progFirst=false; clearInterval(progTimer); progTimer=setInterval(progTick,1000); setTimeout(progTick,0); aiCancelled=false; $('#progT').textContent=title; $('#progBar').style.width='0%'; $('#progMsg').textContent=''; $('#progLive').textContent=''; $('#prog').classList.add('on'); }

function progLive(t){ progFirst=true; t=String(t); const n=t.indexOf('\n'); $('#progLive').textContent = (n>0&&t.startsWith('Menerima ')) ? t.slice(0,n)+'\n…'+t.slice(n+1).slice(-260) : t.slice(-300); }

async function runAI(title, fn){

- data: lembar data pengujian berupa "kolom" (3–5 judul kolom tabel, misalnya Percobaan ke-, variabel yang diubah, hasil ukur dengan satuan) dan "keterangan" (1 kalimat cara mengisi).
- produk: paragraf singkat tentang produk akhir dan cara mempresentasikan desain, alasan ilmiah, cara kerja, serta hasil pengujian; kelompok lain memberi kritik.
- rubrik: TEPAT 6 aspek rubrik analitik dengan urutan Masalah, ${book.meta.mapel==='Matematika'?'Penalaran Matematis':'Penalaran IPA'}, Rekayasa, Data & Matematika, Kreativitas & Komunikasi, Kolaborasi; tiap aspek berisi deskripsi skor 4 (sangat baik) dan skor 1 (perlu bimbingan) yang khas proyek ini.
- refleksi: 4 pertanyaan refleksi diri metakognitif yang dijawab individu (kesesuaian dengan prediksi, kegagalan paling berharga, perubahan jika mengulang, transfer konsep ke konteks lain).

async function aiFullBab(ci){

  const steps=[['Pembuka bab',()=>genPembuka(ci)]].concat(c.subbab.map((s,si)=>[`Sub bab ${ABC[si]}. ${s.judul}`,()=>genSubbab(ci,si,'baru')]))
    .concat([['Penutup bab',()=>genPenutup(ci)],['Proyek STEM (Ayo Mencoba)',()=>genProyek(ci)],['Asesmen sumatif',()=>genAsesmen(ci)]]);
  await runAI('Menulis BAB '+(ci+1), async ()=>{
    for(let i=0;i<steps.length;i++){
      if(aiCancelled) throw new Error('Dihentikan. Bagian yang sudah selesai tetap tersimpan.');
      progSet(i/steps.length, `(${i+1}/${steps.length}) ${steps[i][0]}…`);
      await steps[i][1](); persist();
    }
    progSet(1,'Selesai');
  });
}

function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=rej; r.readAsDataURL(blob); }); }
function stamp(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes()); }
async function drivePost(payload){
  let res;
  try{ res=await fetch(driveUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
  catch(e){ throw new Error(window.claude?'Simpan ke Drive hanya berjalan di versi Google Sites/web. Di claude.ai gunakan "Unduh .docx".':'Tidak dapat menghubungi Apps Script. Periksa URL Web App dan akses "Siapa saja".'); }
  const j=await res.json().catch(()=>({ok:false,error:'Jawaban Apps Script tidak terbaca. Pastikan deployment memakai akses "Siapa saja".'}));
  if(!j.ok) throw new Error('Drive: '+(j.error||'gagal menyimpan'));
  return j;
}

kelompok akan memecahkan masalah nyata melalui proyek STEM. Setiap proyek diawali pertanyaan pemicu dan prediksi, dilengkapi kriteria keberhasilan, lembar data, rubrik penilaian proses, serta refleksi diri, dan dikerjakan melalui tujuh tahap: empati dan bertanya, bertukar pikiran, mendesain solusi, membuat solusi, menguji dan mengevaluasi, mendesain ulang, serta mengomunikasikan. Setiap bab ditutup dengan Rangkuman, Refleksi, dan Asesmen Sumatif untuk mengukur pemahaman kalian.\n\nKami berterima kasih kepada semua pihak yang telah membantu penyusunan buku ini. Kami menyadari buku ini masih dapat disempurnakan, sehingga saran dan masukan dari para guru, murid, dan pembaca sangat kami harapkan.\n\nSelamat belajar dan berinovasi!", "cp": "Pada akhir Fase D ini, murid diharapkan memiliki kemampuan sebagai berikut.\n# Pemahaman IPA\nMenelaah hasil identifikasi makhluk hidup sesuai dengan karakteristiknya; menganalisis klasifikasi, sifat, dan perubahan materi; menganalisis sistem organisasi kehidupan, fungsi, serta kelainan atau gangguan yang muncul pada sistem organ; menganalisis interaksi antar makhluk hidup dan lingkungannya dalam merancang upaya-upaya untuk mencegah dan mengatasi perubahan iklim; menganalisis pewarisan sifat; membuat bioteknologi konvensional di lingkungan sekitarnya; menerapkan pengukuran terhadap aspek fisis dalam kehidupan sehari-hari; menganalisis ragam gerak, gaya, dan tekanan; menganalisis hubungan usaha dan energi; menganalisis pengaruh kalor dan perpindahannya terhadap perubahan suhu; menganalisis gelombang dan pemanfaatannya dalam kehidupan sehari-hari; menganalisis gejala kemagnetan dan kelistrikan untuk menyelesaikan tantangan yang dihadapi dalam kehidupan sehari-hari termasuk pemanfaatan sumber energi listrik ramah lingkungan; menganalisis posisi relatif bumi-bulan-matahari dalam sistem tata surya untuk menjelaskan fenomena alam dan perubahan iklim; serta mengevaluasi keputusan yang tepat untuk menghindari zat aditif dan adiktif yang membahayakan dirinya dan lingkungan.\n# Keterampilan Proses\nMampu menerapkan keterampilan proses yang meliputi:\n## Mengamati\nMelakukan pengamatan terhadap fenomena dan peristiwa di sekitarnya dan mencatat hasil pengamatannya dengan memperhatikan karakteristik objek yang diamati.\n## Mempertanyakan dan Memprediksi\nMengidentifikasi pertanyaan yang dapat diselidiki secara ilmiah dan membuat prediksinya.\n## Merencanakan dan Melakukan Penyelidikan\nMerencanakan dan melakukan langkah-langkah operasional untuk menjawab pertanyaan; murid menggunakan alat bantu pengukuran untuk mendapatkan data yang akurat dan memahami adanya potensi kekeliruan dalam penyelidikan.\n## Memproses, Menganalisis Data dan Informasi\nMengolah data dalam bentuk tabel, grafik, dan model serta menjelaskan hasil pengamatan dan pola atau hubungan pada data; murid mengumpulkan data dari penyelidikan yang dilakukannya, serta menggunakan pemahaman sains untuk mengidentifikasi hubungan dan menarik kesimpulan berdasarkan bukti.\n## Mengevaluasi dan Refleksi\nMengidentifikasi sumber ketidakpastian dan kemungkinan penjelasan alternatif dalam rangka mengevaluasi kesimpulan, serta menjelaskan cara spesifik untuk meningkatkan kualitas data.\n## Mengomunikasikan Hasil\nMengomunikasikan hasil penyelidikan secara sistematis dan utuh yang ditunjang dengan argumen dan bahasa yang sesuai konteks penyelidikan.", "chapters": [{"judul": "Hakikat Ilmu Sains dan Metode Ilmiah", "ide": "Penakar hujan dari botol bekas", "pemantik": ["Mengapa para ilmuwan selalu mengulang percobaan sebelum menarik kesimpulan?", "Bagaimana cara mengetahui banyaknya hujan yang turun di sekolah kalian hari ini?", "Apa yang bisa terjadi jika kalian bekerja di laboratorium tanpa memperhatikan aturan keselamatan?"], "tujuan": ["Siswa dapat menjelaskan hakikat sains dan perannya dalam kehidupan sehari-hari.", "Siswa dapat menerapkan aturan keselamatan kerja dan menggunakan alat laboratorium dengan tepat.", "Siswa dapat merancang percobaan sederhana dengan menentukan variabel bebas, variabel terikat, dan variabel kontrol.", "Siswa dapat melakukan pengukuran besaran dengan alat ukur dan satuan Sistem Internasional yang tepat.", "Siswa dapat menyajikan data hasil percobaan dalam tabel dan grafik serta menyusun laporan sederhana.", "Siswa dapat merancang dan menguji alat penakar hujan sederhana dari bahan bekas."], "kataKunci": ["sains", "metode ilmiah", "hipotesis", "variabel", "besaran", "satuan", "pengukuran", "laporan percobaan"], "petaKonsep": [{"poin": ["Sains sebagai cara berpikir", "Cabang sains"]}, {"poin": ["Alat laboratorium", "Keselamatan kerja"]}, {"poin": ["Hipotesis", "Variabel percobaan"]}, {"poin": ["Besaran dan satuan", "Alat ukur"]}, {"poin": ["Tabel dan grafik", "Laporan percobaan"]}], "apersepsi": "Pernahkah kalian memperhatikan petani yang menentukan waktu tanam? Dahulu, banyak petani mengandalkan pengalaman dan tanda-tanda alam. Kini, para petani juga dapat memanfaatkan data curah hujan dari Badan Meteorologi, Klimatologi, dan Geofisika (BMKG). Data itu diperoleh dari pengamatan dan pengukuran yang dilakukan secara cermat dan berulang. Itulah salah satu wujud kerja sains.\n\n[GAMBAR: Petugas Mengamati Alat Penakar Hujan | Ilustrasi Penulis (2026) | seorang petugas membaca alat penakar hujan di taman alat cuaca]\n\nSains tidak hanya dikerjakan oleh ilmuwan di laboratorium besar. Kalian pun dapat bekerja seperti ilmuwan: mengamati, bertanya, menduga, mencoba, mengukur, dan menyampaikan hasil. Pada bab ini, kalian akan belajar cara kerja ilmiah yang akan kalian gunakan di semua bab berikutnya.", "subbab": [{"judul": "Apa Itu Sains?", "isi": "Sains atau Ilmu Pengetahuan Alam adalah ilmu yang mempelajari alam semesta beserta segala gejala yang terjadi di dalamnya. Sains tidak hanya berupa kumpulan fakta, tetapi juga cara berpikir dan cara bekerja untuk menemukan jawaban atas pertanyaan tentang alam. Jawaban itu diperoleh melalui pengamatan, percobaan, dan penalaran yang dapat diuji kebenarannya oleh orang lain.\n\n# Sains sebagai Produk, Proses, dan Sikap\nSains memiliki tiga sisi yang saling berkaitan.\n- **Produk**: hasil kerja sains berupa fakta, konsep, prinsip, hukum, dan teori, misalnya konsep bahwa air mendidih pada suhu sekitar 100 °C pada tekanan udara normal.\n- **Proses**: cara memperoleh pengetahuan, seperti mengamati, mengukur, membuat dugaan, melakukan percobaan, dan menyimpulkan.\n- **Sikap ilmiah**: perilaku yang dimiliki ilmuwan, seperti rasa ingin tahu, jujur, teliti, terbuka terhadap pendapat lain, dan tidak mudah putus asa.\n\n# Cabang-Cabang Sains\nObjek yang dipelajari sains sangat luas sehingga sains dibagi menjadi beberapa cabang.\n[TABEL: Beberapa Cabang Sains dan Objek Kajiannya]\n| Cabang Sains | Objek Kajian | Contoh Pertanyaan |\n| Biologi | Makhluk hidup | Mengapa daun berwarna hijau? |\n| Fisika | Benda, gerak, energi | Mengapa benda jatuh ke bawah? |\n| Kimia | Zat dan perubahannya | Mengapa besi dapat berkarat? |\n| Ilmu Bumi dan Antariksa | Bumi, cuaca, benda langit | Mengapa terjadi siang dan malam? |\n\n# Sains dalam Kehidupan Sehari-hari\nHasil sains dapat kalian rasakan setiap hari. Pengetahuan tentang mikroorganisme membantu masyarakat membuat tempe dan tape. Pengetahuan tentang listrik memungkinkan lampu menyala di rumah kalian. Pengetahuan tentang cuaca membantu nelayan memutuskan kapan aman untuk melaut.\n\n[STEM: Sains dan Teknologi Bergandengan] Sains menjelaskan *mengapa* sesuatu terjadi, sedangkan teknologi memanfaatkan penjelasan itu untuk membuat alat yang berguna. Pengetahuan bahwa cahaya dapat dibelokkan oleh lensa (sains) melahirkan kacamata dan mikroskop (teknologi). Insinyur kemudian merancang dan menguji alat tersebut (enjinering), dan perhitungan ukuran lensa memerlukan matematika."}, {"judul": "Laboratorium IPA", "isi": "Laboratorium adalah ruangan tempat melakukan percobaan dan penyelidikan ilmiah. Di laboratorium terdapat berbagai alat dan bahan, termasuk bahan kimia yang dapat berbahaya jika tidak digunakan dengan benar. Karena itu, setiap orang yang bekerja di laboratorium wajib memahami fungsi alat dan aturan keselamatan kerja.\n\n# Mengenal Alat Laboratorium\nBerikut beberapa alat yang sering digunakan dalam pembelajaran IPA di SMP.\n[TABEL: Beberapa Alat Laboratorium dan Fungsinya]\n| Nama Alat | Fungsi |\n| Gelas kimia | Menampung, mencampur, dan memanaskan larutan |\n| Gelas ukur | Mengukur volume zat cair |\n| Tabung reaksi | Mereaksikan zat dalam jumlah sedikit |\n| Pembakar spiritus | Memanaskan zat |\n| Mikroskop | Mengamati benda yang sangat kecil |\n| Termometer | Mengukur suhu |\n| Neraca | Mengukur massa |\n\n[GAMBAR: Beberapa Alat Laboratorium IPA | Ilustrasi Penulis (2026) | gelas kimia, gelas ukur, tabung reaksi, pembakar spiritus, dan termometer di atas meja laboratorium]\n\n# Simbol Bahaya Bahan Kimia\nKemasan bahan kimia diberi simbol bahaya agar penggunanya berhati-hati. Beberapa simbol yang perlu kalian kenali antara lain:\n- **Mudah terbakar** (*flammable*), contohnya spiritus dan alkohol.\n- **Korosif**, yaitu dapat merusak kulit dan logam, contohnya asam klorida pekat.\n- **Beracun** (*toxic*), yaitu dapat membahayakan kesehatan jika tertelan, terhirup, atau terserap kulit.\n- **Iritan**, yaitu dapat menyebabkan kulit atau mata gatal dan merah.\n\n# Aturan Keselamatan Kerja\nAgar percobaan berjalan aman, patuhilah aturan berikut.\n- Masuk laboratorium hanya dengan izin dan bimbingan guru.\n- Gunakan jas laboratorium, dan bila perlu sarung tangan serta kacamata pelindung.\n- Baca petunjuk kerja dan label bahan sebelum memulai percobaan.\n- Jangan mencicipi atau mencium bahan kimia secara langsung.\n- Arahkan mulut tabung reaksi menjauhi diri sendiri dan teman saat memanaskan zat.\n- Bersihkan alat dan meja, lalu cuci tangan setelah selesai bekerja.\n- Segera laporkan kepada guru jika terjadi kecelakaan sekecil apa pun.\n\n[STEM: Merancang Laboratorium Hemat] Prinsip STEM tidak selalu memerlukan alat mahal. Botol plastik bekas yang dipotong dan diberi skala dapat menjadi gelas ukur sederhana. Untuk membuat skalanya, kalian perlu menuang air dengan volume yang diketahui, misalnya 50 mL, lalu menandai ketinggian permukaannya. Kegiatan ini melatih enjinering sekaligus matematika."}, {"judul": "Merancang Percobaan", "isi": "Ilmuwan bekerja dengan langkah-langkah yang teratur yang disebut metode ilmiah. Metode ilmiah membantu kita memperoleh jawaban yang dapat dipercaya karena setiap langkahnya dapat diperiksa dan diulang oleh orang lain.\n\n# Langkah-Langkah Metode Ilmiah\n- **Mengamati dan merumuskan masalah**, misalnya \"Apakah banyaknya cahaya memengaruhi pertumbuhan tanaman kacang hijau?\"\n- **Menyusun hipotesis**, yaitu dugaan sementara yang dapat diuji, misalnya \"Tanaman kacang hijau yang mendapat cahaya lebih banyak akan tumbuh lebih hijau dan kokoh.\"\n- **Merancang dan melakukan percobaan** untuk menguji hipotesis.\n- **Mengumpulkan dan menganalisis data** hasil percobaan.\n- **Menarik kesimpulan**, apakah hipotesis diterima atau ditolak.\n- **Mengomunikasikan hasil** kepada orang lain.\n\n# Variabel dalam Percobaan\nDalam percobaan yang baik, kita mengatur faktor-faktor yang dapat berubah. Faktor-faktor itu disebut variabel.\n## Variabel Bebas\nVariabel bebas adalah faktor yang sengaja diubah oleh peneliti. Pada percobaan kacang hijau, variabel bebasnya adalah banyaknya cahaya.\n## Variabel Terikat\nVariabel terikat adalah faktor yang berubah akibat perubahan variabel bebas dan diamati atau diukur hasilnya, misalnya tinggi tanaman.\n## Variabel Kontrol\nVariabel kontrol adalah faktor yang dibuat sama agar tidak memengaruhi hasil, misalnya jenis biji, jenis tanah, dan banyaknya air siraman.\n\n[GAMBAR: Percobaan Pertumbuhan Kacang Hijau | Ilustrasi Penulis (2026) | dua pot kacang hijau, satu di tempat terang dan satu di tempat gelap]\n\n# Percobaan yang Adil\nSebuah percobaan disebut adil jika hanya satu variabel yang diubah, sementara variabel lain dijaga tetap. Percobaan juga sebaiknya diulang beberapa kali agar hasilnya lebih dapat dipercaya.\n\n[STEM: Data yang Bisa Dipercaya] Jika kalian mengukur tinggi tiga tanaman di tempat terang dan memperoleh 12 cm, 13 cm, dan 14 cm, rata-ratanya adalah (12 + 13 + 14) : 3 = 13 cm. Menghitung rata-rata dari beberapa pengulangan (matematika) membuat kesimpulan sains lebih kuat."}, {"judul": "Pengukuran", "isi": "Mengukur adalah membandingkan suatu besaran dengan besaran sejenis yang dijadikan acuan atau satuan. Misalnya, ketika kalian mengukur panjang meja dan memperoleh 120 cm, artinya panjang meja itu 120 kali panjang 1 cm.\n\n# Besaran Pokok dan Besaran Turunan\nBesaran adalah sesuatu yang dapat diukur dan dinyatakan dengan angka serta satuan. Para ilmuwan di seluruh dunia menyepakati Sistem Internasional (SI) agar hasil pengukuran mudah dipahami di mana pun.\n[TABEL: Tujuh Besaran Pokok dan Satuannya dalam SI]\n| Besaran Pokok | Satuan SI | Simbol Satuan |\n| Panjang | meter | m |\n| Massa | kilogram | kg |\n| Waktu | sekon | s |\n| Suhu | kelvin | K |\n| Kuat arus listrik | ampere | A |\n| Jumlah zat | mol | mol |\n| Intensitas cahaya | kandela | cd |\n\nBesaran turunan adalah besaran yang diturunkan dari besaran pokok. Contohnya luas (m²), volume (m³), kecepatan (m/s), dan massa jenis (kg/m³).\n\n# Alat Ukur dan Cara Menggunakannya\n## Mengukur Panjang\nPenggaris memiliki skala terkecil 1 mm. Untuk mengukur dengan teliti, letakkan ujung benda tepat pada angka nol dan bacalah skala dengan mata tegak lurus terhadap skala agar tidak terjadi kesalahan paralaks.\n## Mengukur Massa\nMassa diukur dengan neraca. Sebelum digunakan, pastikan neraca menunjukkan angka nol.\n## Mengukur Waktu\nWaktu diukur dengan *stopwatch*. Kini, *stopwatch* juga tersedia pada telepon genggam.\n\n# Konversi Satuan\nSatuan sering perlu diubah ke satuan lain. Ingatlah bahwa 1 km = 1.000 m, 1 m = 100 cm, 1 kg = 1.000 g, dan 1 jam = 3.600 s. Contoh: 2,5 km = 2,5 × 1.000 m = 2.500 m.\n\n[STEM: Penggaris di Saku Kalian] Banyak telepon genggam memiliki aplikasi pengukur yang memanfaatkan kamera (teknologi). Cobalah bandingkan hasil pengukuran panjang buku dengan aplikasi dan dengan penggaris. Hitung selisihnya (matematika), lalu diskusikan alat mana yang lebih teliti dan mengapa."}, {"judul": "Pelaporan Hasil Percobaan", "isi": "Percobaan belum selesai sebelum hasilnya disampaikan kepada orang lain. Dengan melaporkan hasil, orang lain dapat memeriksa, mengulang, dan mengembangkan percobaan kalian.\n\n# Menyajikan Data dalam Tabel dan Grafik\nData yang banyak lebih mudah dibaca jika disusun dalam tabel. Misalnya, data pengukuran tinggi tanaman kacang hijau berikut.\n[TABEL: Contoh Data Tinggi Tanaman Kacang Hijau]\n| Hari ke- | Tempat Terang (cm) | Tempat Gelap (cm) |\n| 1 | 0,5 | 0,6 |\n| 3 | 3,0 | 4,2 |\n| 5 | 7,5 | 9,8 |\n| 7 | 12,0 | 14,5 |\n\nData dalam tabel dapat diubah menjadi grafik. Grafik garis cocok untuk menunjukkan perubahan dari waktu ke waktu, sedangkan grafik batang cocok untuk membandingkan beberapa kelompok. Dari data di atas, tanaman di tempat gelap tumbuh lebih tinggi, tetapi biasanya batangnya kurus dan daunnya pucat. Gejala ini disebut *etiolasi*.\n\n# Menyusun Laporan Percobaan\nLaporan percobaan sederhana biasanya memuat:\n- judul percobaan;\n- tujuan percobaan;\n- alat dan bahan;\n- langkah kerja;\n- data hasil pengamatan;\n- analisis data dan pembahasan;\n- kesimpulan.\n\n[GAMBAR: Contoh Grafik Garis Pertumbuhan Tanaman | Ilustrasi Penulis (2026) | grafik garis tinggi tanaman di tempat terang dan gelap selama tujuh hari]\n\n[STEM: Grafik dengan Spreadsheet] Kalian dapat memasukkan data ke aplikasi lembar kerja (*spreadsheet*) dan membuat grafik secara otomatis (teknologi). Perhatikan pola grafiknya, lalu gunakan pola itu untuk memperkirakan tinggi tanaman pada hari ke-9 (matematika)."}], "dimensi": [{"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu merancang percobaan yang adil dan menarik kesimpulan berdasarkan data."}, {"dimensi": "Kolaborasi", "indikator": "Siswa mampu bekerja sama dalam kelompok saat merancang dan menguji penakar hujan."}, {"dimensi": "Kemandirian", "indikator": "Siswa mampu menerapkan aturan keselamatan kerja di laboratorium secara bertanggung jawab."}], "rangkuman": ["Sains adalah ilmu yang mempelajari alam beserta gejalanya, meliputi produk, proses, dan sikap ilmiah.", "Laboratorium memiliki alat dan bahan yang harus digunakan sesuai fungsi dan aturan keselamatan kerja.", "Metode ilmiah meliputi merumuskan masalah, menyusun hipotesis, melakukan percobaan, menganalisis data, menyimpulkan, dan mengomunikasikan hasil.", "Percobaan yang adil hanya mengubah satu variabel bebas, mengukur variabel terikat, dan menjaga variabel kontrol tetap.", "Besaran pokok dalam SI ada tujuh, yaitu panjang, massa, waktu, suhu, kuat arus listrik, jumlah zat, dan intensitas cahaya.", "Data percobaan disajikan dalam tabel dan grafik, lalu dilaporkan secara sistematis."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat menjelaskan hakikat sains?", "Apakah setelah mempelajari bab ini kalian dapat bekerja aman di laboratorium?", "Apakah setelah mempelajari bab ini kalian dapat merancang percobaan dan menentukan variabelnya?", "Apakah setelah mempelajari bab ini kalian dapat mengukur dan menyajikan data dalam tabel dan grafik?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Saat musim hujan, beberapa sekolah sering tergenang air, sementara pada musim kemarau tanaman di taman sekolah mudah layu. Sekolah memerlukan data curah hujan harian untuk mengatur jadwal penyiraman dan memperkirakan risiko genangan. Rancanglah alat penakar hujan sederhana dari botol bekas yang dapat mengukur curah hujan dalam milimeter.", "judul": "Penakar Hujan dari Botol Bekas", "steam": {"S": "Memahami bahwa curah hujan 1 mm berarti air hujan setinggi 1 mm di atas permukaan datar seluas 1 m² atau setara 1 liter air per meter persegi.", "T": "Memotret hasil pengamatan setiap hari dan mencatat data dalam aplikasi lembar kerja di telepon genggam.", "E": "Merancang penakar dengan corong dan wadah berdiameter sama, memberi pemberat agar tidak terguling, dan memperbaikinya setelah diuji.", "M": "Membuat skala milimeter, menghitung rata-rata curah hujan harian, dan membuat grafik curah hujan selama satu minggu."}, "alat": ["Botol plastik bekas 1,5 liter berdinding lurus", "Gunting atau cutter (digunakan dengan bimbingan guru)", "Penggaris dan spidol permanen", "Selotip bening", "Batu kerikil sebagai pemberat", "Buku catatan atau telepon genggam"], "langkah": ["Empati dan Bertanya: Wawancarai penjaga sekolah atau petugas kebun tentang masalah genangan dan penyiraman, lalu rumuskan pertanyaan: berapa curah hujan harian di sekolah kita?", "Bertukar Pikiran: Diskusikan berbagai bentuk penakar hujan dan pilih desain yang paling mudah, murah, dan akurat.", "Mendesain Solusi: Gambarlah sketsa penakar: bagian atas botol dipotong dan dibalik menjadi corong, bagian bawah diberi kerikil, dan dinding diberi skala milimeter.", "Membuat Solusi: Potong botol, pasang corong terbalik, isi dasar botol dengan kerikil dan air hingga garis nol, lalu tempelkan penggaris atau gambar skala.", "Menguji dan Mengevaluasi: Letakkan penakar di tempat terbuka, jauh dari atap dan pohon. Catat ketinggian air setiap pagi pada jam yang sama selama satu minggu, lalu kosongkan kembali hingga garis nol.", "Mendesain Ulang: Perbaiki desain jika ada masalah, misalnya air menguap terlalu cepat, penakar terguling, atau skala sulit dibaca.", "Mengomunikasikan: Sajikan data dalam tabel dan grafik, lalu presentasikan rekomendasi jadwal penyiraman taman kepada warga sekolah."], "produk": "Produk akhir berupa penakar hujan sederhana, tabel dan grafik curah hujan selama satu minggu, serta poster rekomendasi bagi sekolah. Setiap kelompok mempresentasikan proses pembuatan, data, dan hasil perbaikan desainnya.", "kriteria": ["Ketepatan skala dan cara pembacaan penakar", "Kelengkapan dan kerapian data pengamatan", "Ketepatan grafik dan analisis data", "Perbaikan desain berdasarkan hasil uji", "Kerja sama dan kejelasan presentasi"], "pertanyaan": "Bagaimana kita dapat membuat penakar hujan dari bahan bekas yang hasil ukurnya cukup akurat untuk menentukan jadwal penyiraman taman sekolah?", "prediksi": ["Menurut kalian, apakah diameter corong yang lebih lebar akan membuat angka curah hujan yang terbaca lebih besar? Jelaskan alasannya.", "Di bagian halaman sekolah mana penakar hujan sebaiknya diletakkan agar hasilnya paling tepat? Mengapa?"], "sukses": ["Selisih pembacaan penakar kalian dengan penakar kelompok lain di lokasi yang sama tidak lebih dari 2 mm", "Penakar tetap berdiri tegak selama 7 hari pengamatan", "Skala dapat dibaca hingga ketelitian 1 mm"], "batasan": ["Hanya menggunakan botol bekas dan bahan yang ada di sekolah", "Biaya tambahan maksimal Rp10.000 per kelompok", "Pemotongan botol dilakukan dengan pengawasan guru"], "data": {"kolom": ["Hari/Tanggal", "Jam Pembacaan", "Tinggi Air (mm)", "Catatan Cuaca"], "keterangan": "Baca ketinggian air setiap pagi pada jam yang sama, lalu kosongkan kembali hingga garis nol."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan kebutuhan data curah hujan bagi sekolah dan batasan desain", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menjelaskan arti curah hujan 1 mm dan penyebab kesalahan pengukuran", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Menguji, membandingkan dengan kelompok lain, dan memperbaiki desain berdasarkan data", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Mengukur tepat, menghitung rata-rata, dan membuat grafik curah hujan", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Di mana lagi data curah hujan dapat dimanfaatkan untuk membantu masyarakat di sekitarmu?"]}, "pg": [{"q": "Sikap ilmiah yang ditunjukkan dengan mencatat data apa adanya, meskipun tidak sesuai harapan, adalah ....", "opsi": ["rasa ingin tahu", "pantang menyerah", "kreatif", "jujur"], "kunci": "D"}, {"q": "Cabang sains yang mempelajari zat dan perubahannya adalah ....", "opsi": ["kimia", "fisika", "biologi", "astronomi"], "kunci": "A"}, {"q": "Alat yang paling tepat untuk mengukur volume 25 mL air adalah ....", "opsi": ["gelas kimia", "tabung reaksi", "gelas ukur", "cawan petri"], "kunci": "C"}, {"q": "Saat memanaskan zat dalam tabung reaksi, mulut tabung harus diarahkan ....", "opsi": ["ke wajah sendiri agar mudah diamati", "menjauhi diri sendiri dan orang lain", "ke arah teman di depan", "tegak lurus ke langit-langit tanpa dipegang"], "kunci": "B"}, {"q": "Rina menguji pengaruh jenis pupuk terhadap tinggi tanaman cabai. Variabel bebas dalam percobaan tersebut adalah ....", "opsi": ["tinggi tanaman", "banyaknya air", "jenis tanah", "jenis pupuk"], "kunci": "D"}, {"q": "Pada percobaan yang sama, variabel terikatnya adalah ....", "opsi": ["tinggi tanaman cabai", "jenis pupuk", "ukuran pot", "jumlah cahaya matahari"], "kunci": "A"}, {"q": "Kelompok besaran berikut yang semuanya termasuk besaran pokok adalah ....", "opsi": ["panjang, massa, kecepatan", "luas, volume, waktu", "massa, waktu, suhu", "suhu, gaya, massa jenis"], "kunci": "C"}, {"q": "Jarak dari rumah ke sekolah 2,4 km. Jarak tersebut sama dengan ....", "opsi": ["24 m", "240 m", "2.400 m", "24.000 m"], "kunci": "C"}, {"q": "Kesalahan membaca skala karena posisi mata tidak tegak lurus terhadap skala disebut kesalahan ....", "opsi": ["kalibrasi", "paralaks", "titik nol", "acak"], "kunci": "B"}, {"q": "Data perubahan suhu air setiap menit selama pemanasan paling tepat disajikan dalam bentuk ....", "opsi": ["peta konsep", "diagram lingkaran", "gambar sketsa", "grafik garis"], "kunci": "D"}], "esai": ["Jelaskan perbedaan sains sebagai produk dan sains sebagai proses, lalu berikan masing-masing satu contoh!", "Sebutkan empat aturan keselamatan kerja di laboratorium dan jelaskan alasan pentingnya salah satu aturan tersebut!", "Rancanglah percobaan sederhana untuk menguji apakah suhu air memengaruhi kecepatan larutnya gula. Tentukan hipotesis, variabel bebas, variabel terikat, dan variabel kontrolnya!", "Sebuah meja memiliki panjang 1,2 m dan lebar 80 cm. Hitunglah luas meja tersebut dalam satuan m²!", "Penakar hujan buatan kalian menunjukkan curah hujan 12 mm, 0 mm, 5 mm, 20 mm, dan 8 mm selama lima hari. Hitunglah rata-rata curah hujan harian dan jelaskan arti angka tersebut bagi jadwal penyiraman taman sekolah!"], "hots": [{"level": "A", "kasus": "Penakar A dibuat dari botol berdinding lurus, sedangkan penakar B dari botol yang bagian bawahnya menyempit. Setelah hujan yang sama, penakar B menunjukkan angka jauh lebih tinggi.", "tuntutan": "Jelaskan satu alasan ilmiah yang menyebabkan perbedaan hasil tersebut."}, {"level": "B", "kasus": "Data kelompok kalian menunjukkan 0 mm pada hari ketiga, padahal hujan turun pada sore hari.", "tuntutan": "Data apa yang perlu kalian kumpulkan sebelum memutuskan bagian penakar mana yang harus diperbaiki?"}, {"level": "C", "kasus": "Penakar X memiliki selisih 1 mm dari penakar standar tetapi sering terguling. Penakar Y memiliki selisih 3 mm tetapi selalu berdiri tegak.", "tuntutan": "Jika syarat utama adalah data yang dapat dipercaya selama satu minggu, desain mana yang lebih berhasil? Buktikan dengan argumen data."}]}, {"judul": "Zat dan Perubahannya", "ide": "Perahu pengangkut beban dari bahan bekas", "pemantik": ["Mengapa kapal laut yang terbuat dari baja dapat mengapung, sedangkan paku kecil tenggelam?", "Mengapa es batu di dalam gelas lama-kelamaan berubah menjadi air?", "Apa perbedaan kertas yang disobek dengan kertas yang dibakar?"], "tujuan": ["Siswa dapat menjelaskan wujud zat padat, cair, dan gas menggunakan model partikel.", "Siswa dapat menganalisis peristiwa perubahan wujud zat dalam kehidupan sehari-hari.", "Siswa dapat membedakan perubahan fisika dan perubahan kimia berdasarkan ciri-cirinya.", "Siswa dapat menghitung massa jenis zat dan menggunakannya untuk menjelaskan peristiwa terapung dan tenggelam.", "Siswa dapat merancang perahu dari bahan bekas yang mampu mengangkut beban paling banyak."], "kataKunci": ["zat", "partikel", "wujud zat", "perubahan wujud", "perubahan fisika", "perubahan kimia", "massa jenis"], "petaKonsep": [{"poin": ["Padat, cair, gas", "Model partikel"]}, {"poin": ["Mencair dan membeku", "Menguap dan mengembun", "Menyublim dan mengkristal"]}, {"poin": ["Ciri perubahan fisika", "Ciri perubahan kimia"]}, {"poin": ["Rumus massa jenis", "Terapung dan tenggelam"]}], "apersepsi": "Coba perhatikan pedagang es teh di dekat sekolah kalian. Pedagang itu memasukkan es batu ke dalam teh manis. Beberapa saat kemudian, es batu mengecil dan dinding gelas menjadi basah. Dari mana datangnya air di dinding luar gelas, padahal gelasnya tidak bocor?\n\n[GAMBAR: Gelas Es Teh dengan Dinding Basah | Ilustrasi Penulis (2026) | gelas berisi es teh dengan butiran air di dinding luarnya]\n\nPeristiwa sederhana itu melibatkan berbagai perubahan zat. Es batu mencair, sedangkan uap air di udara mengembun ketika menyentuh dinding gelas yang dingin. Pada bab ini, kalian akan mempelajari wujud zat, perubahan wujudnya, perbedaan perubahan fisika dan kimia, serta massa jenis yang menentukan benda terapung atau tenggelam.", "subbab": [{"judul": "Wujud Zat dan Model Partikel", "isi": "Zat adalah segala sesuatu yang memiliki massa dan menempati ruang. Udara, air, kayu, dan tubuh kalian semuanya merupakan zat. Zat tersusun atas partikel-partikel yang sangat kecil dan tidak dapat dilihat dengan mata telanjang.\n\n# Tiga Wujud Zat\nDalam kehidupan sehari-hari, zat dijumpai dalam tiga wujud, yaitu padat, cair, dan gas.\n[TABEL: Perbandingan Sifat Zat Padat, Cair, dan Gas]\n| Sifat | Padat | Cair | Gas |\n| Bentuk | Tetap | Mengikuti wadah | Mengikuti wadah |\n| Volume | Tetap | Tetap | Mengikuti wadah |\n| Jarak antarpartikel | Sangat rapat | Agak renggang | Sangat renggang |\n| Gerak partikel | Bergetar di tempat | Bergerak bebas tetapi saling bersinggungan | Bergerak sangat bebas dan cepat |\n| Contoh | Batu, kayu, es | Air, minyak, susu | Udara, uap air, oksigen |\n\n# Model Partikel\nModel partikel menggambarkan susunan dan gerak partikel penyusun zat. Pada zat padat, partikel tersusun teratur dan saling berdekatan sehingga bentuknya tetap. Pada zat cair, partikel dapat berpindah tempat sehingga zat cair dapat mengalir. Pada gas, partikel bergerak bebas ke segala arah sehingga gas memenuhi seluruh ruang.\n\n[GAMBAR: Model Partikel Zat Padat, Cair, dan Gas | Ilustrasi Penulis (2026) | tiga kotak berisi bola-bola kecil dengan susunan rapat, agak renggang, dan sangat renggang]\n\n# Gaya Tarik antarpartikel\nPartikel-partikel zat saling tarik-menarik. Gaya tarik antarpartikel sejenis disebut **kohesi**, sedangkan gaya tarik antarpartikel tidak sejenis disebut **adhesi**. Air membasahi kaca karena adhesi air dengan kaca lebih besar daripada kohesi antarpartikel air.\n\n[STEM: Membuat Model Partikel] Kalian dapat memodelkan zat padat, cair, dan gas dengan kelereng di dalam wadah. Kelereng yang dipadatkan dan diam mewakili zat padat, kelereng yang digeser perlahan mewakili zat cair, dan kelereng yang diguncang kuat mewakili gas. Membuat model adalah salah satu cara ilmuwan dan insinyur menjelaskan sesuatu yang tidak dapat dilihat langsung."}, {"judul": "Perubahan Wujud Zat", "isi": "Zat dapat berubah wujud jika menerima atau melepaskan kalor. Ketika zat menerima kalor, partikelnya bergerak makin cepat. Ketika zat melepaskan kalor, gerak partikelnya melambat.\n\n# Jenis-Jenis Perubahan Wujud\n[TABEL: Jenis Perubahan Wujud Zat]\n| Perubahan Wujud | Dari – Ke | Kalor | Contoh |\n| Mencair | Padat – cair | Diserap | Es batu mencair |\n| Membeku | Cair – padat | Dilepas | Air dalam *freezer* menjadi es |\n| Menguap | Cair – gas | Diserap | Air mendidih menjadi uap |\n| Mengembun | Gas – cair | Dilepas | Titik air di dinding gelas es |\n| Menyublim | Padat – gas | Diserap | Kapur barus mengecil |\n| Mengkristal (menghablur) | Gas – padat | Dilepas | Terbentuknya salju di awan |\n\n# Titik Lebur dan Titik Didih\nSetiap zat murni memiliki suhu tertentu saat berubah wujud. Air murni membeku dan es melebur pada suhu 0 °C, serta mendidih pada suhu 100 °C pada tekanan udara normal. Selama berubah wujud, suhu zat tetap walaupun zat terus menerima kalor, karena kalor digunakan untuk mengubah wujud.\n\n# Penguapan dan Faktor yang Memengaruhinya\nPenguapan dapat terjadi pada suhu berapa pun, tidak harus saat mendidih. Pakaian basah dapat kering karena airnya menguap. Penguapan menjadi lebih cepat jika:\n- suhu lebih tinggi;\n- permukaan zat cair lebih luas;\n- ada aliran udara (angin) di atas permukaan;\n- tekanan udara di atas permukaan lebih rendah.\n\n[GAMBAR: Petani Garam Menjemur Air Laut | Ilustrasi Penulis (2026) | petak-petak tambak garam dengan air laut yang dijemur di bawah terik matahari]\n\nPetani garam di pesisir Madura, Rembang, dan daerah lain memanfaatkan penguapan. Air laut dialirkan ke petak-petak tambak yang luas lalu dijemur. Air menguap, sedangkan garam tertinggal sebagai kristal.\n\n[STEM: Mempercepat Panen Garam] Petak tambak garam dibuat dangkal dan luas (enjinering) agar permukaan air yang terkena sinar matahari menjadi besar. Jika petak berukuran 5 m × 10 m, luas permukaannya 50 m². Makin luas permukaan, makin cepat
