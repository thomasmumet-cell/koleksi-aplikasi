air menguap (sains)."}, {"judul": "Perubahan Fisika dan Perubahan Kimia", "isi": "Perubahan yang terjadi pada zat dapat dibedakan menjadi dua, yaitu perubahan fisika dan perubahan kimia. Perbedaannya terletak pada ada atau tidaknya zat baru yang terbentuk.\n\n# Perubahan Fisika\nPerubahan fisika adalah perubahan zat yang tidak menghasilkan zat baru. Yang berubah hanyalah wujud, bentuk, atau ukurannya. Contohnya es mencair, kertas disobek, gula larut dalam air, dan kayu dipotong menjadi kursi. Banyak perubahan fisika dapat dikembalikan ke keadaan semula, misalnya air yang membeku dapat dicairkan kembali.\n\n# Perubahan Kimia\nPerubahan kimia adalah perubahan zat yang menghasilkan zat baru dengan sifat yang berbeda dari zat asalnya. Perubahan kimia disebut juga reaksi kimia. Contohnya kertas dibakar menjadi abu, besi berkarat, nasi menjadi basi, dan kedelai yang difermentasi menjadi tempe.\n\n# Ciri-Ciri Terjadinya Perubahan Kimia\nPerubahan kimia dapat dikenali dari beberapa ciri berikut.\n- Terjadi perubahan warna, misalnya apel yang dipotong menjadi kecokelatan.\n- Terbentuk gas, misalnya gelembung ketika tablet *effervescent* dimasukkan ke dalam air.\n- Terbentuk endapan.\n- Terjadi perubahan suhu, misalnya kayu terbakar yang menghasilkan panas.\n- Timbul bau, misalnya makanan yang membusuk.\n\n[TABEL: Perbedaan Perubahan Fisika dan Perubahan Kimia]\n| Aspek | Perubahan Fisika | Perubahan Kimia |\n| Zat baru | Tidak terbentuk | Terbentuk |\n| Sifat zat | Tetap sama | Berubah |\n| Dapat kembali seperti semula | Umumnya dapat | Umumnya tidak dapat |\n| Contoh | Lilin meleleh | Lilin terbakar |\n\n[GAMBAR: Pembuatan Tempe dari Kedelai | Ilustrasi Penulis (2026) | kedelai rebus yang dibungkus daun pisang dan tempe yang sudah jadi]\n\n[STEM: Tempe, Teknologi Pangan Nusantara] Pembuatan tempe adalah contoh bioteknologi konvensional. Jamur *Rhizopus* mengubah kedelai menjadi tempe yang lebih mudah dicerna (sains). Perajin mengatur suhu dan kelembapan ruang fermentasi (enjinering), menggunakan ragi tempe (teknologi), dan menghitung takaran ragi untuk setiap kilogram kedelai (matematika)."}, {"judul": "Massa Jenis Zat", "isi": "Mengapa sepotong kayu yang besar dapat terapung di air, sedangkan sebuah kelereng kaca yang kecil tenggelam? Jawabannya terletak pada massa jenis.\n\n# Pengertian Massa Jenis\nMassa jenis atau kerapatan adalah massa zat untuk setiap satuan volume. Massa jenis dihitung dengan rumus:\n\n**ρ = m : V**\n\ndengan ρ (dibaca *rho*) adalah massa jenis, m adalah massa, dan V adalah volume. Dalam SI, satuan massa jenis adalah kg/m³. Satuan lain yang sering digunakan adalah g/cm³, dengan 1 g/cm³ = 1.000 kg/m³.\n\n[TABEL: Massa Jenis Beberapa Zat (Nilai Pendekatan)]\n| Zat | Massa Jenis (g/cm³) |\n| Udara | 0,0012 |\n| Minyak goreng | 0,92 |\n| Es | 0,92 |\n| Air murni | 1,00 |\n| Air laut | 1,03 |\n| Aluminium | 2,7 |\n| Besi | 7,9 |\n\n# Contoh Perhitungan\nSebuah balok kayu bermassa 300 g memiliki volume 500 cm³. Massa jenisnya adalah ρ = 300 g : 500 cm³ = 0,6 g/cm³. Karena massa jenis kayu lebih kecil daripada massa jenis air (1 g/cm³), balok kayu itu terapung di air.\n\n# Terapung, Melayang, dan Tenggelam\n- Benda **terapung** jika massa jenisnya lebih kecil daripada massa jenis zat cair.\n- Benda **melayang** jika massa jenisnya sama dengan massa jenis zat cair.\n- Benda **tenggelam** jika massa jenisnya lebih besar daripada massa jenis zat cair.\n\nKapal baja dapat terapung karena badan kapal berongga dan berisi udara. Akibatnya, massa jenis rata-rata kapal, yaitu massa seluruh kapal dibagi volume total badannya, lebih kecil daripada massa jenis air laut.\n\n[GAMBAR: Kapal Pinisi di Pelabuhan | Ilustrasi Penulis (2026) | kapal kayu tradisional pinisi yang terapung di pelabuhan]\n\n[STEM: Kapal Pinisi dan Massa Jenis] Pembuat kapal pinisi di Sulawesi Selatan memilih kayu yang kuat dan ringan (sains), merancang lambung yang lebar dan berongga (enjinering), menggunakan perkakas pertukangan (teknologi), dan memperkirakan ukuran kapal sesuai muatan (matematika). Kearifan lokal ini menunjukkan penerapan konsep massa jenis jauh sebelum dipelajari di sekolah."}], "dimensi": [{"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu menggunakan data massa jenis untuk menjelaskan peristiwa terapung dan tenggelam."}, {"dimensi": "Kreativitas", "indikator": "Siswa mampu merancang perahu dari bahan bekas dengan desain yang inovatif."}, {"dimensi": "Kolaborasi", "indikator": "Siswa mampu membagi tugas dan bekerja sama saat membuat dan menguji perahu."}], "rangkuman": ["Zat adalah segala sesuatu yang memiliki massa dan menempati ruang, terdiri atas wujud padat, cair, dan gas.", "Model partikel menjelaskan perbedaan susunan dan gerak partikel pada zat padat, cair, dan gas.", "Perubahan wujud zat meliputi mencair, membeku, menguap, mengembun, menyublim, dan mengkristal.", "Perubahan fisika tidak menghasilkan zat baru, sedangkan perubahan kimia menghasilkan zat baru.", "Massa jenis adalah massa per satuan volume yang dirumuskan ρ = m : V.", "Benda terapung, melayang, atau tenggelam bergantung pada perbandingan massa jenis benda dengan massa jenis zat cair."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat menjelaskan wujud zat dengan model partikel?", "Apakah setelah mempelajari bab ini kalian dapat memberi contoh perubahan wujud zat?", "Apakah setelah mempelajari bab ini kalian dapat membedakan perubahan fisika dan perubahan kimia?", "Apakah setelah mempelajari bab ini kalian dapat menghitung massa jenis dan menjelaskan mengapa benda terapung atau tenggelam?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Di banyak daerah, perahu kecil masih menjadi alat angkut utama hasil bumi menyeberangi sungai. Para pemilik perahu ingin mengangkut barang sebanyak mungkin tanpa tenggelam. Rancanglah perahu dari bahan bekas yang dapat mengangkut beban paling banyak di atas air.", "judul": "Perahu Super Pengangkut Beban", "steam": {"S": "Menerapkan konsep massa jenis rata-rata: perahu tetap terapung selama massa total perahu dan muatan dibagi volume lambungnya lebih kecil daripada massa jenis air.", "T": "Menggunakan timbangan digital dapur dan merekam video pengujian dengan telepon genggam untuk dianalisis.", "E": "Merancang bentuk lambung, menguji, dan memperbaiki desain agar mampu menahan beban terbanyak tanpa bocor.", "M": "Menghitung volume lambung (panjang × lebar × tinggi), memperkirakan beban maksimum, dan membandingkan prediksi dengan hasil uji."}, "alat": ["Aluminium foil, karton susu bekas, atau botol plastik bekas", "Selotip dan gunting", "Baskom atau ember berisi air", "Uang logam atau kelereng sebagai beban", "Timbangan dapur digital", "Penggaris"], "langkah": ["Empati dan Bertanya: Bayangkan kebutuhan pemilik perahu penyeberangan, lalu rumuskan pertanyaan: bentuk perahu seperti apa yang mampu mengangkut beban terbanyak?", "Bertukar Pikiran: Kemukakan berbagai ide bentuk lambung, misalnya kotak, sampan, atau katamaran, lalu pilih satu desain terbaik.", "Mendesain Solusi: Buat sketsa perahu lengkap dengan ukuran, lalu hitung volume lambung dan perkiraan beban maksimumnya.", "Membuat Solusi: Bentuk perahu dari bahan bekas sesuai sketsa dan pastikan tidak ada bagian yang bocor.", "Menguji dan Mengevaluasi: Letakkan perahu di air, tambahkan beban satu per satu, dan catat jumlah beban sesaat sebelum perahu tenggelam. Ulangi pengujian tiga kali.", "Mendesain Ulang: Bandingkan hasil uji dengan prediksi, lalu ubah bentuk atau ukuran lambung untuk meningkatkan daya angkut.", "Mengomunikasikan: Presentasikan desain awal, data uji, perbaikan, dan penjelasan sains tentang mengapa perahu kalian dapat terapung."], "produk": "Produk akhir berupa perahu dari bahan bekas, tabel data pengujian, dan perhitungan volume lambung. Setiap kelompok mendemonstrasikan perahunya dan menjelaskan hubungan desain dengan konsep massa jenis.", "kriteria": ["Jumlah beban yang mampu diangkut", "Ketepatan perhitungan volume dan prediksi", "Penjelasan konsep massa jenis", "Perbaikan desain berdasarkan data", "Kerja sama dan presentasi"], "pertanyaan": "Bentuk lambung perahu seperti apa yang mampu mengangkut beban paling banyak tanpa tenggelam, dengan bahan yang sama?", "prediksi": ["Menurut kalian, apakah perahu yang lebih lebar selalu mampu mengangkut beban lebih banyak? Jelaskan alasannya.", "Mengapa selembar aluminium foil yang diremas menjadi bola tenggelam, tetapi jika dibentuk menjadi wadah dapat terapung?"], "sukses": ["Perahu mampu mengangkut paling sedikit 20 uang logam tanpa tenggelam", "Selisih prediksi beban maksimum dengan hasil uji tidak lebih dari 20%", "Perahu tidak bocor selama 1 menit di atas air"], "batasan": ["Bahan lambung maksimal satu lembar aluminium foil berukuran 20 cm × 20 cm atau satu karton susu bekas", "Ukuran perahu harus muat di baskom pengujian", "Tidak boleh menggunakan bahan pengapung tambahan seperti gabus"], "data": {"kolom": ["Desain ke-", "Panjang × Lebar × Tinggi (cm)", "Volume Lambung (cm³)", "Prediksi Beban (keping)", "Hasil Uji (keping)"], "keterangan": "Hitung volume lambung lebih dahulu, lalu uji setiap desain sebanyak tiga kali dan catat hasilnya."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan kebutuhan pengangkutan dan batasan bahan dengan tepat", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menjelaskan daya angkut dengan konsep massa jenis rata-rata berbasis data", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Menguji beberapa desain dan merevisi bentuk lambung berdasarkan hasil uji", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Menghitung volume, memprediksi beban, dan membandingkan prediksi dengan hasil uji", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Bagaimana konsep massa jenis rata-rata menjelaskan cara kerja pelampung atau rakit dari bambu?"]}, "pg": [{"q": "Zat yang memiliki bentuk berubah sesuai wadahnya tetapi volumenya tetap adalah zat ....", "opsi": ["cair", "padat", "gas", "plasma"], "kunci": "A"}, {"q": "Partikel yang tersusun sangat rapat, teratur, dan hanya bergetar di tempatnya merupakan ciri zat ....", "opsi": ["gas", "cair", "padat", "cair dan gas"], "kunci": "C"}, {"q": "Kapur barus di dalam lemari lama-kelamaan habis. Peristiwa tersebut disebut ....", "opsi": ["menguap", "menyublim", "mencair", "mengkristal"], "kunci": "B"}, {"q": "Embun yang terbentuk di daun pada pagi hari merupakan contoh perubahan wujud dari ....", "opsi": ["cair ke gas", "cair ke padat", "padat ke cair", "gas ke cair"], "kunci": "D"}, {"q": "Perhatikan peristiwa berikut: (1) besi berkarat, (2) es mencair, (3) kayu dibakar, (4) gula larut. Peristiwa yang termasuk perubahan kimia adalah ....", "opsi": ["(1) dan (2)", "(1) dan (3)", "(2) dan (4)", "(3) dan (4)"], "kunci": "B"}, {"q": "Salah satu ciri terjadinya perubahan kimia adalah ....", "opsi": ["terbentuknya gas atau endapan", "perubahan ukuran benda", "perubahan bentuk benda", "perubahan wujud dari padat ke cair"], "kunci": "A"}, {"q": "Sebuah batu bermassa 120 g memiliki volume 40 cm³. Massa jenis batu tersebut adalah ....", "opsi": ["0,33 g/cm³", "3 g/cm³", "80 g/cm³", "4.800 g/cm³"], "kunci": "B"}, {"q": "Massa jenis 2,7 g/cm³ jika dinyatakan dalam kg/m³ adalah ....", "opsi": ["27 kg/m³", "270 kg/m³", "2.700 kg/m³", "27.000 kg/m³"], "kunci": "C"}, {"q": "Minyak goreng selalu berada di atas air ketika dicampurkan karena ....", "opsi": ["massa jenis minyak lebih besar daripada air", "minyak lebih kental daripada air", "massa jenis minyak lebih kecil daripada air", "minyak memiliki suhu lebih tinggi"], "kunci": "C"}, {"q": "Kapal yang terbuat dari baja dapat terapung di laut karena ....", "opsi": ["massa jenis baja lebih kecil daripada air laut", "massa jenis rata-rata kapal yang berongga lebih kecil daripada air laut", "kapal bergerak sangat cepat", "air laut lebih ringan daripada air tawar"], "kunci": "B"}], "esai": ["Jelaskan perbedaan susunan dan gerak partikel pada zat padat, cair, dan gas menggunakan model partikel!", "Mengapa pakaian yang dijemur lebih cepat kering pada hari yang panas dan berangin? Jelaskan berdasarkan faktor-faktor yang memengaruhi penguapan!", "Lilin yang meleleh termasuk perubahan fisika, sedangkan lilin yang terbakar termasuk perubahan kimia. Jelaskan alasannya!", "Sebuah benda bermassa 450 g memiliki volume 500 cm³. Hitunglah massa jenisnya, lalu tentukan apakah benda tersebut terapung, melayang, atau tenggelam di dalam air!", "Rancanglah cara sederhana untuk membuktikan bahwa telur dapat terapung di air garam tetapi tenggelam di air tawar. Jelaskan alat, langkah, dan alasan ilmiahnya!"], "hots": [{"level": "A", "kasus": "Perahu A dan B dibuat dari aluminium foil yang sama. Perahu A berbentuk kotak dangkal yang lebar, sedangkan perahu B berbentuk sampan sempit. Perahu A mampu mengangkut beban dua kali lebih banyak.", "tuntutan": "Jelaskan satu alasan ilmiah yang menerangkan perbedaan daya angkut tersebut."}, {"level": "B", "kasus": "Perahu kalian tenggelam pada beban ke-12, padahal prediksi kalian 25 keping.", "tuntutan": "Data apa saja yang perlu dikumpulkan sebelum memutuskan bagian perahu yang harus diperbaiki?"}, {"level": "C", "kasus": "Perahu X mengangkut 30 keping tetapi mulai bocor pada detik ke-40. Perahu Y mengangkut 24 keping dan tidak bocor selama 1 menit.", "tuntutan": "Berdasarkan kriteria keberhasilan proyek, perahu mana yang lebih berhasil? Buktikan dengan argumen data."}]}, {"judul": "Suhu, Kalor, dan Pemuaian", "ide": "Kotak penyimpan dingin dari kardus bekas", "pemantik": ["Mengapa tangan terasa dingin ketika memegang besi, tetapi tidak terlalu dingin ketika memegang kayu pada suhu ruang yang sama?", "Mengapa kabel listrik di tiang dipasang agak kendur?", "Bagaimana pedagang es keliling menjaga es tetap beku dalam waktu lama tanpa kulkas?"], "tujuan": ["Siswa dapat mengukur suhu dengan termometer dan mengonversi skala suhu Celsius, Reamur, Fahrenheit, dan Kelvin.", "Siswa dapat menjelaskan pengaruh kalor terhadap perubahan suhu dan wujud zat.", "Siswa dapat menganalisis perpindahan kalor secara konduksi, konveksi, dan radiasi.", "Siswa dapat menjelaskan peristiwa pemuaian zat dan penerapannya dalam kehidupan sehari-hari.", "Siswa dapat merancang kotak penyimpan dingin dari bahan bekas dengan memanfaatkan bahan isolator."], "kataKunci": ["suhu", "termometer", "kalor", "kalor jenis", "konduksi", "konveksi", "radiasi", "pemuaian", "isolator"], "petaKonsep": [{"poin": ["Termometer", "Skala suhu"]}, {"poin": ["Kalor jenis", "Konduksi, konveksi, radiasi"]}, {"poin": ["Muai panjang", "Muai zat cair dan gas"]}, {"poin": ["Isolator dan konduktor", "Teknologi hemat energi"]}], "apersepsi": "Di berbagai daerah di Indonesia, banyak pedagang menjual minuman dingin dengan gerobak atau sepeda. Mereka tidak membawa kulkas, tetapi es batu di dalam kotak penyimpanannya dapat bertahan berjam-jam. Rahasianya terletak pada bahan kotak yang mampu menghambat masuknya panas.\n\n[GAMBAR: Kotak Penyimpan Es pada Gerobak Pedagang | Ilustrasi Penulis (2026) | gerobak pedagang minuman dengan kotak gabus berisi es batu]\n\nPeristiwa sehari-hari seperti air yang mendidih, jalan aspal yang terasa panas, dan kabel listrik yang kendur berkaitan dengan suhu, kalor, dan pemuaian. Pada bab ini, kalian akan mempelajari konsep-konsep tersebut dan menggunakannya untuk merancang solusi sederhana.", "subbab": [{"judul": "Suhu dan Termometer", "isi": "Suhu adalah ukuran derajat panas atau dinginnya suatu benda. Secara partikel, suhu menggambarkan rata-rata energi gerak partikel penyusun benda. Makin tinggi suhu benda, makin cepat partikel-partikelnya bergerak.\n\n# Mengapa Perlu Termometer?\nIndra peraba kita tidak dapat mengukur suhu dengan tepat. Cobalah masukkan tangan kiri ke air hangat dan tangan kanan ke air dingin, lalu masukkan kedua tangan ke air biasa. Tangan kiri akan merasa air biasa itu dingin, sedangkan tangan kanan merasakannya hangat. Karena itu, kita memerlukan alat ukur suhu yang disebut termometer.\n\n# Jenis-Jenis Termometer\n- **Termometer zat cair**, menggunakan raksa atau alkohol yang memuai ketika dipanaskan.\n- **Termometer klinis**, digunakan untuk mengukur suhu tubuh dengan rentang sekitar 35–42 °C.\n- **Termometer digital**, menggunakan sensor elektronik dan menampilkan angka pada layar.\n- **Termometer inframerah**, mengukur suhu tanpa menyentuh benda dengan menangkap radiasi inframerah yang dipancarkan benda.\n\n[GAMBAR: Beberapa Jenis Termometer | Ilustrasi Penulis (2026) | termometer zat cair, termometer klinis digital, dan termometer inframerah]\n\n# Skala Suhu\nTerdapat empat skala suhu yang dikenal luas. Perbedaannya terletak pada titik tetap bawah (titik beku air) dan titik tetap atas (titik didih air) pada tekanan normal.\n[TABEL: Titik Tetap pada Empat Skala Suhu]\n| Skala | Titik Beku Air | Titik Didih Air | Jumlah Skala |\n| Celsius (°C) | 0 | 100 | 100 |\n| Reamur (°R) | 0 | 80 | 80 |\n| Fahrenheit (°F) | 32 | 212 | 180 |\n| Kelvin (K) | 273 | 373 | 100 |\n\nPerbandingan skala C : R : (F – 32) = 100 : 80 : 180 = 5 : 4 : 9. Hubungan skala Celsius dan Kelvin adalah K = °C + 273.\n\n# Contoh Konversi Suhu\nSuhu tubuh normal sekitar 37 °C. Dalam skala lain:\n- Reamur: 4/5 × 37 = 29,6 °R\n- Fahrenheit: (9/5 × 37) + 32 = 98,6 °F\n- Kelvin: 37 + 273 = 310 K\n\n[STEM: Membuat Termometer Sederhana] Botol kecil berisi air berwarna yang ditutup rapat dan diberi sedotan dapat menjadi termometer sederhana. Saat botol dihangatkan, air memuai dan naik di sedotan (sains). Kalian dapat memberi skala dengan membandingkannya dengan termometer sungguhan (enjinering dan matematika)."}, {"judul": "Kalor dan Perpindahannya", "isi": "Kalor adalah energi panas yang berpindah dari benda bersuhu tinggi ke benda bersuhu rendah. Satuan kalor dalam SI adalah joule (J). Satuan lain yang sering digunakan adalah kalori, dengan 1 kalori ≈ 4,2 joule.\n\n# Kalor dan Perubahan Suhu\nBanyaknya kalor yang diperlukan untuk menaikkan suhu suatu benda bergantung pada massa benda, jenis zat, dan besar kenaikan suhu. Hubungan ini dirumuskan:\n\n**Q = m × c × ΔT**\n\ndengan Q adalah kalor (J), m adalah massa (kg), c adalah kalor jenis (J/kg °C), dan ΔT adalah perubahan suhu (°C). Kalor jenis air sekitar 4.200 J/kg °C, artinya diperlukan 4.200 J untuk menaikkan suhu 1 kg air sebesar 1 °C.\n\nContoh: kalor yang diperlukan untuk memanaskan 2 kg air dari 25 °C menjadi 75 °C adalah Q = 2 × 4.200 × 50 = 420.000 J atau 420 kJ.\n\n# Perpindahan Kalor\nKalor dapat berpindah melalui tiga cara.\n## Konduksi\nKonduksi adalah perpindahan kalor melalui zat perantara tanpa disertai perpindahan partikel zat itu. Contohnya ujung sendok logam ikut panas ketika ujung lainnya dicelupkan ke dalam teh panas. Bahan yang mudah menghantarkan kalor disebut **konduktor**, misalnya besi, aluminium, dan tembaga. Bahan yang sulit menghantarkan kalor disebut **isolator**, misalnya kayu, plastik, kain, dan gabus.\n## Konveksi\nKonveksi adalah perpindahan kalor yang disertai perpindahan partikel zat perantara. Konveksi terjadi pada zat cair dan gas. Contohnya gerakan air saat dimasak serta terjadinya angin darat dan angin laut.\n## Radiasi\nRadiasi adalah perpindahan kalor tanpa zat perantara. Contohnya panas matahari yang sampai ke bumi dan rasa hangat ketika duduk di dekat api unggun.\n\n[GAMBAR: Tiga Cara Perpindahan Kalor saat Memasak | Ilustrasi Penulis (2026) | panci di atas kompor yang menunjukkan konduksi pada pegangan, konveksi pada air, dan radiasi dari nyala api]\n\n[STEM: Memilih Bahan Panci] Insinyur merancang panci dengan badan dari aluminium atau baja (konduktor) agar makanan cepat matang, tetapi pegangannya dari plastik tahan panas atau kayu (isolator) agar aman dipegang. Pemilihan bahan ini adalah contoh penerapan sains dalam enjinering."}, {"judul": "Pemuaian", "isi": "Pemuaian adalah bertambahnya ukuran suatu benda karena menerima kalor. Ketika dipanaskan, partikel benda bergerak lebih cepat sehingga jarak antarpartikel bertambah. Sebaliknya, ketika didinginkan, benda menyusut.\n\n# Pemuaian Zat Padat\nZat padat dapat mengalami muai panjang, muai luas, dan muai volume. Besarnya pemuaian bergantung pada panjang awal, kenaikan suhu, dan jenis bahan. Setiap bahan memiliki **koefisien muai panjang** yang berbeda-beda.\n[TABEL: Koefisien Muai Panjang Beberapa Zat Padat (Nilai Pendekatan)]\n| Bahan | Koefisien Muai Panjang (per °C) |\n| Kaca biasa | 0,000009 |\n| Besi | 0,000012 |\n| Tembaga | 0,000017 |\n| Aluminium | 0,000024 |\n\nContoh: sebatang besi sepanjang 10 m dipanaskan sehingga suhunya naik 30 °C. Pertambahan panjangnya adalah 10 × 0,000012 × 30 = 0,0036 m atau 3,6 mm.\n\n# Pemuaian Zat Cair dan Gas\nZat cair memuai lebih besar daripada zat padat. Karena itu, botol minuman tidak diisi penuh agar tidak pecah ketika isinya memuai. Gas memuai lebih besar lagi. Ban sepeda yang dipompa terlalu keras dapat meletus jika dibiarkan di bawah terik matahari.\n\n# Pemuaian dalam Kehidupan Sehari-hari\n- Sambungan rel kereta api dan jembatan diberi celah agar tidak melengkung saat memuai.\n- Kabel listrik dan telepon dipasang agak kendur agar tidak putus saat menyusut pada malam yang dingin.\n- Bimetal, yaitu dua keping logam berbeda yang dilekatkan, melengkung ketika dipanaskan. Bimetal dimanfaatkan sebagai sakelar otomatis pada setrika listrik.\n\n[GAMBAR: Celah pada Sambungan Jembatan | Ilustrasi Penulis (2026) | sambungan jembatan berbentuk gigi sisir dengan celah kecil]\n\n[STEM: Celah Rel yang Tepat] Insinyur perkeretaapian menghitung lebar celah sambungan rel (matematika) berdasarkan panjang rel, jenis baja, dan perbedaan suhu siang dan malam (sains). Kini banyak rel menggunakan teknik pengelasan panjang dengan bantalan dan penambat khusus (teknologi) agar perjalanan kereta lebih nyaman."}, {"judul": "Pemanfaatan Energi Kalor", "isi": "Pemahaman tentang kalor membantu manusia membuat berbagai alat untuk memasak, mengawetkan makanan, dan menghemat energi.\n\n# Menahan Kalor dengan Isolator\nTermos dirancang untuk mencegah perpindahan kalor dengan ketiga cara. Ruang hampa udara di antara dinding kaca mencegah konduksi dan konveksi, sedangkan dinding kaca yang dilapisi perak memantulkan radiasi. Prinsip yang sama digunakan pada kotak pendingin dari gabus untuk menyimpan ikan hasil tangkapan nelayan.\n\n# Memanfaatkan Energi Matahari\nIndonesia berada di daerah tropis yang mendapat sinar matahari sepanjang tahun. Energi panas matahari dapat dimanfaatkan untuk:\n- menjemur dan mengeringkan hasil panen seperti padi, kopi, dan kakao;\n- memasak dengan kompor tenaga surya yang memusatkan cahaya matahari menggunakan cermin;\n- memanaskan air dengan pemanas air tenaga surya di atap rumah.\n\n[GAMBAR: Pengering Hasil Panen Tenaga Surya | Ilustrasi Penulis (2026) | rumah pengering berdinding plastik bening berisi biji kopi yang dijemur]\n\n# Kalor dan Kesehatan Lingkungan\nPenggunaan energi untuk pendingin ruangan dan pemanas menyumbang emisi gas rumah kaca jika listriknya berasal dari bahan bakar fosil. Rumah yang dirancang dengan ventilasi silang, atap tinggi, dan banyak tanaman dapat tetap sejuk tanpa banyak menggunakan pendingin ruangan.\n\n[STEM: Rumah Adat yang Sejuk] Banyak rumah adat Nusantara, seperti rumah panggung, memanfaatkan konveksi udara. Kolong rumah dan dinding kayu memungkinkan udara mengalir sehingga ruangan tetap sejuk (sains). Perancang bangunan modern mempelajari prinsip ini untuk merancang bangunan hemat energi (enjinering)."}], "dimensi": [{"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu menganalisis data suhu untuk menentukan bahan isolator terbaik."}, {"dimensi": "Kreativitas", "indikator": "Siswa mampu merancang kotak penyimpan dingin dari bahan bekas."}, {"dimensi": "Kewargaan", "indikator": "Siswa mampu memberikan solusi hemat energi yang bermanfaat bagi pedagang kecil di lingkungannya."}], "rangkuman": ["Suhu adalah ukuran derajat panas atau dinginnya benda dan diukur dengan termometer.", "Skala suhu Celsius, Reamur, Fahrenheit, dan Kelvin memiliki perbandingan C : R : (F – 32) = 5 : 4 : 9 dan K = °C + 273.", "Kalor adalah energi panas yang berpindah dari benda bersuhu tinggi ke benda bersuhu rendah dan dirumuskan Q = m × c × ΔT.", "Kalor berpindah secara konduksi, konveksi, dan radiasi.", "Pemuaian adalah bertambahnya ukuran benda karena dipanaskan dan dimanfaatkan atau diantisipasi dalam berbagai rancangan teknik.", "Bahan isolator dapat menghambat perpindahan kalor sehingga dimanfaatkan pada termos dan kotak pendingin."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat mengukur suhu dan mengonversi skala suhu?", "Apakah setelah mempelajari bab ini kalian dapat menghitung kalor yang diperlukan untuk menaikkan suhu benda?", "Apakah setelah mempelajari bab ini kalian dapat membedakan konduksi, konveksi, dan radiasi?", "Apakah setelah mempelajari bab ini kalian dapat menjelaskan pemuaian dan penerapannya?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Pedagang minuman keliling sering kehabisan es sebelum dagangannya habis terjual. Mereka membutuhkan kotak penyimpan dingin yang murah dan mampu menjaga es batu tetap beku lebih lama. Rancanglah kotak penyimpan dingin dari kardus dan bahan bekas lainnya.", "judul": "Si Awet Dingin: Kotak Penyimpan Es dari Kardus", "steam": {"S": "Menerapkan konsep konduksi, konveksi, dan radiasi untuk memilih bahan isolator dan menghambat masuknya kalor.", "T": "Menggunakan termometer digital dan timbangan untuk mengukur suhu serta massa es yang tersisa.", "E": "Merancang lapisan dinding kotak, tutup yang rapat, dan lapisan pemantul, lalu menguji dan memperbaikinya.", "M": "Menghitung persentase massa es yang tersisa setelah 2 jam dan membandingkannya dengan kotak tanpa isolasi."}, "alat": ["Kardus bekas dua ukuran", "Koran, kain perca, sekam, atau serbuk gergaji sebagai bahan pengisi", "Aluminium foil bekas", "Selotip dan lem", "Es batu dengan massa sama", "Timbangan dapur dan termometer"], "langkah": ["Empati dan Bertanya: Wawancarai pedagang minuman di sekitar sekolah tentang berapa lama es mereka bertahan, lalu rumuskan pertanyaan: bahan apa yang paling baik menahan es tetap beku?", "Bertukar Pikiran: Bandingkan berbagai bahan isolator yang mudah dan murah didapat, lalu pilih kombinasi bahan terbaik.", "Mendesain Solusi: Buat sketsa kotak berlapis: kardus kecil di dalam kardus besar, bahan pengisi di antara keduanya, lapisan aluminium foil di bagian dalam, dan tutup yang rapat.", "Membuat Solusi: Rakit kotak sesuai sketsa dan siapkan satu kotak kardus biasa tanpa isolasi sebagai pembanding.", "Menguji dan Mengevaluasi: Masukkan es batu bermassa sama ke kedua kotak, simpan di tempat yang sama selama 2 jam, lalu timbang es yang tersisa dan hitung persentasenya.", "Mendesain Ulang: Perbaiki bagian yang membuat kalor mudah masuk, misalnya celah pada tutup atau lapisan pengisi yang terlalu tipis, lalu uji kembali.", "Mengomunikasikan: Sajikan data dalam tabel dan grafik batang, lalu presentasikan rancangan terbaik kepada teman dan, bila memungkinkan, kepada pedagang di sekitar sekolah."], "produk": "Produk akhir berupa kotak penyimpan dingin dari bahan bekas beserta data perbandingan massa es yang tersisa. Setiap kelompok menjelaskan cara kotak menghambat konduksi, konveksi, dan radiasi.", "kriteria": ["Persentase es yang tersisa setelah pengujian", "Ketepatan penjelasan perpindahan kalor", "Kerapian data dan grafik", "Perbaikan desain berdasarkan hasil uji", "Kemanfaatan bagi pengguna dan presentasi"], "pertanyaan": "Bagaimana merancang kotak penyimpan dingin dari bahan bekas yang mampu mempertahankan es batu paling lama untuk pedagang minuman keliling?", "prediksi": ["Menurut kalian, bahan mana yang paling baik menahan es tetap beku: koran, kain perca, atau sekam padi? Jelaskan alasannya.", "Mengapa es di dalam wadah logam lebih cepat mencair daripada di dalam wadah gabus?"], "sukses": ["Paling sedikit 70% massa es tersisa setelah 2 jam", "Massa es yang tersisa lebih besar daripada kotak pembanding tanpa isolasi", "Kotak dapat dibuka dan ditutup kembali dengan rapat"], "batasan": ["Bahan utama kardus bekas dan bahan pengisi yang mudah didapat", "Ukuran kotak muat untuk 500 g es batu", "Pengujian dilakukan di tempat dan waktu yang sama dengan kotak pembanding"], "data": {"kolom": ["Waktu (menit)", "Suhu dalam Kotak (°C)", "Massa Es Tersisa (g)", "Persentase Es Tersisa (%)"], "keterangan": "Ukur suhu dan massa es pada menit ke-0, 30, 60, 90, dan 120 untuk kotak kalian dan kotak pembanding."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan kebutuhan pedagang dan batasan desain kotak", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menjelaskan penghambatan konduksi, konveksi, dan radiasi dengan bukti data", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Menguji, membandingkan dengan pembanding, dan merevisi lapisan isolasi", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Mengukur suhu dan massa dengan tepat serta menghitung persentase es tersisa", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Bagaimana prinsip isolator kalor ini dapat diterapkan untuk menjaga rumah tetap sejuk tanpa pendingin ruangan?"]}, "pg": [{"q": "Alat yang digunakan untuk mengukur suhu benda secara tepat adalah ....", "opsi": ["barometer", "anemometer", "higrometer", "termometer"], "kunci": "D"}, {"q": "Suhu 50 °C jika dinyatakan dalam skala Fahrenheit adalah ....", "opsi": ["90 °F", "112 °F", "122 °F", "132 °F"], "kunci": "C"}, {"q": "Suhu 27 °C jika dinyatakan dalam skala Kelvin adalah ....", "opsi": ["246 K", "273 K", "300 K", "327 K"], "kunci": "C"}, {"q": "Kalor yang diperlukan untuk menaikkan suhu 1 kg air sebesar 10 °C jika kalor jenis air 4.200 J/kg °C adalah ....", "opsi": ["420 J", "4.200 J", "42.000 J", "420.000 J"], "kunci": "C"}, {"q": "Ujung sendok yang tercelup teh panas membuat pegangannya ikut panas. Perpindahan kalor ini terjadi secara ....", "opsi": ["konduksi", "konveksi", "radiasi", "isolasi"], "kunci": "A"}, {"q": "Terjadinya angin laut pada siang hari merupakan contoh perpindahan kalor secara ....", "opsi": ["konduksi", "radiasi", "konveksi", "konduksi dan radiasi"], "kunci": "C"}, {"q": "Bahan yang paling tepat untuk pegangan panci adalah ....", "opsi": ["besi", "kayu", "tembaga", "aluminium"], "kunci": "B"}, {"q": "Kabel listrik dipasang agak kendur pada siang hari agar ....", "opsi": ["kabel tidak tersengat matahari", "arus listrik mengalir lebih cepat", "kabel mudah diganti", "tidak putus saat menyusut pada malam hari"], "kunci": "D"}, {"q": "Sebatang aluminium (koefisien muai panjang 0,000024/°C) sepanjang 2 m dipanaskan hingga suhunya naik 50 °C. Pertambahan panjangnya adalah ....", "opsi": ["0,0012 m", "0,0024 m", "0,024 m", "0,24 m"], "kunci": "B"}, {"q": "Dinding termos dilapisi bahan mengilap seperti perak untuk mencegah perpindahan kalor secara ....", "opsi": ["radiasi", "konveksi", "konduksi", "pemuaian"], "kunci": "A"}], "esai": ["Jelaskan mengapa indra peraba tidak dapat digunakan untuk mengukur suhu secara tepat!", "Ubahlah suhu 68 °F ke dalam skala Celsius dan Kelvin! Tuliskan langkah perhitungannya.", "Sebutkan masing-masing satu contoh perpindahan kalor secara konduksi, konveksi, dan radiasi dalam kehidupan sehari-hari!", "Mengapa sambungan rel kereta api atau jembatan diberi celah? Jelaskan hubungannya dengan pemuaian!", "Kotak penyimpan es A menyisakan 400 g es dan kotak B menyisakan 250 g es dari 500 g es awal setelah 2 jam. Hitunglah persentase es yang tersisa pada masing-masing kotak dan jelaskan kotak mana yang lebih baik serta alasannya!"], "hots": [{"level": "A", "kasus": "Kotak A berdinding kardus dua lapis berisi sekam, sedangkan kotak B berdinding kardus satu lapis. Setelah 2 jam, es di kotak A tersisa 380 g dan di kotak B tersisa 210 g dari 500 g.", "tuntutan": "Jelaskan satu alasan ilmiah yang menerangkan perbedaan hasil tersebut."}, {"level": "B", "kasus": "Kotak kalian hanya menyisakan 40% es, jauh di bawah target 70%.", "tuntutan": "Data apa yang perlu dikumpulkan untuk mengetahui bagian kotak yang paling banyak meloloskan kalor?"}, {"level": "C", "kasus": "Kotak X menyisakan 78% es tetapi beratnya 3 kg. Kotak Y menyisakan 72% es dengan berat 1 kg.", "tuntutan": "Jika kotak akan dibawa pedagang keliling dengan sepeda, desain mana yang lebih berhasil? Buktikan dengan argumen data dan kriteria."}]}, {"judul": "Gerak dan Gaya", "ide": "Mobil bertenaga balon", "pemantik": ["Mengapa penumpang terdorong ke depan ketika angkot mengerem mendadak?", "Bagaimana cara mengetahui siapa pelari paling cepat jika mereka berlari pada lintasan yang berbeda panjangnya?", "Mengapa sandal yang alasnya sudah licin mudah membuat kita tergelincir?"], "tujuan": ["Siswa dapat membedakan jarak dan perpindahan serta kelajuan dan kecepatan.", "Siswa dapat menganalisis gerak lurus beraturan dan gerak lurus berubah beraturan melalui tabel dan grafik.", "Siswa dapat menjelaskan jenis-jenis gaya dan menerapkan Hukum Newton dalam kehidupan sehari-hari.", "Siswa dapat menganalisis keuntungan dan kerugian gaya gesek.", "Siswa dapat merancang mobil bertenaga balon dan menghitung kelajuannya."], "kataKunci": ["gerak", "jarak", "perpindahan", "kelajuan", "kecepatan", "percepatan", "gaya", "Hukum Newton", "gaya gesek"], "petaKonsep": [{"poin": ["Jarak dan perpindahan", "Kelajuan dan kecepatan", "GLB dan GLBB"]}, {"poin": ["Jenis gaya", "Hukum I, II, III Newton"]}, {"poin": ["Gesek statis dan kinetis", "Untung rugi gesekan"]}], "apersepsi": "Setiap pagi, jalan raya dipenuhi kendaraan yang bergerak: sepeda, sepeda motor, bus sekolah, dan mobil. Ada yang melaju cepat, ada yang melambat ketika lampu lalu lintas berwarna merah, dan ada yang berbelok. Semua kendaraan itu bergerak karena ada gaya yang bekerja padanya.\n\n[GAMBAR: Lalu Lintas Pagi Hari di Depan Sekolah | Ilustrasi Penulis (2026) | murid bersepeda dan kendaraan yang melintas di depan gerbang sekolah]\n\nPemahaman tentang gerak dan gaya sangat penting, misalnya untuk merancang kendaraan yang aman, menentukan batas kecepatan di jalan, dan membuat sepatu yang tidak licin. Pada bab ini, kalian akan mempelajari cara menggambarkan gerak benda dan gaya-gaya yang memengaruhinya.", "subbab": [{"judul": "Gerak Benda", "isi": "Suatu benda dikatakan bergerak jika kedudukannya berubah terhadap titik acuan tertentu. Ketika kalian duduk di dalam bus yang melaju, kalian bergerak terhadap pohon di pinggir jalan, tetapi diam terhadap teman yang duduk di sebelah kalian. Artinya, gerak bersifat relatif, bergantung pada titik acuan yang dipilih.\n\n# Jarak dan Perpindahan\n**Jarak** adalah panjang seluruh lintasan yang ditempuh benda. **Perpindahan** adalah perubahan kedudukan benda dari posisi awal ke posisi akhir, dengan memperhatikan arah. Misalnya, Dina berjalan 40 m ke timur, lalu 10 m ke barat. Jarak yang ditempuh Dina adalah 50 m, sedangkan perpindahannya adalah 30 m ke arah timur.\n\n# Kelajuan dan Kecepatan\n**Kelajuan** adalah jarak yang ditempuh benda tiap satuan waktu, sedangkan **kecepatan** adalah perpindahan tiap satuan waktu. Kelajuan rata-rata dirumuskan:\n\n**v = s : t**\n\ndengan v adalah kelajuan (m/s), s adalah jarak (m), dan t adalah waktu (s).\n\nContoh: seorang pelari menempuh 100 m dalam waktu 12,5 s. Kelajuan rata-ratanya adalah 100 : 12,5 = 8 m/s.\n\nSatuan kelajuan kendaraan biasanya km/jam. Untuk mengubahnya ke m/s, gunakan hubungan 1 km/jam = 1.000 m : 3.600 s. Jadi, 72 km/jam = 72 × 1.000 : 3.600 = 20 m/s.\n\n# Gerak Lurus Beraturan dan Gerak Lurus Berubah Beraturan\n## Gerak Lurus Beraturan (GLB)\nGLB adalah gerak benda pada lintasan lurus dengan kecepatan tetap. Contohnya kereta api yang melaju stabil di rel lurus. Pada grafik jarak terhadap waktu, GLB digambarkan sebagai garis lurus miring.\n## Gerak Lurus Berubah Beraturan (GLBB)\nGLBB adalah gerak benda pada lintasan lurus dengan kecepatan yang berubah secara teratur. Perubahan kecepatan tiap satuan waktu disebut **percepatan**. Contoh GLBB dipercepat adalah buah kelapa yang jatuh dari pohon, sedangkan contoh GLBB diperlambat adalah sepeda yang direm hingga berhenti.\n\n[TABEL: Contoh Data Gerak Sebuah Sepeda]\n| Waktu (s) | Jarak Tempuh (m) |\n| 0 | 0 |\n| 2 | 8 |\n| 4 | 16 |\n| 6 | 24 |\n| 8 | 32 |\n\nDari data di atas, sepeda menempuh 4 m setiap sekon sehingga geraknya merupakan GLB dengan kelajuan 4 m/s.\n\n[STEM: Speedometer di Saku] Aplikasi peta pada telepon genggam dapat menampilkan kelajuan kendaraan dengan memanfaatkan sinyal GPS (teknologi). Aplikasi menghitung perubahan posisi tiap detik (matematika) untuk menampilkan kelajuan. Insinyur transportasi memanfaatkan data kelajuan ini untuk mengatur lalu lintas (enjinering)."}, {"judul": "Gaya dan Hukum Newton", "isi": "Gaya adalah tarikan atau dorongan yang dapat mengubah keadaan benda. Gaya dapat membuat benda diam menjadi bergerak, benda bergerak menjadi diam, mengubah arah gerak, serta mengubah bentuk benda. Satuan gaya dalam SI adalah newton (N), dan alat untuk mengukurnya disebut neraca pegas atau dinamometer.\n\n# Jenis-Jenis Gaya\n- **Gaya otot**, yaitu gaya yang dihasilkan oleh otot makhluk hidup, misalnya saat mendorong meja.\n- **Gaya gravitasi**, yaitu gaya tarik bumi terhadap benda. Gaya gravitasi menyebabkan benda memiliki berat. Berat benda dirumuskan w = m × g, dengan g ≈ 9,8 m/s² atau sering dibulatkan 10 m/s².\n- **Gaya magnet**, yaitu gaya tarik atau tolak magnet terhadap benda tertentu.\n- **Gaya listrik**, misalnya penggaris plastik yang telah digosokkan ke rambut dapat menarik potongan kertas kecil.\n- **Gaya pegas**, yaitu gaya yang ditimbulkan oleh benda elastis, misalnya pada ketapel.\n- **Gaya gesek**, yaitu gaya yang timbul akibat dua permukaan saling bersentuhan.\n\n# Resultan Gaya\nJika beberapa gaya bekerja pada satu benda, gaya-gaya itu dapat dijumlahkan menjadi resultan gaya. Gaya yang searah dijumlahkan, sedangkan gaya yang berlawanan arah dikurangkan. Pada permainan tarik tambang, regu A menarik dengan gaya 300 N ke kiri dan regu B menarik dengan gaya 280 N ke kanan. Resultan gayanya 20 N ke kiri sehingga regu A unggul.\n\n# Hukum Newton tentang Gerak\n## Hukum I Newton (Hukum Kelembaman)\nBenda yang diam akan tetap diam dan benda yang bergerak lurus beraturan akan tetap bergerak lurus beraturan jika resultan gaya yang bekerja padanya sama dengan nol. Itulah sebabnya penumpang terdorong ke depan saat kendaraan mengerem mendadak, sehingga sabuk pengaman sangat penting.\n## Hukum II Newton\nPercepatan benda sebanding dengan resultan gaya dan berbanding terbalik dengan massanya. Hukum ini dirumuskan **F = m × a**. Contoh: gaya 20 N yang bekerja pada troli bermassa 10 kg menghasilkan percepatan 20 : 10 = 2 m/s².\n## Hukum III Newton (Aksi–Reaksi)\nSetiap gaya aksi menimbulkan gaya reaksi yang sama besar dan berlawanan arah. Ketika kalian mendayung perahu, dayung mendorong air ke belakang (aksi), lalu air mendorong perahu ke depan (reaksi).\n\n[GAMBAR: Contoh Hukum III Newton pada Perahu Dayung | Ilustrasi Penulis (2026) | anak mendayung perahu dengan panah gaya aksi pada air dan reaksi pada perahu]\n\n[STEM: Sabuk Pengaman dan Helm] Hukum I Newton menjelaskan mengapa tubuh terus bergerak ketika kendaraan berhenti mendadak (sains). Insinyur merancang sabuk pengaman, kantong udara, dan helm (enjinering) untuk memperlambat tubuh secara bertahap. Pengujian tabrakan diukur dengan sensor (teknologi) dan dianalisis dengan perhitungan gaya (matematika)."}, {"judul": "Gaya Gesek", "isi": "Gaya gesek adalah gaya yang timbul ketika dua permukaan benda bersentuhan dan arahnya selalu melawan arah gerak atau kecenderungan gerak benda. Besarnya gaya gesek bergantung pada kekasaran permukaan dan gaya tekan antara kedua permukaan.\n\n# Jenis Gaya Gesek\n## Gaya Gesek Statis\nGaya gesek statis bekerja pada benda yang diam tetapi cenderung bergerak. Gaya inilah yang membuat lemari berat sulit didorong pada awalnya.\n## Gaya Gesek Kinetis\nGaya gesek kinetis bekerja pada benda yang sedang bergerak. Besarnya biasanya lebih kecil daripada gaya gesek statis maksimum. Itulah sebabnya lemari terasa lebih ringan didorong setelah mulai bergerak.\n\n# Gaya Gesek yang Menguntungkan dan Merugikan\n[TABEL: Contoh Gaya Gesek yang Menguntungkan dan Merugikan]\n| Menguntungkan | Merugikan |\n| Alas sepatu beralur membuat kita tidak mudah terpeleset | Gesekan pada mesin menimbulkan panas dan aus |\n| Rem sepeda dapat menghentikan laju sepeda | Ban kendaraan menjadi aus |\n| Ban beralur mencengkeram jalan | Gesekan udara memperlambat kendaraan dan memboroskan bahan bakar |\n| Kita dapat menulis karena gesekan pensil dengan kertas | Engsel pintu berderit dan cepat rusak |\n\n# Cara Memperbesar dan Memperkecil Gaya Gesek\n- Gaya gesek diperbesar dengan membuat permukaan lebih kasar, misalnya alur pada ban dan alas sepatu.\n- Gaya gesek diperkecil dengan pelumas (oli), memasang roda atau *bearing*, dan membuat bentuk benda lebih ramping (*aerodinamis*).\n\n[GAMBAR: Alur pada Ban dan Alas Sepatu | Ilustrasi Penulis (2026) | ban sepeda dan alas sepatu olahraga yang memiliki alur]\n\n[STEM: Desain Aerodinamis] Kereta cepat dan pesawat terbang dibuat dengan bentuk ramping untuk mengurangi gesekan udara (sains). Insinyur menguji model kecil di terowongan angin (enjinering dan teknologi), lalu menghitung gaya hambat udara pada berbagai kelajuan (matematika). Hasilnya, kendaraan dapat melaju lebih cepat dengan energi yang lebih hemat."}], "dimensi": [{"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu menganalisis data jarak dan waktu untuk menentukan jenis gerak."}, {"dimensi": "Kreativitas", "indikator": "Siswa mampu merancang mobil bertenaga balon yang melaju sejauh mungkin."}, {"dimensi": "Kesehatan", "indikator": "Siswa mampu menjelaskan pentingnya sabuk pengaman dan helm untuk keselamatan berlalu lintas."}], "rangkuman": ["Benda dikatakan bergerak jika kedudukannya berubah terhadap titik acuan.", "Jarak adalah panjang lintasan, sedangkan perpindahan adalah perubahan kedudukan dengan memperhatikan arah.", "Kelajuan rata-rata dirumuskan v = s : t.", "GLB adalah gerak lurus dengan kecepatan tetap, sedangkan GLBB adalah gerak lurus dengan kecepatan berubah secara teratur.", "Gaya adalah tarikan atau dorongan yang dapat mengubah gerak dan bentuk benda, diukur dalam satuan newton.", "Hukum Newton menjelaskan kelembaman benda, hubungan F = m × a, serta pasangan gaya aksi–reaksi.", "Gaya gesek dapat menguntungkan maupun merugikan sehingga perlu diperbesar atau diperkecil sesuai kebutuhan."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat membedakan jarak dan perpindahan?", "Apakah setelah mempelajari bab ini kalian dapat menghitung kelajuan rata-rata suatu benda?", "Apakah setelah mempelajari bab ini kalian dapat menerapkan Hukum Newton dalam kehidupan sehari-hari?", "Apakah setelah mempelajari bab ini kalian dapat memberi contoh gaya gesek yang menguntungkan dan merugikan?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Sekolah kalian akan mengadakan lomba kendaraan ramah lingkungan tanpa bahan bakar dan tanpa baterai. Setiap kelompok ditantang membuat mobil mainan yang digerakkan oleh udara dari balon dan dapat melaju sejauh mungkin di lantai kelas.", "judul": "Mobil Balon Hemat Energi", "steam": {"S": "Menerapkan Hukum III Newton: udara yang keluar dari balon ke belakang (aksi) mendorong mobil ke depan (reaksi), serta mengurangi gaya gesek pada roda.", "T": "Merekam gerak mobil dengan kamera telepon genggam dan menggunakan stopwatch untuk mengukur waktu tempuh.", "E": "Merancang badan mobil, poros, dan roda agar ringan, lurus, dan sedikit gesekan, lalu menguji dan memperbaikinya.", "M": "Mengukur jarak dan waktu tempuh, menghitung kelajuan rata-rata, dan membandingkan hasil antardesain."}, "alat": ["Botol plastik kecil atau kardus bekas sebagai badan mobil", "Tutup botol sebagai roda", "Sedotan dan tusuk sate sebagai poros", "Balon dan karet gelang", "Selotip dan lem tembak (dengan bimbingan guru)", "Meteran dan stopwatch"], "langkah": ["Empati dan Bertanya: Diskusikan masalah polusi kendaraan berbahan bakar, lalu rumuskan pertanyaan: bagaimana membuat kendaraan mainan yang bergerak tanpa bahan bakar dan melaju sejauh mungkin?", "Bertukar Pikiran: Kumpulkan ide tentang bahan badan mobil, ukuran roda, dan cara memasang balon, lalu pilih desain yang paling menjanjikan.", "Mendesain Solusi: Buat sketsa mobil lengkap dengan ukuran dan posisi poros, roda, serta balon.", "Membuat Solusi: Rakit mobil sesuai sketsa dan pastikan roda dapat berputar bebas.", "Menguji dan Mengevaluasi: Tiup balon dengan ukuran yang sama, lepaskan mobil di lintasan, lalu ukur jarak dan waktu tempuhnya. Ulangi tiga kali dan hitung kelajuan rata-ratanya.", "Mendesain Ulang: Temukan penyebab mobil berbelok atau cepat berhenti, misalnya roda miring atau gesekan poros terlalu besar, lalu perbaiki desainnya.", "Mengomunikasikan: Presentasikan desain awal, data uji, perhitungan kelajuan, dan perbaikan yang dilakukan dalam lomba kelas."], "produk": "Produk akhir berupa mobil bertenaga balon, tabel jarak dan waktu tempuh, serta perhitungan kelajuan rata-rata. Setiap kelompok menjelaskan penerapan Hukum III Newton dan gaya gesek pada mobilnya.", "kriteria": ["Jarak tempuh dan kestabilan arah mobil", "Ketepatan pengukuran dan perhitungan kelajuan", "Penjelasan konsep Hukum Newton dan gaya gesek", "Perbaikan desain berdasarkan data", "Kerja sama dan presentasi"], "pertanyaan": "Bagaimana merancang mobil bertenaga balon yang melaju paling jauh dan paling lurus tanpa bahan bakar maupun baterai?", "prediksi": ["Menurut kalian, apakah balon yang ditiup lebih besar selalu membuat mobil melaju lebih jauh? Jelaskan alasannya.", "Bagian mobil mana yang menurut kalian paling banyak menimbulkan gaya gesek yang merugikan? Mengapa?"], "sukses": ["Mobil menempuh jarak paling sedikit 3 m", "Mobil bergerak lurus dengan simpangan kurang dari 30 cm dari garis lintasan", "Hasil tiga kali pengujian tidak berbeda lebih dari 50 cm"], "batasan": ["Tenaga penggerak hanya dari satu balon", "Badan mobil dari bahan bekas dengan panjang maksimal 25 cm", "Balon ditiup hingga keliling yang sama setiap pengujian"], "data": {"kolom": ["Percobaan ke-", "Jarak Tempuh (m)", "Waktu Tempuh (s)", "Kelajuan Rata-rata (m/s)", "Simpangan dari Lintasan (cm)"], "keterangan": "Ukur jarak dan waktu setiap percobaan, lalu hitung kelajuan rata-rata dengan rumus v = s : t."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan tantangan kendaraan tanpa bahan bakar dan batasannya", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menjelaskan gerak mobil dengan Hukum III Newton dan gaya gesek berbasis bukti", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Menguji tiga kali, menganalisis penyebab mobil berbelok, dan merevisi desain", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Mengukur jarak dan waktu dengan tepat serta menghitung kelajuan", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Kendaraan atau alat apa lagi di sekitarmu yang bergerak berdasarkan prinsip aksi–reaksi?"]}, "pg": [{"q": "Andi berjalan 30 m ke utara, lalu 30 m ke selatan. Jarak dan perpindahan Andi berturut-turut adalah ....", "opsi": ["60 m dan 60 m", "60 m dan 0 m", "0 m dan 60 m", "30 m dan 30 m"], "kunci": "B"}, {"q": "Sebuah sepeda menempuh jarak 1.200 m dalam waktu 5 menit. Kelajuan rata-ratanya adalah ....", "opsi": ["4 m/s", "6 m/s", "24 m/s", "240 m/s"], "kunci": "A"}, {"q": "Kelajuan 54 km/jam sama dengan ....", "opsi": ["5,4 m/s", "15 m/s", "54 m/s", "150 m/s"], "kunci": "B"}, {"q": "Buah mangga yang jatuh dari pohonnya merupakan contoh gerak ....", "opsi": ["lurus beraturan", "lurus berubah beraturan diperlambat", "lurus berubah beraturan dipercepat", "melingkar beraturan"], "kunci": "C"}, {"q": "Gaya yang menyebabkan benda jatuh ke permukaan bumi adalah gaya ....", "opsi": ["gesek", "gravitasi", "pegas", "magnet"], "kunci": "B"}, {"q": "Dua anak mendorong meja ke arah yang sama dengan gaya 40 N dan 25 N. Resultan gayanya adalah ....", "opsi": ["15 N searah dorongan", "25 N searah dorongan", "40 N searah dorongan", "65 N searah dorongan"], "kunci": "D"}, {"q": "Penumpang terdorong ke depan ketika bus mengerem mendadak. Peristiwa ini sesuai dengan ....", "opsi": ["hukum kekekalan massa", "Hukum II Newton", "Hukum III Newton", "Hukum I Newton"], "kunci": "D"}, {"q": "Gaya sebesar 30 N bekerja pada benda bermassa 6 kg. Percepatan benda tersebut adalah ....", "opsi": ["0,2 m/s²", "5 m/s²", "24 m/s²", "180 m/s²"], "kunci": "B"}, {"q": "Roket dapat meluncur ke atas karena gas panas disemburkan ke bawah. Peristiwa ini merupakan penerapan ....", "opsi": ["Hukum III Newton", "Hukum II Newton", "Hukum I Newton", "gaya gesek"], "kunci": "A"}, {"q": "Upaya untuk memperkecil gaya gesek yang merugikan adalah ....", "opsi": ["membuat alur pada ban", "membuat alas sepatu bergerigi", "memberi oli pada rantai sepeda", "menaburkan pasir di jalan licin"], "kunci": "C"}], "esai": ["Jelaskan mengapa gerak bersifat relatif dan berikan satu contoh dalam kehidupan sehari-hari!", "Sebuah bus menempuh jarak 90 km dalam waktu 1,5 jam. Hitunglah kelajuan rata-rata bus dalam km/jam dan m/s!", "Jelaskan bunyi Hukum III Newton dan berikan dua contoh penerapannya!", "Sebutkan dua contoh gaya gesek yang menguntungkan dan dua contoh yang merugikan, lalu jelaskan cara mengatasi gaya gesek yang merugikan!", "Mobil balon kelompok kalian menempuh 4,8 m dalam 3 s, sedangkan mobil kelompok lain menempuh 6 m dalam 5 s. Hitunglah kelajuan masing-masing dan tentukan mobil mana yang lebih cepat!"], "hots": [{"level": "A", "kasus": "Mobil A memakai roda tutup botol dengan poros sedotan yang longgar, sedangkan mobil B memakai poros yang menempel ketat pada badan mobil. Mobil A melaju 4,5 m, sedangkan mobil B hanya 1,2 m.", "tuntutan": "Jelaskan satu alasan ilmiah yang menerangkan perbedaan jarak tempuh tersebut."}, {"level": "B", "kasus": "Mobil kalian selalu berbelok ke kiri dan berhenti pada jarak sekitar 1,5 m.", "tuntutan": "Data apa yang perlu dikumpulkan sebelum memutuskan bagian mobil yang harus diperbaiki?"}, {"level": "C", "kasus": "Mobil X menempuh 5 m dalam 4 s tetapi menyimpang 60 cm. Mobil Y menempuh 3,6 m dalam 4 s dan menyimpang 15 cm.", "tuntutan": "Berdasarkan semua kriteria keberhasilan proyek, mobil mana yang lebih berhasil? Buktikan dengan perhitungan kelajuan dan argumen data."}]}, {"judul": "Karakteristik dan Klasifikasi Makhluk Hidup", "ide": "Kunci determinasi digital tanaman sekolah", "pemantik": ["Apakah api yang dapat membesar dan bergerak termasuk makhluk hidup?", "Bagaimana cara petugas perpustakaan menemukan satu buku di antara ribuan buku? Apakah cara itu mirip dengan cara ilmuwan mengelompokkan makhluk hidup?", "Mengapa jamur tidak dikelompokkan ke dalam tumbuhan meskipun sama-sama tumbuh di tanah?"], "tujuan": ["Siswa dapat membedakan makhluk hidup dan benda tak hidup berdasarkan ciri-ciri kehidupan.", "Siswa dapat menjelaskan tujuan dan dasar pengelompokan makhluk hidup.", "Siswa dapat menyusun dan menggunakan kunci determinasi sederhana.", "Siswa dapat menjelaskan sistem penamaan ilmiah dan tingkatan takson.", "Siswa dapat mendeskripsikan keanekaragaman makhluk hidup dalam lima kerajaan dan keanekaragaman hayati Indonesia.", "Siswa dapat merancang kunci determinasi digital untuk tanaman di lingkungan sekolah."], "kataKunci": ["ciri makhluk hidup", "klasifikasi", "kunci determinasi", "takson", "tata nama ganda", "kingdom", "keanekaragaman hayati"], "petaKonsep": [{"poin": ["Ciri-ciri kehidupan", "Makhluk hidup dan benda mati"]}, {"poin": ["Kunci determinasi", "Takson dan tata nama"]}, {"poin": ["Lima kingdom", "Keanekaragaman hayati Indonesia"]}], "apersepsi": "Indonesia dikenal sebagai salah satu negara dengan keanekaragaman hayati tertinggi di dunia. Di hutan Kalimantan hidup orang utan, di Nusa Tenggara Timur ada komodo, dan di Sumatra tumbuh bunga *Rafflesia arnoldii* yang sangat besar. Bagaimana para ilmuwan dapat mengenali dan mempelajari jutaan jenis makhluk hidup yang begitu beragam?\n\n[GAMBAR: Keanekaragaman Hayati Indonesia | Ilustrasi Penulis (2026) | kolase orang utan, komodo, bunga rafflesia, dan burung cenderawasih]\n\nPara ilmuwan mengelompokkan makhluk hidup berdasarkan persamaan dan perbedaan cirinya. Cara ini membuat makhluk hidup lebih mudah dikenali, dipelajari, dan dilestarikan. Pada bab ini, kalian akan belajar mengenali ciri makhluk hidup, mengelompokkannya, dan menggunakan kunci determinasi.", "subbab": [{"judul": "Makhluk Hidup atau Benda Mati?", "isi": "Di sekitar kalian terdapat makhluk hidup dan benda tak hidup. Kucing, pohon mangga, dan jamur adalah makhluk hidup, sedangkan batu, meja, dan air adalah benda tak hidup. Untuk membedakannya, kita perlu memperhatikan ciri-ciri kehidupan.\n\n# Ciri-Ciri Makhluk Hidup\n[TABEL: Ciri-Ciri Makhluk Hidup dan Contohnya]\n| Ciri | Penjelasan | Contoh |\n| Bernapas | Mengambil oksigen untuk menghasilkan energi | Ikan bernapas dengan insang |\n| Memerlukan nutrisi | Membutuhkan makanan untuk energi dan pertumbuhan | Tumbuhan membuat makanan melalui fotosintesis |\n| Bergerak | Mengubah posisi tubuh atau bagian tubuh | Daun putri malu menutup saat disentuh |\n| Tumbuh dan berkembang | Bertambah ukuran dan menuju kedewasaan | Biji kacang tumbuh menjadi tanaman |\n| Berkembang biak | Menghasilkan keturunan | Ayam bertelur |\n| Peka terhadap rangsang | Menanggapi perubahan lingkungan | Pupil mata mengecil saat terkena cahaya terang |\n| Mengeluarkan zat sisa | Membuang sisa metabolisme | Manusia berkeringat |\n| Beradaptasi | Menyesuaikan diri dengan lingkungan | Kaktus memiliki daun berbentuk duri |\n\n# Mengapa Api dan Mobil Bukan Makhluk Hidup?\nApi dapat membesar dan memerlukan oksigen, sedangkan mobil dapat bergerak dan mengeluarkan gas buang. Namun, keduanya tidak memiliki semua ciri kehidupan. Api dan mobil tidak berkembang biak, tidak tumbuh dari dalam, dan tidak tersusun atas sel. Makhluk hidup harus menunjukkan ciri-ciri kehidupan secara keseluruhan.\n\n# Sel sebagai Penyusun Makhluk Hidup\nSemua makhluk hidup tersusun atas sel. Ada makhluk hidup yang hanya terdiri atas satu sel (uniseluler), seperti bakteri dan *Amoeba*, dan ada yang terdiri atas banyak sel (multiseluler), seperti manusia dan pohon.\n\n[GAMBAR: Mengamati Sel Bawang Merah dengan Mikroskop | Ilustrasi Penulis (2026) | sel-sel epidermis bawang merah yang tersusun rapat seperti batu bata]\n\n[STEM: Mikroskop dari Kamera Ponsel] Setetes air yang diletakkan di atas lensa kamera telepon genggam dapat berfungsi sebagai lensa pembesar sederhana (sains dan teknologi). Kalian dapat merancang dudukan dari kardus agar ponsel stabil (enjinering), lalu membandingkan ukuran gambar dengan ukuran asli benda untuk memperkirakan perbesarannya (matematika)."}, {"judul": "Mengapa Makhluk Hidup Dikelompokkan?", "isi": "Mengelompokkan makhluk hidup berdasarkan persamaan dan perbedaan cirinya disebut klasifikasi. Ilmu yang mempelajari klasifikasi makhluk hidup disebut taksonomi.\n\n# Tujuan Klasifikasi\n- Menyederhanakan objek studi yang sangat beragam.\n- Mempermudah mengenali dan mempelajari makhluk hidup.\n- Mengetahui hubungan kekerabatan antarmakhluk hidup.\n- Memudahkan komunikasi antarilmuwan di seluruh dunia.\n\n# Kunci Determinasi\nKunci determinasi adalah alat untuk mengidentifikasi makhluk hidup melalui serangkaian pernyataan berpasangan yang saling berlawanan. Setiap langkah memiliki dua pilihan, misalnya \"berkaki\" atau \"tidak berkaki\". Pilihan yang sesuai akan mengarahkan ke langkah berikutnya hingga nama makhluk hidup ditemukan.\n\n[TABEL: Contoh Kunci Determinasi Sederhana Hewan]\n| Nomor | Pernyataan | Arah |\n| 1a | Memiliki tulang belakang | Ke nomor 2 |\n| 1b | Tidak memiliki tulang belakang | Cacing tanah |\n| 2a | Hidup di air dan bernapas dengan insang | Ikan mas |\n| 2b | Tidak bernapas dengan insang | Ke nomor 3 |\n| 3a | Tubuh tertutup bulu dan memiliki paruh | Ayam |\n| 3b | Tubuh tertutup rambut dan menyusui | Kucing |\n\n# Tingkatan Takson\nMakhluk hidup dikelompokkan secara bertingkat. Tingkatan pengelompokan itu disebut takson. Urutan takson dari yang tertinggi adalah:\n**Kingdom – Filum/Divisi – Kelas – Ordo – Famili – Genus – Spesies**\nMakin tinggi tingkat takson, makin banyak anggotanya tetapi makin sedikit persamaannya. Sebaliknya, makin rendah tingkat takson, makin sedikit anggotanya tetapi makin banyak persamaannya.\n\n# Tata Nama Ganda (*Binomial Nomenclature*)\nSetiap jenis makhluk hidup memiliki nama ilmiah yang terdiri atas dua kata, yaitu nama genus dan nama penunjuk spesies. Sistem ini dikembangkan oleh Carolus Linnaeus. Aturan penulisannya:\n- kata pertama diawali huruf kapital, kata kedua huruf kecil semua;\n- ditulis miring atau diberi garis bawah jika ditulis tangan.\n\nContohnya padi bernama ilmiah *Oryza sativa*, kucing *Felis catus*, dan manusia *Homo sapiens*.\n\n[STEM: Database Makhluk Hidup] Para ilmuwan kini menyimpan data jutaan spesies dalam basis data daring (teknologi). Setiap data disusun mengikuti urutan takson sehingga mudah dicari, mirip cara folder dan subfolder disusun di komputer (enjinering informasi). Jumlah spesies dalam setiap kelompok dapat dianalisis dengan statistik (matematika)."}, {"judul": "Makhluk Hidup Beraneka Ragam", "isi": "Para ilmuwan mengelompokkan makhluk hidup ke dalam beberapa kingdom. Salah satu sistem yang banyak digunakan dalam pembelajaran adalah sistem lima kingdom yang dikemukakan oleh Robert H. Whittaker.\n\n# Lima Kingdom Makhluk Hidup\n[TABEL: Ciri dan Contoh Lima Kingdom]\n| Kingdom | Ciri Utama | Contoh |\n| Monera | Uniseluler, tidak memiliki membran inti sel | Bakteri *Lactobacillus* pada yoghurt |\n| Protista | Memiliki membran inti, umumnya uniseluler | *Amoeba*, *Paramecium*, alga hijau |\n| Fungi (jamur) | Tidak berklorofil, menyerap makanan dari lingkungan | Jamur tiram, ragi tempe |\n| Plantae (tumbuhan) | Multiseluler, berklorofil, membuat makanan sendiri | Padi, pakis, lumut |\n| Animalia (hewan) | Multiseluler, tidak berklorofil, memakan makhluk lain | Kucing, ikan, kupu-kupu |\n\n# Keanekaragaman Hayati Indonesia\nKeanekaragaman hayati adalah keanekaragaman makhluk hidup di bumi. Keanekaragaman hayati dapat dilihat pada tiga tingkat:\n- **Tingkat gen**, misalnya perbedaan warna dan ukuran buah mangga dari berbagai varietas.\n- **Tingkat jenis**, misalnya kucing, harimau, dan singa yang masih satu famili tetapi berbeda jenis.\n- **Tingkat ekosistem**, misalnya hutan hujan tropis, padang rumput savana, hutan bakau, dan terumbu karang.\n\nIndonesia memiliki banyak jenis endemik, yaitu jenis yang hanya hidup secara alami di daerah tertentu. Contohnya komodo di Nusa Tenggara Timur, anoa di Sulawesi, cenderawasih di Papua, dan jalak bali di Bali.\n\n[GAMBAR: Hewan Endemik Indonesia | Ilustrasi Penulis (2026) | komodo, anoa, burung cenderawasih, dan jalak bali]\n\n# Peran Jamur dan Bakteri bagi Manusia\nBanyak anggota kingdom Monera dan Fungi bermanfaat bagi manusia. Ragi tempe membantu mengubah kedelai menjadi tempe, bakteri *Lactobacillus* digunakan dalam pembuatan yoghurt, dan jamur pengurai membantu menguraikan sampah organik menjadi kompos. Namun, ada juga yang merugikan, seperti bakteri penyebab penyakit dan jamur penyebab panu.\n\n[STEM: Aplikasi Pengenal Tumbuhan] Beberapa aplikasi telepon genggam dapat mengenali jenis tumbuhan dari foto daun atau bunganya menggunakan kecerdasan artifisial (teknologi). Aplikasi itu dilatih dengan ribuan foto yang dikelompokkan seperti kunci determinasi (sains dan matematika). Meskipun praktis, hasil aplikasi tetap perlu dicocokkan dengan pengamatan langsung."}], "dimensi": [{"dimensi": "Penalaran Kritis", "indikator": "Siswa mampu mengelompokkan makhluk hidup berdasarkan ciri yang diamati."}, {"dimensi": "Kewargaan", "indikator": "Siswa mampu menunjukkan kepedulian terhadap pelestarian keanekaragaman hayati Indonesia."}, {"dimensi": "Komunikasi", "indikator": "Siswa mampu menyajikan informasi tanaman sekolah dalam bentuk label digital yang mudah dipahami."}], "rangkuman": ["Makhluk hidup memiliki ciri bernapas, memerlukan nutrisi, bergerak, tumbuh dan berkembang, berkembang biak, peka terhadap rangsang, mengeluarkan zat sisa, dan beradaptasi.", "Klasifikasi adalah pengelompokan makhluk hidup berdasarkan persamaan dan perbedaan cirinya.", "Kunci determinasi membantu mengidentifikasi makhluk hidup melalui pernyataan berpasangan yang berlawanan.", "Urutan takson dari tertinggi adalah kingdom, filum atau divisi, kelas, ordo, famili, genus, dan spesies.", "Nama ilmiah ditulis dengan tata nama ganda yang terdiri atas nama genus dan penunjuk spesies.", "Sistem lima kingdom terdiri atas Monera, Protista, Fungi, Plantae, dan Animalia.", "Keanekaragaman hayati terdapat pada tingkat gen, jenis, dan ekosistem."], "refleksi": ["Apakah setelah mempelajari bab ini kalian dapat membedakan makhluk hidup dan benda tak hidup?", "Apakah setelah mempelajari bab ini kalian dapat menggunakan kunci determinasi sederhana?", "Apakah setelah mempelajari bab ini kalian dapat menuliskan nama ilmiah dengan benar?", "Apakah setelah mempelajari bab ini kalian dapat menjelaskan ciri lima kingdom dan keanekaragaman hayati Indonesia?"], "ayoMencoba": {"pengantar": "Buatlah kelompok yang terdiri dari 3–4 orang. Banyak warga sekolah tidak mengetahui nama dan manfaat tanaman yang tumbuh di halaman sekolah. Akibatnya, tanaman sering dirusak atau tidak dirawat. Rancanglah kunci determinasi dan label digital tanaman sekolah yang dapat dipindai dengan telepon genggam.", "judul": "Kenali Tanamanku: Kunci Determinasi Digital", "steam": {"S": "Mengamati ciri tanaman, seperti bentuk daun, tulang daun, batang, dan bunga, lalu menyusun kunci determinasi berpasangan.", "T": "Membuat halaman informasi tanaman dalam dokumen daring dan mengubah tautannya menjadi kode QR.", "E": "Merancang label tahan cuaca dari bahan bekas, menguji keterbacaan kode QR, dan memperbaikinya.", "M": "Mengukur tinggi dan lebar daun, menghitung jumlah jenis tanaman per kelompok, dan menyajikannya dalam diagram batang."}, "alat": ["Telepon genggam berkamera", "Penggaris dan meteran", "Buku catatan pengamatan", "Plastik bening atau botol bekas untuk pelindung label", "Kertas, gunting, dan selotip", "Aplikasi pembuat kode QR"], "langkah": ["Empati dan Bertanya: Tanyai beberapa teman dan guru tentang tanaman yang mereka kenal di sekolah, lalu rumuskan masalah: bagaimana agar warga sekolah mudah mengenali tanaman di sekitarnya?", "Bertukar Pikiran: Diskusikan informasi yang perlu dicantumkan, seperti nama lokal, nama ilmiah, ciri, dan manfaat tanaman, serta bentuk label yang menarik.", "Mendesain Solusi: Amati minimal delapan jenis tanaman, catat cirinya, lalu susun kunci determinasi berpasangan dan rancangan label.", "Membuat Solusi: Buat halaman informasi setiap tanaman, ubah tautannya menjadi kode QR, cetak, dan lindungi dengan plastik bening.", "Menguji dan Mengevaluasi: Minta teman dari kelas lain menggunakan kunci determinasi dan memindai kode QR. Catat berapa tanaman yang berhasil mereka kenali dengan benar.", "Mendesain Ulang: Perbaiki pernyataan kunci yang membingungkan atau label yang sulit dipindai berdasarkan masukan penguji.", "Mengomunikasikan: Pasang label di dekat tanaman dan presentasikan kunci determinasi beserta diagram jumlah jenis tanaman di sekolah."], "produk": "Produk akhir berupa kunci determinasi tanaman sekolah, label tanaman berkode QR yang terpasang, dan diagram batang jumlah jenis tanaman. Setiap kelompok mempresentasikan cara menggunakan kunci determinasi tersebut.", "kriteria": ["Ketepatan ciri tanaman dan pernyataan kunci determinasi", "Ketepatan penulisan nama ilmiah", "Kemudahan label dipindai dan dibaca", "Perbaikan berdasarkan hasil uji pengguna", "Kerja sama dan presentasi"], "pertanyaan": "Bagaimana membuat kunci determinasi dan label digital yang membuat warga sekolah dapat mengenali tanaman di sekitarnya dengan benar?", "prediksi": ["Ciri tanaman apa yang menurut kalian paling mudah digunakan untuk membedakan satu jenis tanaman dengan jenis lainnya? Mengapa?", "Menurut kalian, berapa persen teman dari kelas lain yang dapat mengenali tanaman dengan benar menggunakan kunci determinasi buatan kalian?"], "sukses": ["Minimal 8 jenis tanaman teridentifikasi dengan nama lokal dan nama ilmiah yang benar", "Paling sedikit 80% penguji dapat mengenali tanaman dengan benar menggunakan kunci determinasi", "Semua kode QR dapat dipindai dari jarak 30 cm"], "batasan": ["Tidak memetik atau merusak tanaman saat pengamatan", "Label harus tahan cuaca dan dibuat dari bahan bekas", "Informasi harus dicek kebenarannya dari sumber tepercaya"], "data": {"kolom": ["Nama Tanaman", "Ciri Pembeda Utama", "Jumlah Penguji", "Jumlah Penguji yang Benar", "Persentase Benar (%)"], "keterangan": "Catat hasil uji coba kunci determinasi oleh teman dari kelas lain untuk setiap tanaman."}, "rubrik": [{"aspek": "Masalah", "skor4": "Menjelaskan kebutuhan warga sekolah dan batasan kegiatan pengamatan", "skor1": "Belum memahami tujuan dan batasan masalah"}, {"aspek": "Penalaran IPA", "skor4": "Menyusun pernyataan kunci determinasi berdasarkan ciri yang tepat dan teramati", "skor1": "Konsep yang digunakan belum relevan"}, {"aspek": "Rekayasa", "skor4": "Menguji kunci kepada pengguna dan merevisi pernyataan yang membingungkan", "skor1": "Belum menguji desain secara sistematis"}, {"aspek": "Data & Matematika", "skor4": "Mengukur ciri tanaman dan menghitung persentase keberhasilan penguji", "skor1": "Belum memakai data untuk mengambil keputusan"}, {"aspek": "Kreativitas & Komunikasi", "skor4": "Desain orisinal, fungsional, dan dipresentasikan dengan alasan ilmiah yang jelas", "skor1": "Pertimbangan desain terbatas dan penjelasan kurang jelas"}, {"aspek": "Kolaborasi", "skor4": "Peran anggota seimbang dan keputusan tim didukung argumen berbasis bukti", "skor1": "Perlu banyak bimbingan dalam bekerja sama"}], "refleksi": ["Apakah hasil uji sesuai dengan prediksi awalmu? Jelaskan.", "Kegagalan apa yang paling berharga dalam proyek ini, dan apa yang kamu pelajari darinya?", "Jika mendapat kesempatan mengulang, perubahan apa yang akan kamu lakukan pada desainmu? Mengapa?", "Bagaimana cara berpikir kunci determinasi dapat dipakai untuk mengelompokkan benda atau informasi lain dalam kehidupan sehari-hari?"]}, "pg": [{"q": "Daun putri malu menutup ketika disentuh. Hal ini menunjukkan ciri makhluk hidup, yaitu ....", "opsi": ["bernapas", "peka terhadap rangsang", "berkembang biak", "memerlukan makanan"], "kunci": "B"}, {"q": "Api tidak termasuk makhluk hidup karena ....", "opsi": ["tidak memerlukan oksigen", "tidak dapat membesar", "tidak menghasilkan panas", "tidak tersusun atas sel dan tidak berkembang biak"], "kunci": "D"}, {"q": "Tujuan utama klasifikasi makhluk hidup adalah ....", "opsi": ["mempermudah mengenali dan mempelajari makhluk hidup", "memusnahkan makhluk hidup yang merugikan", "memperbanyak jumlah spesies", "menentukan harga jual hewan dan tumbuhan"], "kunci": "A"}, {"q": "Urutan takson yang benar dari tingkat terendah ke tertinggi adalah ....", "opsi": ["kingdom – filum – kelas – ordo", "genus – spesies – ordo – famili", "spesies – genus – famili – ordo", "famili – genus – ordo – kelas"], "kunci": "C"}, {"q": "Penulisan nama ilmiah padi yang benar adalah ....", "opsi": ["Oryza Sativa", "*Oryza sativa*", "oryza sativa", "*Oryza Sativa*"], "kunci": "B"}, {"q": "Makin rendah tingkat takson, maka ....", "opsi": ["anggotanya makin banyak dan persamaannya makin sedikit", "anggota dan persamaannya makin sedikit", "anggota dan persamaannya makin banyak", "anggotanya makin sedikit dan persamaannya makin banyak"], "kunci": "D"}, {"q": "Makhluk hidup uniseluler yang tidak memiliki membran inti sel termasuk kingdom ....", "opsi": ["Monera", "Protista", "Fungi", "Plantae"], "kunci": "A"}, {"q": "Jamur tidak dimasukkan ke dalam kingdom Plantae karena ....", "opsi": ["hidup di tempat lembap", "berkembang biak dengan spora", "tidak memiliki klorofil sehingga tidak dapat membuat makanan sendiri", "berukuran kecil"], "kunci": "C"}, {"q": "Perbedaan warna bunga mawar merah, putih, dan kuning menunjukkan keanekaragaman hayati tingkat ....", "opsi": ["jenis", "gen", "ekosistem", "kingdom"], "kunci": "B"}, {"q": "Hewan endemik yang hanya hidup secara alami di Pulau Sulawesi adalah ....", "opsi": ["komodo", "orang utan", "jalak bali", "anoa"], "kunci": "D"}], "esai": ["Sebutkan lima ciri makhluk hidup dan berikan masing-masing satu contoh!", "Jelaskan mengapa mobil yang dapat bergerak dan mengeluarkan gas buang tidak termasuk makhluk hidup!", "Susunlah kunci determinasi sederhana untuk mengelompokkan hewan berikut: kupu-kupu, ikan lele, burung merpati, dan kucing!", "Jelaskan aturan penulisan nama ilmiah berdasarkan tata nama ganda dan berikan dua contohnya!", "Mengapa keanekaragaman hayati Indonesia perlu dilestarikan? Usulkan dua tindakan nyata yang dapat kalian lakukan di sekolah!"], "hots": [{"level": "A", "kasus": "Kunci determinasi A memakai ciri bentuk daun dan susunan tulang daun, sedangkan kunci B memakai ciri warna bunga. Pada musim kemarau, banyak penguji gagal menggunakan kunci B.", "tuntutan": "Jelaskan satu alasan ilmiah mengapa kunci B lebih sering gagal."}, {"level": "B", "kasus": "Hanya 50% penguji yang dapat mengenali tanaman mangga dan rambutan dengan benar.", "tuntutan": "Data apa yang perlu dikumpulkan sebelum memutuskan pernyataan kunci mana yang harus diperbaiki?"}, {"level": "C", "kasus": "Kelompok X membuat 12 label dengan tingkat keberhasilan penguji 70%. Kelompok Y membuat 8 label dengan tingkat keberhasilan 90%.", "tuntutan": "Berdasarkan kriteria keberhasilan proyek, kelompok mana yang lebih berhasil? Buktikan dengan argumen data."}]}, {"judul": "Ekologi dan Pelestarian Lingkungan", "ide": "Komposter Takakura dari keranjang bekas", "pemantik": ["Apa yang akan terjadi pada sawah jika semua ular dan burung hantu di sekitarnya diburu habis?", "Mengapa sampah sisa makanan yang dibuang ke tempat sampah dapat menimbulkan bau dan mengundang lalat?", "Bagaimana kalian dapat membantu mengurangi sampah yang dibawa ke tempat pembuangan akhir?"], "tujuan": ["Siswa dapat mengidentifikasi komponen biotik dan abiotik serta tingkatan organisasi dalam ekosistem.", "Siswa dapat menganalisis pengaruh faktor lingkungan terhadap organisme.", "Siswa dapat menjelaskan interaksi dalam ekosistem, seperti rantai makanan, jaring-jaring makanan, dan simbiosis.", "Siswa dapat menganalisis dampak kegiatan manusia terhadap ekosistem dan merumuskan upaya pelestariannya.", "Siswa dapat merancang komposter sederhana untuk mengolah sampah organik di sekolah atau di rumah."], "kataKunci": ["ekosistem", "biotik", "abiotik", "rantai makanan", "jaring-jaring makanan", "simbiosis", "pencemaran", "kompos"], "petaKonsep": [{"poin": ["Komponen biotik dan abiotik", "Organisasi kehidupan"]}, {"poin": ["Rantai dan jaring makanan", "Piramida ekologi", "Simbiosis"]}, {"poin": ["Pencemaran lingkungan", "Upaya pelestarian"]}], "apersepsi": "Coba amati kebun atau taman di sekitar sekolah kalian. Di sana ada rumput, pohon, semut, kupu-kupu, cacing, dan burung. Ada juga tanah, air, udara, dan cahaya matahari. Semua komponen itu saling berhubungan. Burung memakan ulat, ulat memakan daun, dan cacing menggemburkan tanah tempat pohon tumbuh.\n\n[GAMBAR: Ekosistem Taman Sekolah | Ilustrasi Penulis (2026) | taman sekolah dengan pohon, rumput, kupu-kupu, burung, dan cacing di dalam tanah]\n\nJika salah satu komponen terganggu, komponen lain dapat ikut terpengaruh. Pada bab ini, kalian akan mempelajari hubungan antara makhluk hidup dan lingkungannya, pengaruh kegiatan manusia terhadap ekosistem, serta cara menjaga kelestariannya.", "subbab": [{"judul": "Ekosistem dan Pengaruh Lingkungan terhadap Organisme", "isi": "Ekologi adalah ilmu yang mempelajari hubungan timbal balik antara makhluk hidup dan lingkungannya. Kesatuan antara makhluk hidup dan lingkungannya yang saling berinteraksi disebut ekosistem.\n\n# Komponen Ekosistem\n## Komponen Biotik\nKomponen biotik adalah semua makhluk hidup dalam ekosistem. Berdasarkan perannya, komponen biotik dibedakan menjadi:\n- **produsen**, yaitu makhluk hidup yang dapat membuat makanan sendiri, misalnya tumbuhan hijau;\n- **konsumen**, yaitu makhluk hidup yang memperoleh makanan dari makhluk hidup lain, misalnya belalang, katak, dan ular;\n- **dekomposer** atau pengurai, yaitu makhluk hidup yang menguraikan sisa makhluk hidup yang telah mati, misalnya bakteri dan jamur.\n## Komponen Abiotik\nKomponen abiotik adalah komponen tak hidup, seperti cahaya matahari, air, udara, tanah, suhu, dan kelembapan.\n\n# Tingkatan Organisasi Kehidupan dalam Ekosistem\n- **Individu**: satu makhluk hidup, misalnya seekor ikan nila.\n- **Populasi**: sekelompok individu sejenis di tempat yang sama, misalnya semua ikan nila di sebuah kolam.\n- **Komunitas**: kumpulan berbagai populasi di suatu tempat, misalnya ikan nila, ikan mujair, ganggang, dan siput di kolam.\n- **Ekosistem**: komunitas beserta lingkungan abiotiknya.\n- **Biosfer**: seluruh ekosistem di bumi.\n\n# Pengaruh Faktor Lingkungan terhadap Organisme\nSetiap makhluk hidup memerlukan kondisi lingkungan tertentu. Tanaman padi tumbuh baik di tanah berair, sedangkan kaktus mampu hidup di tempat kering. Suhu, cahaya, air, dan keasaman tanah memengaruhi jenis makhluk hidup yang dapat bertahan di suatu tempat.\n\n[TABEL: Contoh Data Pengamatan Faktor Abiotik di Dua Lokasi Sekolah]\n| Faktor | Bawah Pohon Rindang | Lapangan Terbuka |\n| Suhu udara | 27 °C | 33 °C |\n| Kelembapan tanah | Lembap | Kering |\n| Jumlah jenis tumbuhan | 9 | 3 |\n| Jumlah cacing tanah per 1 m² | 12 | 1 |\n\n[STEM: Sensor Lingkungan Sederhana] Termometer digital dan aplikasi pengukur cahaya pada telepon genggam (teknologi) dapat digunakan untuk mengukur faktor abiotik di berbagai sudut sekolah. Data itu dapat dibandingkan dalam grafik (matematika) untuk menentukan lokasi terbaik bagi kebun sekolah (enjinering)."}, {"judul": "Interaksi dalam Ekosistem", "isi": "Makhluk hidup di dalam ekosistem saling berinteraksi, baik dengan sesama makhluk hidup maupun dengan lingkungannya. Interaksi ini menjaga keseimbangan ekosistem.\n\n# Rantai Makanan dan Jaring-Jaring Makanan\nRantai makanan adalah peristiwa makan dan dimakan yang berurutan dalam satu jalur. Contoh rantai makanan di sawah:\n\n**Padi → Tikus → Ular → Elang**\n\nPadi berperan sebagai produsen, tikus sebagai konsumen tingkat I, ular sebagai konsumen tingkat II, dan elang sebagai konsumen tingkat III. Ketika makhluk hidup itu mati, dekomposer akan menguraikannya.\n\nDi alam, satu jenis makhluk hidup dapat memakan atau dimakan oleh lebih dari satu jenis makhluk hidup lain. Kumpulan rantai makanan yang saling berhubungan disebut jaring-jaring makanan.\n\n[GAMBAR: Jaring-Jaring Makanan di Sawah | Ilustrasi Penulis (2026) | padi, belalang, tikus, katak, ular, burung, dan elang yang dihubungkan dengan anak panah]\n\n# Piramida Ekologi\nPiramida ekologi menggambarkan perbandingan jumlah individu, biomassa, atau energi pada setiap tingkat trofik. Pada umumnya, makin tinggi tingkat trofik, makin sedikit energi yang tersedia. Hanya sekitar 10% energi dari satu tingkat trofik yang berpindah ke tingkat berikutnya, sedangkan sisanya digunakan untuk aktivitas hidup dan hilang sebagai panas.\n\n# Simbiosis\nSimbiosis adalah hubungan erat antara dua jenis makhluk hidup yang berbeda.\n[TABEL: Jenis Simbiosis dan Contohnya]\n| Jenis Simbiosis | Sifat Hubungan | Contoh |\n| Mutualisme | Keduanya untung | Lebah dan bunga |\n| Komensalisme | Satu untung, yang lain tidak untung dan tidak rugi | Anggrek yang menempel pada pohon |\n| Parasitisme | Satu untung, yang lain rugi | Benalu pada pohon mangga |\n\n# Kompetisi dan Predasi\nSelain simbiosis, makhluk hidup juga dapat bersaing (kompetisi), misalnya padi dan gulma yang berebut unsur hara. Predasi adalah hubungan antara pemangsa dan mangsa, misalnya burung hantu yang memangsa tikus.\n\n[STEM: Burung Hantu Pengendali Hama] Di beberapa daerah, petani memasang rumah burung hantu *Tyto alba* di tepi sawah untuk mengendalikan tikus secara alami (sains). Rumah burung dirancang dengan ukuran dan ketinggian tertentu (enjinering), dipantau dengan kamera (teknologi), dan keberhasilannya diukur dari penurunan kerusakan tanaman (matematika)."}, {"judul": "Pengaruh Manusia terhadap Ekosistem dan Upaya Pelestarian", "isi": "Manusia memanfaatkan lingkungan untuk memenuhi kebutuhan hidupnya. Namun, kegiatan manusia yang tidak bijak dapat merusak keseimbangan ekosistem.\n\n# Kegiatan Manusia yang Merusak Ekosistem\n- **Penebangan hutan secara liar** menyebabkan banjir, tanah longsor, dan hilangnya habitat satwa.\n- **Pencemaran air** akibat limbah rumah tangga, industri, dan sampah plastik yang dibuang ke sungai.\n- **Pencemaran udara** akibat asap kendaraan, pembakaran sampah, dan kebakaran hutan.\n- **Pencemaran tanah** akibat sampah plastik dan penggunaan pestisida berlebihan.\n- **Perburuan liar** yang mengancam kelestarian satwa langka.\n\n# Masalah Sampah\nSampah dibedakan menjadi sampah organik, seperti sisa makanan dan daun, serta sampah anorganik, seperti plastik, kaca, dan logam. Sampah organik yang bercampur dengan sampah lain di tempat pembuangan akhir menghasilkan bau dan gas metana yang turut menyebabkan pemanasan global.\n\n[GAMBAR: Pemilahan Sampah di Sekolah | Ilustrasi Penulis (2026) | tiga tempat sampah berwarna berbeda untuk sampah organik, anorganik, dan berbahaya]\n\n# Upaya Pelestarian Lingkungan\n- Menerapkan prinsip **3R**: *reduce* (mengurangi), *reuse* (menggunakan kembali), dan *recycle* (mendaur ulang).\n- Memilah sampah dan mengolah sampah organik menjadi kompos.\n- Menanam pohon dan merawat ruang terbuka hijau.\n- Menghemat air dan listrik.\n- Melindungi satwa dan tumbuhan langka melalui cagar alam, suaka margasatwa,
