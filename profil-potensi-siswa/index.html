 const ms=[...m].sort((p,q)=>q.v-p.v), ss=[...s].sort((p,q)=>q.v-p.v), vs=[...v].sort((p,q)=>q.v-p.v);
 const kode=ms.slice(0,3).map(x=>x.k).join('');
 const top3=ss.slice(0,3).map(x=>x.k);
 const vTop=vs.filter(x=>x.v>=vs[0].v-10).map(x=>x.k);
 const datar=(ms[0].v-ms[5].v)<15;
 return {m,s,v,ms,ss,vs,kode,top3,vTop,multi:vTop.length>=3,datar};
}
const mInfo=k=>MINAT.find(x=>x.k===k), sInfo=k=>KEKUATAN.find(x=>x.k===k), vInfo=k=>BELAJAR.find(x=>x.k===k);
function encodeRec(r){return 'PPS1:'+b64e(JSON.stringify({n:r.nama,c:r.kelas,a:r.absen||'',t:r.t,j:r.j,f:r.mapel||[],g:r.cita||''}))}
function decodeRec(code){const o=JSON.parse(b64d(code.replace(/^PPS1:/,'')));if(!o||typeof o.j!=='string'||o.j.length!==NB.m+NB.s+NB.v||/[^1-4]/.test(o.j))throw new Error('kode rusak');return {id:'r'+o.t+'_'+Math.random().toString(36).slice(2,6),nama:String(o.n||'Tanpa nama').slice(0,60),kelas:String(o.c||'-').slice(0,20),absen:String(o.a||'').slice(0,4),t:o.t||Date.now(),j:o.j,mapel:(o.f||[]).slice(0,3),cita:String(o.g||'').slice(0,80)}}

function contoh(){
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const nama=['Alya Putri','Bima Saputra','Citra Lestari','Dimas Pratama','Eka Rahmawati','Fajar Nugroho','Gita Anggraini','Hafiz Ramadhan','Intan Permata','Joko Susilo','Kirana Ayu','Lukman Hakim'];
 const pola=[['A','visu','V'],['I','logi','R'],['S','inter','A'],['R','kine','K'],['E','inter','A'],['C','logi','R'],['A','musi','A'],['R','natu','K'],['S','ling','R'],['I','visu','V'],['E','ling','A'],['C','intra','R']];
 return nama.map((n,i)=>{const [mk,sk,vk]=pola[i];let j='';
  MINAT.forEach(x=>{for(let b=0;b<4;b++)j+=x.k===mk?(rnd()<.8?4:3):Math.min(4,Math.max(1,Math.round(1+rnd()*2.4)))});
  KEKUATAN.forEach(x=>{for(let b=0;b<3;b++)j+=x.k===sk?(rnd()<.75?4:3):Math.min(4,Math.max(1,Math.round(1.2+rnd()*2.2)))});
  BELAJAR.forEach(x=>{for(let b=0;b<3;b++)j+=x.k===vk?(rnd()<.7?4:3):Math.min(4,Math.max(1,Math.round(1.3+rnd()*2)))});
  return {id:'contoh'+i,nama:n,kelas:'8A (contoh)',absen:String(i+1),t:Date.UTC(2026,10,20,2,i),j,mapel:[MAPEL[i%12],MAPEL[(i+4)%12]],cita:['desainer','dokter','guru','montir','pengusaha','akuntan','musisi','petani hidroponik','penulis','arsitek','pembawa acara','pustakawan'][i],contoh:true}});
}

function viewPanduan(){
 return `<section class="card"><h2>Panduan singkat</h2><ol>
 <li><b>Siapkan siswa.</b> Jelaskan bahwa tidak ada jawaban benar atau salah, dan hasilnya untuk membantu guru dan orang tua mendampingi, bukan untuk menilai.</li>
 <li><b>Pengisian.</b> Siswa mengisi di HP sendiri lalu mengirim kode lewat WhatsApp, atau bergiliran di laptop guru dengan mode isi bergiliran.</li>
 <li><b>Rekap.</b> Wali kelas atau guru BK menempel kode di menu Rekap Guru, melihat sebaran kelas, menyusun kelompok beragam, dan mencetak profil.</li>
 <li><b>Pengamatan.</b> Guru atau orang tua dapat mengisi pengamatan singkat 8 area kekuatan. Hasilnya tampil sebagai garis pembanding pada grafik siswa.</li>
 <li><b>Tindak lanjut.</b> Bahas profil dalam layanan BK, pertemuan orang tua, dan perencanaan pembelajaran berdiferensiasi. Ulangi setiap semester karena minat remaja masih berkembang.</li></ol></section>
 <section class="card"><h2>Dasar dan batasan</h2>
 <p><b>Minat</b> disusun dengan kerangka enam tipe Holland (RIASEC: Realistis, Investigatif, Artistik, Sosial, Enterprising, Konvensional) yang banyak dipakai dalam bimbingan karier. Butir pernyataan ditulis khusus untuk aplikasi ini dan belum dinormakan, sehingga hasilnya bukan skor tes minat baku.</p>
 <p><b>Area kekuatan</b> memakai delapan area kecerdasan majemuk sebagai bahasa sederhana untuk mengenali bakat. Ini bukan tes kecerdasan.</p>
 <p><b>Cara belajar.</b> Siswa memang punya kesukaan cara belajar, dan ini termasuk hal yang digali dalam asesmen diagnostik non-kognitif. Namun penelitian tidak menemukan bukti bahwa mengajar hanya sesuai "gaya belajar" siswa membuat hasil belajar lebih baik. Karena itu aplikasi menyebutnya <i>cara belajar yang disukai</i> dan selalu menyarankan perpaduan beberapa cara.</p>
 <p class="small muted">Untuk keputusan penting seperti penjurusan atau layanan khusus, gunakan pemeriksaan oleh psikolog berizin.</p>
 <h3>Sumber</h3><ul class="small">
 <li><a href="https://pubmed.ncbi.nlm.nih.gov/26162104/" target="_blank" rel="noopener">Pashler dkk. (2008). Learning Styles: Concepts and Evidence. Psychological Science in the Public Interest.</a></li>
 <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6113575/" target="_blank" rel="noopener">Kajian tentang meshing hypothesis sebagai neuromitos dalam pendidikan (PMC)</a></li>
 <li><a href="https://ebsco.com/research-starters/economics/hollands-theory-career-choice" target="_blank" rel="noopener">Holland's Theory of Career Choice (EBSCO Research Starters)</a></li>
 <li><a href="https://tpcjournal.nbcc.org/the-u-s-workforce-from-1960-to-2010-a-riasec-view/" target="_blank" rel="noopener">McClain &amp; Reardon: tinjauan RIASEC dan dunia kerja (The Professional Counselor)</a></li>
 <li><a href="https://repository.upi.edu/131973/" target="_blank" rel="noopener">Analisis asesmen diagnostik non-kognitif di sekolah (Repository UPI, 2025)</a></li></ul></section>`;
}
function render(){
 const a=$('#app');
 a.innerHTML=S.view==='home'?viewHome():S.view==='angket'?viewAngket():S.view==='saya'?viewSaya():S.view==='guru'?viewGuru():viewPanduan();
 bind();
}

function readForm(){const g=id=>{const e=$('#'+id);return e?e.value.trim():''};S.form.nama=g('fNama');S.form.kelas=S.kiosk||g('fKelas');S.form.absen=g('fAbsen');S.form.cita=g('fCita')}
function pageComplete(){const miss=ORDER[S.page].filter(i=>!S.ans[i]);$$('.q').forEach(q=>q.classList.toggle('miss',miss.includes(+q.id.slice(1))));if(miss.length){$('#q'+miss[0]).scrollIntoView({behavior:'smooth',block:'center'});toast(`Masih ada ${miss.length} pernyataan yang belum dijawab.`);return false}return true}
function finishAngket(){
 const j=ITEMS.map((_,i)=>S.ans[i]).join('');
 const r={id:'r'+Date.now(),nama:S.form.nama||'Tanpa nama',kelas:S.form.kelas||'-',absen:S.form.absen,t:Date.now(),j,mapel:S.form.mapel.slice(0,3),cita:S.form.cita};
 if(S.kiosk){DB.rows.push(r);saveDB();S.ans={};S.page=0;S.started=false;S.form={nama:'',kelas:'',absen:'',mapel:[],cita:''};ORDER=mkOrder();
  $('#app').innerHTML=`<section class="card" style="text-align:center"><div class="big">✓</div><h2>Terima kasih, ${esc(r.nama)}!</h2><p class="muted">Jawabanmu sudah tersimpan untuk wali kelas/guru BK. Hasilmu akan dibahas bersama guru.</p><button class="btn" id="nextKiosk">Giliran siswa berikutnya</button></section>`;
  $('#nextKiosk').onclick=()=>render();return}
 const mine=LS.get('pps_mine',[]);mine.unshift(r);LS.set('pps_mine',mine.slice(0,10));
 S.ans={};S.page=0;S.started=false;ORDER=mkOrder();go('saya');
}
function groups(rows){
 const P=rows.map(r=>({r,p:score(r)})).sort((a,b)=>a.p.top3[0].localeCompare(b.p.top3[0])||a.p.kode.localeCompare(b.p.kode));
 const n=Math.max(1,Math.round(P.length/4));const G=Array.from({length:n},()=>[]);
 P.forEach((x,i)=>{const row=Math.floor(i/n);const idx=row%2===0?i%n:n-1-(i%n);G[idx].push(x)});
 return G;
}
function bind(){
 $$('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});
 $$('[data-mapel]').forEach(b=>b.onclick=()=>{readForm();const m=b.dataset.mapel,a=S.form.mapel;if(a.includes(m))a.splice(a.indexOf(m),1);else if(a.length<3)a.push(m);else toast('Maksimal 3 mata pelajaran.');render()});
 $$('.lk input').forEach(inp=>inp.onchange=()=>{S.ans[+inp.name.slice(1)]=+inp.value;inp.closest('.q').classList.remove('miss');const done=Object.keys(S.ans).length;const pr=$('.prog i');if(pr)pr.style.width=(done/ITEMS.length*100)+'%'});
 const fil=$('#fil');if(fil)fil.onchange=()=>{S.filter=fil.value;render()};
 $$('[data-lihat]').forEach(b=>b.onclick=()=>{const r=DB.rows.find(x=>x.id===b.dataset.lihat);$('#detail').innerHTML=`<section class="card">${profilHTML(r,{sapa:'siswa'})}<div class="row noprint" style="margin-top:12px"><button class="btn sm" id="cetak1">Cetak profil ini</button></div></section>`;$('#cetak1').onclick=()=>printRows([r]);$('#detail').scrollIntoView({behavior:'smooth'})});
 $$('[data-del]').forEach(b=>b.onclick=()=>{if(b.dataset.c){DB.rows=DB.rows.filter(x=>x.id!==b.dataset.del);delete DB.obs[b.dataset.del];saveDB();render();toast('Data siswa dihapus.')}else{b.dataset.c=1;b.textContent='Yakin?';setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent='✕'}},3000)}});
 $$('[data-obs]').forEach(b=>b.onclick=()=>{const r=DB.rows.find(x=>x.id===b.dataset.obs);const o=DB.obs[r.id]||{};
  $('#detail').innerHTML=`<section class="card"><h2>Pengamatan guru/orang tua: ${esc(r.nama)}</h2><p class="small muted">Nilai seberapa sering kekuatan ini terlihat dalam keseharian siswa.</p>${OBS.map(x=>`<div class="q"><p>${esc(x.teks)}</p><div class="lk">${['Jarang','Kadang','Sering','Sangat sering'].map((s,v)=>`<label><input type="radio" name="o_${x.k}" value="${v+1}" ${o[x.k]===v+1?'checked':''}>${s}</label>`).join('')}</div></div>`).join('')}<div class="row"><button class="btn" id="simpanObs">Simpan pengamatan</button>${DB.obs[r.id]?'<button class="btn ghost" id="hapusObs">Hapus pengamatan</button>':''}</div></section>`;
  $('#simpanObs').onclick=()=>{const v={};OBS.forEach(x=>{const c=$(`input[name="o_${x.k}"]:checked`);if(c)v[x.k]=+c.value});if(Object.keys(v).length<8){toast('Lengkapi kedelapan pengamatan.');return}DB.obs[r.id]=v;saveDB();toast('Pengamatan disimpan.');render()};
  const h=$('#hapusObs');if(h)h.onclick=()=>{delete DB.obs[r.id];saveDB();render()};
  $('#detail').scrollIntoView({behavior:'smooth'})});
 const imp=$('#imp');if(imp)imp.onchange=()=>{const f=imp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||!Array.isArray(d.rows))throw 0;const ids=new Set(DB.rows.map(r=>r.id));let n=0;d.rows.forEach(r=>{if(r&&r.id&&typeof r.j==='string'&&r.j.length===ITEMS.length&&!/[^1-4]/.test(r.j)&&!ids.has(r.id)){DB.rows.push(r);n++}});Object.assign(DB.obs,d.obs||{});saveDB();render();toast(`${n} data diimpor.`)}catch(e){toast('Berkas cadangan tidak dikenali.')}})};
 $$('[data-act]').forEach(b=>b.onclick=async()=>{
  const a=b.dataset.act;
  if(a==='mulai'){readForm();if(!S.form.nama){toast('Isi nama terlebih dahulu.');$('#fNama').focus();return}if(!S.form.kelas){toast('Isi kelas terlebih dahulu.');return}S.started=true;S.page=0;render();window.scrollTo(0,0)}
  else if(a==='lanjut'){if(!pageComplete())return;if(S.page<2){S.page++;render();window.scrollTo(0,0)}else finishAngket()}
  else if(a==='back'){if(S.page>0){S.page--;}else{S.started=false}render();window.scrollTo(0,0)}
  else if(a==='salin'){const c=$('#kode').textContent;try{await navigator.clipboard.writeText(c);toast('Kode disalin.')}catch(e){const r=document.createRange();r.selectNode($('#kode'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Tekan Ctrl+C untuk menyalin.')}}
  else if(a==='cetak')window.print();
  else if(a==='ulang'){S.started=false;go('angket')}
  else if(a==='hapusMine'){if(b.dataset.c){LS.set('pps_mine',[]);render()}else{b.dataset.c=1;b.textContent='Yakin? Klik lagi'}}
  else if(a==='buka'){const h=await hash($('#pin').value);if(h===DB.pinHash){S.guruOpen=true;render()}else toast('PIN salah.')}
  else if(a==='pinSet'){const v=$('#pinNew').value.trim();if(!/^\d{4,12}$/.test(v)){toast('PIN 4–12 angka.');return}DB.pinHash=await hash(v);saveDB();S.guruOpen=true;render();toast('PIN disimpan.')}
  else if(a==='pinOff'){DB.pinHash=null;saveDB();render();toast('PIN dihapus.')}
  else if(a==='kunci'){S.guruOpen=false;render()}
  else if(a==='hapusContoh'){DB.rows=DB.rows.filter(r=>!r.contoh);DB.contohDihapus=true;saveDB();S.filter='semua';render();toast('Data contoh dihapus.')}
  else if(a==='hapusSemua'){if(b.dataset.c){DB.rows=[];DB.obs={};saveDB();S.filter='semua';render();toast('Semua data rekap dihapus.')}else{b.dataset.c=1;b.textContent='Yakin? Klik lagi untuk menghapus semua'}}
  else if(a==='tempel'){const t=$('#paste').value;const codes=t.match(/PPS1:[A-Za-z0-9_-]+/g)||[];let ok=0,bad=0,dup=0;codes.forEach(c=>{try{const r=decodeRec(c);if(DB.rows.some(x=>x.j===r.j&&x.nama===r.nama&&x.t===r.t)){dup++;return}DB.rows.push(r);ok++}catch(e){bad++}});saveDB();render();toast(codes.length?`${ok} hasil masuk${dup?', '+dup+' sudah ada':''}${bad?', '+bad+' kode rusak':''}.`:'Tidak ditemukan kode PPS1.')}
  else if(a==='kiosk'){const k=$('#kk').value.trim();if(!k){toast('Isi nama kelas.');return}if(!DB.pinHash){toast('Buat PIN guru dulu (bagian Pengaturan) agar siswa tidak bisa membuka rekap.');return}S.kiosk=k;S.started=false;S.ans={};S.form={nama:'',kelas:k,absen:'',mapel:[],cita:''};S.guruOpen=false;go('angket')}
  else if(a==='kioskExit'){S.kiosk=null;go('guru')}
  else if(a==='kelompok'){const rows=DB.rows.filter(r=>S.filter==='semua'||r.kelas===S.filter);if(rows.length<4){toast('Butuh minimal 4 siswa.');return}const G=groups(rows);$('#kelompok').innerHTML=`<h3 style="margin-top:14px">Usulan kelompok beragam (${G.length} kelompok)</h3><p class="small muted">Setiap kelompok dicampur dari kekuatan yang berbeda agar saling melengkapi. Sesuaikan dengan pertimbangan guru.</p><div class="g3">${G.map((g,i)=>`<div class="tile"><b>Kelompok ${i+1}</b>${g.map(x=>`<p>${esc(x.r.nama)} · <span class="pill">${esc(sInfo(x.p.top3[0]).nama.split(' (')[0])}</span></p>`).join('')}</div>`).join('')}</div>`}
  else if(a==='cetakSemua'){const rows=DB.rows.filter(r=>S.filter==='semua'||r.kelas===S.filter);printRows(rows)}
  else if(a==='csv'){const head=['nama','kelas','absen','tanggal','kode_minat',...MINAT.map(x=>'minat_'+x.k),...KEKUATAN.map(x=>'kekuatan_'+x.k),...BELAJAR.map(x=>'belajar_'+x.k),'kekuatan_teratas','cara_belajar','mapel_favorit','cita_cita'];
   const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
   dl('rekap-profil-potensi.csv','﻿'+[head.join(','),...DB.rows.map(r=>{const p=score(r);return [q(r.nama),q(r.kelas),q(r.absen),new Date(r.t).toISOString().slice(0,10),p.kode,...p.m.map(x=>x.v),...p.s.map(x=>x.v),...p.v.map(x=>x.v),q(p.top3.map(k=>sInfo(k).nama).join('; ')),q(p.vTop.map(k=>vInfo(k).nama).join('; ')),q((r.mapel||[]).join('; ')),q(r.cita)].join(',')})].join('\n'),'text/csv')}
  else if(a==='json')dl('cadangan-profil-potensi.json',JSON.stringify({app:'profil-potensi-siswa',versi:1,rows:DB.rows,obs:DB.obs},null,1),'application/json');
 });
}
function printRows(rows){
 const w=window.open('','_blank');if(!w){toast('Izinkan jendela baru untuk mencetak.');return}
 const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 w.document.write(`<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Profil Potensi Siswa</title><style>${css} body{background:#fff;padding:20px}.rep{margin-bottom:30px}</style></head><body>${rows.map(r=>`<div class="card">${profilHTML(r)}</div>`).join('')}<p class="small" style="color:#555">Dikembangkan oleh Edy Thomas · Profil Potensi Siswa</p><script>setTimeout(()=>print(),400)<\/script></body></html>`);
 w.document.close();
}
