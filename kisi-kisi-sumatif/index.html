<style>
:root{
  --bg:#f6f3ea; --bg2:#ece6d6; --card:#fffdf8; --ink:#16233b; --ink2:#4b5870; --line:#d9d0bb; --grid:rgba(22,35,59,.045);
  --biru:#1f4e8c; --biru-soft:#dde7f5; --merah:#c0392b; --merah-soft:#fbe3df;
  --ok:#2b7a3d; --ok-soft:#dcf1e1; --warn:#9a5b00; --warn-soft:#fff0c7;
  --L1:#2f74c0; --L2:#d07a12; --L3:#9b3cb5;
  --shadow:0 1px 0 rgba(22,35,59,.06), 0 10px 26px -16px rgba(22,35,59,.35);
  --r:14px; --focus:#1f4e8c; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161f; --bg2:#19202c; --card:#1c2431; --ink:#edf0f5; --ink2:#aeb8c9; --line:#33405a; --grid:rgba(255,255,255,.035);
    --biru:#7fb0ef; --biru-soft:#1b2b44; --merah:#ff8b7d; --merah-soft:#3d1f1b;
    --ok:#74d48a; --ok-soft:#163521; --warn:#ffcf5c; --warn-soft:#3a3016;
    --L1:#74b0f0; --L2:#f2a94a; --L3:#d18bea;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.8); --focus:#7fb0ef; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161f; --bg2:#19202c; --card:#1c2431; --ink:#edf0f5; --ink2:#aeb8c9; --line:#33405a; --grid:rgba(255,255,255,.035);
  --biru:#7fb0ef; --biru-soft:#1b2b44; --merah:#ff8b7d; --merah-soft:#3d1f1b;
  --ok:#74d48a; --ok-soft:#163521; --warn:#ffcf5c; --warn-soft:#3a3016;
  --L1:#74b0f0; --L2:#f2a94a; --L3:#d18bea;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 28px -16px rgba(0,0,0,.8); --focus:#7fb0ef; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .4em}
h2{font-size:1.45rem} h3{font-size:1.1rem}
a{color:var(--biru)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
:root[data-theme="dark"] header.top{background:#0a0e15;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0a0e15;color:var(--ink)}}
header.top .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:10px;background:var(--merah);display:grid;place-items:center;color:#fff;flex:none;transform:rotate(-4deg)}
.brand h1{font-size:1.35rem;margin:0}
.brand small{display:block;opacity:.75;font-size:.82rem}
.aktif-sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.aktif-sel label{font-size:.8rem;opacity:.8}
.aktif-sel select{max-width:min(78vw,340px)}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;font:600 .92rem "IBM Plex Sans",sans-serif;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--merah)}
nav.tabs button:hover{color:var(--ink)}
main{padding:20px 0 60px}
section.tab{display:none} section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:800 1.7rem Fraunces,serif}
.stat span{font-size:.85rem;color:var(--ink2)}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--ink2);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{margin-top:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--biru)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:9px;font:600 .9rem "IBM Plex Sans",sans-serif;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink2)}
.btn.utama{background:var(--biru);border-color:var(--biru);color:#fff}
:root[data-theme="dark"] .btn.utama{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.utama{color:#0b1220}}
.btn.bahaya{color:var(--merah);border-color:var(--merah)}
.btn.kecil{padding:5px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.baris{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)} .kecil{font-size:.85rem}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.L1{background:color-mix(in srgb,var(--L1) 18%,transparent);color:var(--L1)}
.pill.L2{background:color-mix(in srgb,var(--L2) 18%,transparent);color:var(--L2)}
.pill.L3{background:color-mix(in srgb,var(--L3) 18%,transparent);color:var(--L3)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--merah-soft);color:var(--merah)}
.pill.contoh{background:var(--warn-soft);color:var(--warn)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.contoh{background:var(--warn-soft);color:var(--ink);border:1px dashed var(--warn)}
.peringatan{list-style:none;padding:0;margin:0}
.peringatan li{padding:7px 10px;border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:6px;margin-bottom:6px;font-size:.9rem}
.peringatan li.ok{border-color:var(--ok);background:var(--ok-soft)}
.peringatan li.bad{border-color:var(--merah);background:var(--merah-soft)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--bg2);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);position:sticky;top:0}
td input,td select,td textarea{padding:5px 7px;font-size:.88rem}
td textarea{min-height:52px}
.kisi td:nth-child(4){min-width:240px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.alur{counter-reset:l;list-style:none;padding:0;margin:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.alur li{counter-increment:l;padding:10px 12px 10px 46px;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.alur li::before{content:counter(l);position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 .85rem Fraunces,serif;background:var(--bg2);color:var(--ink2)}
.alur li.sudah::before{content:"✓";background:var(--ok);color:#fff}
.alur li b{display:block}
.soal-k{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.soal-k .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.soal-k .isi{font-size:.95rem}
.soal-k ol{margin:.3em 0 .3em 1.2em;padding:0}
.soal-k ol li.kunci{font-weight:700;color:var(--ok)}
.stimulus{background:var(--bg);border-left:3px solid var(--biru);padding:6px 10px;border-radius:6px;margin:4px 0 8px;font-size:.92rem;white-space:normal}
.stimulus img,.isi img{max-width:100%;height:auto;border-radius:6px}
.matriks td,.matriks th{text-align:center}
.matriks td:first-child,.matriks th:first-child{text-align:left}
.bar{height:10px;border-radius:5px;background:var(--bg2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(860px,96vw);max-height:92vh;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,14,22,.55)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
dialog .db{padding:16px 18px;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card)}
.opsi-ed{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.cek-list{list-style:none;padding:0;margin:0;columns:2 260px}
.cek-list li{break-inside:avoid;margin-bottom:4px;font-size:.88rem}
#toast{opacity:0;visibility:hidden;position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;transition:transform .25s;z-index:99;max-width:92vw}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
#kunciLayar{display:none}
.rahasia{font-size:.85rem}
details.panel{border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;background:var(--bg)}
details.panel summary{cursor:pointer;font-weight:700}
.pratinjau-wrap{background:var(--bg2);padding:16px;border-radius:12px;overflow-x:auto}
/* Lembar cetak */
.lembar{background:#fff;color:#111;max-width:820px;margin:0 auto;padding:28px 34px;font:14px/1.5 "IBM Plex Sans",Arial,sans-serif;box-shadow:var(--shadow)}
.lembar.lanskap{max-width:1100px}
.lembar h2,.lembar h3{font-family:"IBM Plex Sans",Arial,sans-serif;color:#111}
.lembar table{font-size:12.5px} .lembar th{background:#eee;color:#111;position:static;text-transform:none;letter-spacing:0;font-size:12px}
.lembar th,.lembar td{border:1px solid #444}
.lembar .kop{text-align:center;border-bottom:3px double #111;padding-bottom:8px;margin-bottom:12px}
.lembar .kop h2{margin:0;font-size:17px;text-transform:uppercase}
.lembar .ident td{border:0;padding:2px 6px}
.lembar .butir{break-inside:avoid;margin:0 0 12px;display:grid;grid-template-columns:28px 1fr;gap:4px}
.lembar .butir ol{margin:4px 0 0;padding-left:0;list-style:none}
.lembar .butir ol li{display:grid;grid-template-columns:24px 1fr}
.lembar .stimulus{background:#f4f4f4;border-left:3px solid #555;color:#111}
.lembar .kartu{border:1.5px solid #222;margin-bottom:16px;break-inside:avoid}
.lembar .kartu table td,.lembar .kartu table th{border:1px solid #444}
.lembar .ttd{display:flex;justify-content:space-between;margin-top:28px;gap:20px}
.lembar .ttd div{width:45%}
.lembar .garis{border-bottom:1px dotted #777;height:24px}
.lembar .bagian{font-weight:700;margin:14px 0 6px;border-bottom:1px solid #999}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  body>*:not(#areaCetak){display:none!important}
  #areaCetak{display:block!important}
  #areaCetak .lembar{box-shadow:none;max-width:none;padding:0}
  .putus{break-after:page}
}
#areaCetak{display:none}
@media (max-width:640px){
  .card{padding:14px}
  h2{font-size:1.25rem}
  .brand h1{font-size:1.15rem}
  .lembar{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
"use strict";
/* ============ Kisi-kisi & Bank Soal Sumatif ============
   Semua data tersimpan hanya di perangkat (localStorage).
   Fitur AI (Gemini) opsional memakai kunci API milik pengguna sendiri. */
var KUNCI_SIMPAN = "kisiSumatif.v1";
var LEVEL = {
  L1: { nama: "Pengetahuan & Pemahaman", kko: ["menyebutkan", "mengidentifikasi", "menentukan", "menunjukkan", "menjelaskan", "membedakan"] },
  L2: { nama: "Aplikasi", kko: ["menghitung", "menerapkan", "menggunakan", "menyelesaikan", "menyajikan", "mendemonstrasikan"] },
  L3: { nama: "Penalaran", kko: ["menganalisis", "menyimpulkan", "membandingkan", "mengevaluasi", "memecahkan masalah", "merancang", "memprediksi"] }
};
var BENTUK = {
  PG: { nama: "Pilihan ganda", pendek: "PG", skor: 1 },
  PGK: { nama: "PG kompleks (lebih dari satu jawaban)", pendek: "PG kompleks", skor: 2 },
  BS: { nama: "PG kompleks kategori (Benar–Salah)", pendek: "Benar–Salah", skor: 2 },
  JD: { nama: "Menjodohkan", pendek: "Menjodohkan", skor: 2 },
  IS: { nama: "Isian singkat", pendek: "Isian", skor: 1 },
  UR: { nama: "Uraian", pendek: "Uraian", skor: 4 }
};
var URUT_BENTUK = ["PG", "PGK", "BS", "JD", "IS", "UR"];
var HURUF = "ABCDEFGH";
var JENIS_AS = ["Sumatif lingkup materi", "Sumatif akhir semester", "Sumatif akhir tahun", "Sumatif akhir jenjang (latihan)"];

function $(s, el) { return (el || document).querySelector(s); }
function $$(s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fmt(s) { // teks sederhana: **tebal**, _miring_, baris baru
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\s)_(.+?)_(?=\s|$|[.,;:])/g, "$1<i>$2</i>").replace(/\n/g, "<br>");
}
function uid(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function salin(o) { return JSON.parse(JSON.stringify(o)); }
function hariIni() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function tglIndo(s) {
  if (!s) return "";
  var b = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  var p = s.split("-"); return +p[2] + " " + b[+p[1] - 1] + " " + p[0];
}
function persen(x) { return isFinite(x) ? Math.round(x * 100) + "%" : "–"; }
function angka(x, d) { return isFinite(x) ? x.toFixed(d == null ? 2 : d).replace(".", ",") : "–"; }
function toast(t) { var el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove("on"); }, 2600); }
function rng(seed) { var a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function acak(arr, r) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function unduh(nama, isi, tipe) {
  var blob = new Blob([isi], { type: tipe || "text/plain;charset=utf-8" });
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv(rows) { return "﻿" + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? "" : c); return /[";\n,]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(";"); }).join("\r\n"); }

/* ============ Data ============ */
var S = null;
function kosong() {
  return { versi: 1, aktif: null, asesmen: [], soal: [], paket: [], hasil: [],
    setelan: { tema: "auto", sekolah: "", kota: "", kepsek: "", penyusun: "", apiKey: "", model: "gemini-2.5-flash", kktp: 70 } };
}
function muat() {
  try { var s = localStorage.getItem(KUNCI_SIMPAN); if (s) { var o = JSON.parse(s); if (o && o.asesmen) return o; } } catch (e) { }
  return null;
}
function simpan() {
  try { localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(S)); }
  catch (e) { toast("Penyimpanan perangkat penuh atau diblokir. Ekspor cadangan JSON sekarang."); }
}
function AS() { return S.asesmen.find(function (a) { return a.id === S.aktif; }) || S.asesmen[0] || null; }
function soalById(id) { return S.soal.find(function (s) { return s.id === id; }); }
function tpById(a, id) { return a ? a.tp.find(function (t) { return t.id === id; }) : null; }

/* ============ Peristiwa ============ */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]"); if (t && !t.disabled) { if (t.tagName === "A") e.preventDefault(); aksi(t.dataset.act, t); return; }
  var g = e.target.closest("[data-tab-go]"); if (g) { bukaTab(g.dataset.tabGo); return; }
  var tb = e.target.closest("#tabbar button"); if (tb) bukaTab(tb.dataset.tab);
});
$("#tabbar").addEventListener("keydown", function (e) {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  var i = TABS.findIndex(function (x) { return x[0] === TAB; }); i = (i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length;
  bukaTab(TABS[i][0]); $('#tabbar button[data-tab="' + TABS[i][0] + '"]').focus(); e.preventDefault();
});
function nilai(el) { return el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? "" : +el.value) : el.value; }
function ubah(e) {
  var el = e.target; var a = AS(); var d = el.dataset; var akhir = e.type === "change";
  if (el.id === "pilihAsesmen") { S.aktif = el.value; F.tp = ""; PRATINJAU = ""; simpan(); render(); return; }
  if (d.af) { a[d.af] = nilai(el); simpan(); if (akhir && d.af === "nama") render(); return; }
  if (d.target) { a.target[d.target] = +el.value || 0; simpan(); return; }
  if (d.tp) { var t = tpById(a, d.tp); t[d.k] = nilai(el); simpan(); return; }
  if (d.kisi) {
    var k = a.kisi.find(function (x) { return x.id === d.kisi; }); k[d.k] = nilai(el);
    if (["tpId", "level", "bentuk"].indexOf(d.k) > -1) { if (d.k === "bentuk" && !k.soalId) k.skor = BENTUK[k.bentuk].skor; if (d.k === "tpId") { var tt = tpById(a, k.tpId); if (tt && !k.materi) k.materi = tt.materi; } var sb = soalBaris(k); if (sb && (sb.level !== k.level || sb.bentuk !== k.bentuk || sb.tpId !== k.tpId)) { k.soalId = ""; toast("Tautan soal dilepas karena TP/level/bentuk berubah."); } simpan(); rKisiBody(a, !!S.setelan.apiKey); rKisiRingkas(a); var f = $('[data-kisi="' + d.kisi + '"][data-k="' + d.k + '"]'); if (f) f.focus(); }
    else { simpan(); if (akhir) rKisiRingkas(a); }
    return;
  }
  if (["fq", "fas", "ftp", "flv", "fbt", "fst"].indexOf(el.id) > -1) { F[el.id.slice(1)] = el.value; rBankList(a); return; }
  if (D && d.e) {
    var lama = D.bentuk; D[d.e] = d.e === "skor" ? (+el.value || 0) : el.value;
    if (d.e === "bentuk") { if (D.skor === BENTUK[lama].skor) D.skor = BENTUK[D.bentuk].skor; var sk = $('[data-e="skor"]'); if (sk) sk.value = D.skor; if (D.bentuk === "PG") { var f1 = D.opsi.findIndex(function (o) { return o.k; }); D.opsi.forEach(function (o, n) { o.k = n === (f1 < 0 ? 0 : f1); }); } rEdBentuk(); }
    rEdCek(); return;
  }
  if (D && d.arr) {
    var arr = D[d.arr], n = +d.i;
    if (d.arr === "pengecoh") arr[n] = el.value;
    else if (d.arr === "opsi" && d.k === "k") { if (D.bentuk === "PG") arr.forEach(function (o, m) { o.k = m === n; }); else arr[n].k = el.checked; }
    else if (d.arr === "pernyataan" && d.k === "b") arr[n].b = el.value === "1";
    else arr[n][d.k] = el.value;
    rEdCek(); return;
  }
  if (D && d.ceklis) { D.ceklis[d.ceklis] = el.checked; return; }
  if (d.set) { S.setelan[d.set] = el.value; simpan(); if (d.set === "tema") terapkanTema(); if (d.set === "apiKey" && akhir) toast(el.value ? "Kunci API disimpan di perangkat ini." : "Kunci API dihapus."); return; }
  if (el.id === "an-paket") { PK_ANALISIS = el.value; return; }
  if (el.id === "an-hasil") { H_AKTIF = el.value; rAnIsi(); return; }
  if (el.id === "an-kktp") { S.setelan.kktp = +el.value || 70; simpan(); return; }

        if (o.setelan) ["sekolah", "kota", "kepsek", "penyusun"].forEach(function (key) { if (o.setelan[key] && !S.setelan[key]) S.setelan[key] = o.setelan[key]; });

      } catch (err) { toast("Berkas bukan cadangan aplikasi ini."); }
    };

  }
}
