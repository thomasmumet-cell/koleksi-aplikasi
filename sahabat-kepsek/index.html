<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahabat Kepsek – Asisten Kepala Sekolah SMP/MTs</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5FA;--panel:#fff;--ink:#14183A;--muted:#566080;--line:#CBD0E3;--indigo:#1B2559;--saffron:#F5B301;--me:#1B2559;--meink:#fff;--bot:#fff;
--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Public Sans",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1230;--panel:#161B45;--ink:#EEF0FA;--muted:#A5ABCB;--line:#2A3166;--me:#F5B301;--meink:#14183A;--bot:#161B45}}
:root[data-theme="dark"]{--bg:#0E1230;--panel:#161B45;--ink:#EEF0FA;--muted:#A5ABCB;--line:#2A3166;--me:#F5B301;--meink:#14183A;--bot:#161B45}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
header{padding:1rem 1.1rem .8rem;border-bottom:2px solid var(--ink)}
h1{font:800 1.6rem/1.1 var(--display);margin:0;letter-spacing:-.01em}
header p{margin:.25rem 0 0;color:var(--muted);font-size:.95rem}
#log{flex:1;overflow-y:auto;padding:1rem 1.1rem}
.hint{color:var(--muted);margin:0 0 .7rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
.chip{font:500 .92rem var(--body);background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.5rem .95rem;cursor:pointer}
.chip:hover{background:var(--saffron);border-color:var(--saffron);color:#14183A}
.msg{max-width:92%;margin:0 0 .9rem;padding:.7rem .95rem;border-radius:18px;overflow-wrap:anywhere}
.msg.me{margin-left:auto;background:var(--me);color:var(--meink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.bot{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg p{margin:0 0 .6rem}.msg p:last-child{margin:0}
.msg ul,.msg ol{margin:.2rem 0 .6rem;padding-left:1.3rem}
.tools{margin-top:.6rem;display:flex;gap:.5rem}
.tools button{font:500 .85rem var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:.25rem .65rem;cursor:pointer}
.tools button:hover{color:var(--ink);border-color:var(--ink)}
.note{color:var(--muted);font-size:.9rem}
form{display:flex;gap:.6rem;padding:.8rem 1.1rem 0;border-top:1px solid var(--line);background:var(--bg)}
textarea{flex:1;resize:none;font:400 1rem/1.4 var(--body);color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:.65rem .85rem;max-height:9rem}
.send{font:700 1rem var(--body);background:var(--saffron);color:#14183A;border:2px solid var(--saffron);border-radius:14px;padding:0 1.2rem;cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.foot{padding:.5rem 1.1rem .8rem;color:var(--muted);font-size:.82rem;background:var(--bg)}
@media(prefers-reduced-motion:no-preference){.dots{animation:k 1.2s infinite}}
@keyframes k{50%{opacity:.35}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sahabat Kepsek</h1>
    <p>Asisten tanya jawab untuk kepala sekolah SMP/MTs: regulasi, BOS/BOSP, dokumen sekolah, dan surat dinas.</p>
  </header>
  <div id="log" aria-live="polite">
    <p class="hint">Pilih topik atau tulis pertanyaan Anda sendiri.</p>
    <div class="chips" id="chips"></div>
  </div>
  <form id="f">
    <textarea id="q" rows="1" placeholder="Tulis pertanyaan, mis. cara menyusun RKAS" aria-label="Pertanyaan Anda"></textarea>
    <button class="send" id="go" type="submit">Kirim</button>
  </form>
  <div class="foot">Jawaban dibuat AI dan bisa keliru. Cocokkan dengan peraturan dan juknis resmi terbaru sebelum dipakai.</div>
</div>
<script>
(function(){
var SYS="Kamu adalah Sahabat Kepsek, asisten untuk kepala sekolah SMP/MTs negeri dan swasta di Kota Yogyakarta, Indonesia. Jawab dalam bahasa Indonesia yang jelas, ringkas, dan praktis. Bidangmu: regulasi pendidikan, juknis BOS/BOSP dan pengelolaan dana sekolah, penyusunan dokumen sekolah (visi misi, RKS, RKT, RKAS, program supervisi, laporan), serta draf surat dinas dan template surat. Aturan: (1) jangan mengarang nomor, pasal, atau tahun peraturan; jika tidak yakin, katakan terus terang dan arahkan ke sumber resmi (Kementerian, Dinas Pendidikan, juknis terbaru). (2) Peraturan sering berubah, jadi ingatkan untuk memeriksa versi terbaru pada hal yang menyangkut angka, batas, atau larangan. (3) Untuk surat, buat draf lengkap dengan placeholder dalam kurung siku seperti [nama sekolah], [nomor surat], [tanggal]. (4) Untuk dokumen, beri kerangka langkah demi langkah yang bisa langsung dikerjakan. (5) Jangan memberi nasihat hukum final; sarankan konsultasi ke pengawas atau dinas untuk kasus sensitif. Jangan memakai tabel.";
var TOPICS=[["Aturan penggunaan dana BOS/BOSP","Jelaskan prinsip umum penggunaan dana BOS/BOSP di SMP, hal yang boleh dan tidak boleh dibiayai, dan apa yang harus saya periksa di juknis terbaru."],
["Menyusun RKAS","Berikan langkah menyusun RKAS di SMP, dari analisis kebutuhan sampai pengesahan."],
["Draf surat undangan rapat","Buatkan draf surat undangan rapat dinas dari kepala sekolah kepada guru dan tenaga kependidikan, lengkap dengan placeholder."],
["Program supervisi akademik","Buatkan kerangka program supervisi akademik semester ganjil untuk kepala sekolah SMP, termasuk jadwal, instrumen, dan tindak lanjut."],
["Laporan kegiatan sekolah","Berikan struktur laporan kegiatan sekolah yang rapi untuk dikirim ke dinas pendidikan."],
["Pengelolaan sekolah inklusif","Apa saja yang perlu disiapkan kepala sekolah SMP untuk menyelenggarakan pendidikan inklusif bagi siswa berkebutuhan khusus?"]];
var log=document.getElementById("log"),chips=document.getElementById("chips"),f=document.getElementById("f"),q=document.getElementById("q"),go=document.getElementById("go");
var hist=[],busy=false,sample=null,ctl=null;
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function fmt(t){var out=[],list=null,para=[];
 function endp(){if(para.length){out.push("<p>"+para.join("<br>")+"</p>");para=[]}}
 function endl(){if(list){out.push("</"+list+">");list=null}}
 t.split("\n").forEach(function(l){var m;
  if(m=l.match(/^\s*[-*]\s+(.*)/)){endp();if(list!=="ul"){endl();out.push("<ul>");list="ul"}out.push("<li>"+inl(m[1])+"</li>")}
  else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){endp();if(list!=="ol"){endl();out.push("<ol>");list="ol"}out.push("<li>"+inl(m[1])+"</li>")}
  else if(!l.trim()){endp();endl()}
  else{endl();para.push(inl(l.replace(/^#+\s*/,"")))}});
 endp();endl();return out.join("")}
function add(cls,html){var d=document.createElement("div");d.className="msg "+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
TOPICS.forEach(function(t){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=t[0];b.onclick=function(){ask(t[1])};chips.appendChild(b)});
function addTools(el,text){var w=document.createElement("div");w.className="tools";
 var c=document.createElement("button");c.type="button";c.textContent="Salin jawaban";
 c.onclick=function(){try{navigator.clipboard.writeText(text).then(function(){c.textContent="Tersalin"},function(){c.textContent="Gagal menyalin"})}catch(e){c.textContent="Gagal menyalin"}};
 w.appendChild(c);el.appendChild(w)}
async function ask(text){
 text=(text||"").trim();if(!text||busy)return;
 if(!sample){try{sample=await claude.use("sample")}catch(e){sample=null}}
 if(!sample){add("bot","<p class='note'>Fitur tanya jawab belum aktif di tampilan ini. Buka halaman ini langsung di claude.ai dan beri izin saat diminta.</p>");return}
 busy=true;go.disabled=true;q.value="";q.style.height="";
 chips.style.display="none";
 add("me",esc(text));hist.push({role:"user",content:text});
 var el=add("bot","<p class='note dots'>Sedang menyusun jawaban…</p>");
 var msgs=hist.slice(-8).map(function(m){return{role:m.role,content:m.content}});
 if(msgs[0].role!=="user")msgs.shift();
 msgs[0]={role:"user",content:SYS+"\n\n---\n"+msgs[0].content};
 ctl=new AbortController();
 try{
  var r=await sample(msgs,{cache:false,signal:ctl.signal,onText:function(o){if(o.text){el.innerHTML=fmt(o.text);log.scrollTop=log.scrollHeight}}});
  el.innerHTML=fmt(r.text);hist.push({role:"assistant",content:r.text});addTools(el,r.text);
 }catch(e){
  hist.pop();
  var m=e&&e.code==="rate_limited"?"Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.":e&&e.code==="not_granted"?"Izin belum diberikan. Muat ulang halaman, lalu setujui izin saat diminta.":"Jawaban gagal dibuat. Periksa koneksi Anda, lalu kirim ulang pertanyaan.";
  el.innerHTML="<p class='note'>"+m+"</p>";
 }
 busy=false;go.disabled=false;q.focus();
}
f.addEventListener("submit",function(e){e.preventDefault();ask(q.value)});
q.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(q.value)}});
q.addEventListener("input",function(){q.style.height="auto";q.style.height=Math.min(q.scrollHeight,144)+"px"});
})();
</script>
</body>
</html>
