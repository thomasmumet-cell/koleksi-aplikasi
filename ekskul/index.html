<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>Pengelola Ekstrakurikuler</title>
<meta name="description" content="Kelola ekstrakurikuler SMP: data ekskul, pembina, anggota, jadwal, presensi latihan, prestasi, nilai dan deskripsi rapor, serta rekap per ekskul. Data hanya tersimpan di perangkat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e6;--panel:#fffdf8;--panel2:#f9f5ea;--ink:#1d2722;--muted:#56625b;--line:#e2d9c4;
  --brand:#1d5c4a;--brand2:#2a7a62;--brand-ink:#ffffff;--accent:#c97a12;--accent-soft:#fbeacd;
  --ok:#2b7a3d;--ok-soft:#e1f2e4;--warn:#9a4a07;--warn-soft:#fdebd6;--bad:#b42318;--bad-soft:#fde4e1;
  --chip:#e9f0eb;--shadow:0 1px 2px rgba(30,40,30,.06),0 6px 18px rgba(30,40,30,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111713;--panel:#18201b;--panel2:#1d2620;--ink:#e7ede9;--muted:#a1aea6;--line:#2c3832;
    --brand:#6cc9a5;--brand2:#8fd8bb;--brand-ink:#0c1a14;--accent:#f0b65a;--accent-soft:#3a2c14;
    --ok:#7fd396;--ok-soft:#1b3323;--warn:#f3b46e;--warn-soft:#3b2814;--bad:#ff9a8f;--bad-soft:#3d1c19;
    --chip:#22302a;--shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#111713;--panel:#18201b;--panel2:#1d2620;--ink:#e7ede9;--muted:#a1aea6;--line:#2c3832;
  --brand:#6cc9a5;--brand2:#8fd8bb;--brand-ink:#0c1a14;--accent:#f0b65a;--accent-soft:#3a2c14;
  --ok:#7fd396;--ok-soft:#1b3323;--warn:#f3b46e;--warn-soft:#3b2814;--bad:#ff9a8f;--bad-soft:#3d1c19;
  --chip:#22302a;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;line-height:1.2;margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:var(--brand-ink);position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:260px;height:260px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:16px;padding-bottom:14px;position:relative;z-index:1}
.emblem{width:46px;height:46px;flex:none;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#241500}
.top h1{font-size:clamp(20px,3.2vw,28px);font-weight:800;letter-spacing:-.01em}
.top .sub{opacity:.85;font-size:13px}
.top .tools{margin-left:auto;display:flex;gap:8px}
.iconbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:10px;padding:8px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.24)}
nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 9px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
main{padding:20px 0 60px}
.secret{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.secret b{color:var(--warn)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:24px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:720px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:800;color:var(--brand);line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#231400}
.btn.dang{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:100%;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.contoh{background:var(--accent-soft);color:var(--warn);text-transform:lowercase}
.tag.wajib{background:var(--brand);color:var(--brand-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--panel2);position:sticky;top:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.ekcard{border-top:5px solid var(--c,var(--brand));display:flex;flex-direction:column;gap:8px}
.ekcard h3{font-size:19px}
.ekcard .meta{font-size:13px;color:var(--muted)}
.ekcard .acts{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 52px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:14px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;background:var(--c,var(--brand2));border-radius:6px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:flex;height:14px;border-radius:6px;overflow:hidden;background:var(--chip)}
.stack span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;cursor:pointer;font-weight:700;font-size:13px;min-width:34px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="H"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="I"]{background:#3b6fb6;color:#fff}
.seg button[aria-pressed="true"][data-v="S"]{background:#7a5bb0;color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--bad);color:#fff}
.week{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px}
.day h3{font-size:15px;margin-bottom:8px}
.slot{border-left:4px solid var(--c);background:var(--panel2);border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:13px}
.slot b{display:block;font-size:14px}
.alert{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:8px;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--panel);color:var(--ink);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,15,.45)}
dialog .dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
dialog .dh h2{font-size:19px}
dialog .db{padding:16px;display:flex;flex-direction:column;gap:12px}
dialog .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}
.memlist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.memlist label{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.memlist label:last-child{border-bottom:0}
.memlist select{width:auto;padding:3px 6px;margin-left:auto;font-size:13px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
.src li{margin-bottom:10px}
.kbd{font-family:ui-monospace,monospace;font-size:12px;background:var(--chip);padding:1px 5px;border-radius:5px}
.pred-SB{color:var(--ok);font-weight:700}.pred-B{color:var(--brand);font-weight:700}.pred-C{color:var(--warn);font-weight:700}.pred-K{color:var(--bad);font-weight:700}
td textarea{min-height:92px;font-size:13px}
td select{width:auto;padding:5px 6px}
#printArea{display:none}
@media (max-width:640px){
  .top .tools .lbl{display:none}
  .bar{grid-template-columns:96px 1fr 44px}
  .head h2{font-size:21px}
  .tbl{font-size:13px}
}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  header.top,nav.tabs,.secret,.noprint,#toast{display:none!important}
  body.printing main{display:none}
  body.printing #printArea{display:block}
  #printArea h1{font-size:18px;margin:4px 0 10px}
  #printArea .tbl th{background:#eee;color:#000}
  #printArea .tbl th,#printArea .tbl td{border:1px solid #999;padding:4px 6px}
  .card,.stat{box-shadow:none;border-color:#bbb}
  .ttd{display:flex;justify-content:flex-end;margin-top:40px}
  .ttd div{text-align:center;min-width:220px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="emblem" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 3.5L16 11H5"/><path d="M3 21h10"/><circle cx="18" cy="17" r="3"/></svg>
    </div>
    <div>
      <h1>Pengelola Ekstrakurikuler</h1>
      <div class="sub" id="subTitle">—</div>
    </div>
    <div class="tools">
      <button class="iconbtn" id="btnTema" type="button" aria-label="Ganti tema terang/gelap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="lbl">Tema</span>
      </button>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Menu utama"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="view" tabindex="-1"></main>
<div id="printArea"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"><form id="dlgForm" method="dialog"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ Konstanta ============ */
var KEY="ekskul_pengelola_v1", KEY_AI="ekskul_gemini_key", KEY_TEMA="ekskul_tema";
var HARI=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
var BENTUK=["Krida","Karya Ilmiah","Olah Bakat/Minat","Keagamaan","Lainnya"];
var TINGKAT=["Sekolah","Kecamatan","Kabupaten/Kota","Provinsi","Nasional","Internasional"];
var PERAN=["Anggota","Ketua","Wakil Ketua","Sekretaris","Bendahara"];
var STAT={H:"Hadir",I:"Izin",S:"Sakit",A:"Alpa"};
var WARNA=["#1d7a5c","#c2410c","#2563eb","#9333ea","#b45309","#0e7490","#be185d","#4d7c0f"];
var PRED=[["SB","Sangat Baik"],["B","Baik"],["C","Cukup"],["K","Kurang"]];
var TABS=[["beranda","Beranda"],["ekskul","Ekskul"],["siswa","Siswa"],["presensi","Presensi"],["jadwal","Jadwal"],["prestasi","Prestasi"],["nilai","Nilai Rapor"],["rekap","Rekap"],["pengaturan","Pengaturan"],["sumber","Dasar & Sumber"]];

/* ============ Utilitas ============ */
function $(s,el){return (el||document).querySelector(s);}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function today(){return iso(new Date());}
function hariIdx(isoStr){var g=new Date(isoStr+"T00:00:00").getDay();return (g+6)%7;}
var BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function tgl(s){if(!s)return "—";var p=s.split("-");return parseInt(p[2],10)+" "+BLN[parseInt(p[1],10)-1]+" "+p[0];}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("on");},2600);}
function lc1(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function namaDepan(n){return String(n||"").trim().split(/\s+/)[0]||"";}
function byNama(a,b){return a.nama.localeCompare(b.nama,"id");}
function kelasSort(a,b){return String(a).localeCompare(String(b),"id",{numeric:true});}

/* ============ Penyimpanan ============ */
var S;
function defaultP(){return {sekolah:"SMP Negeri Contoh",ta:"2026/2027",semester:"Ganjil",kota:"",bobot:30,sb:88,b:75,c:60,ambang:75,model:"gemini-2.5-flash"};}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);migrate();return;}}catch(e){}
  S=dataContoh();save(true);
}
function migrate(){
  var d=defaultP();S.p=S.p||{};for(var k in d)if(S.p[k]==null)S.p[k]=d[k];
  ["siswa","ekskul","presensi","prestasi"].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[];});
  if(!S.nilai||typeof S.nilai!=="object")S.nilai={};
  S.ekskul.forEach(function(e){e.anggota=e.anggota||[];e.jadwal=e.jadwal||[];e.indikator=e.indikator||["Kedisiplinan","Keterampilan","Kerja sama"];});
}
function save(silent){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){if(!silent)toast("Gagal menyimpan di perangkat ini (penyimpanan browser tidak tersedia).");}}
function getKey(){try{return localStorage.getItem(KEY_AI)||"";}catch(e){return "";}}
function setKey(v){try{if(v)localStorage.setItem(KEY_AI,v);else localStorage.removeItem(KEY_AI);}catch(e){}}

/* ============ Data contoh (fiktif) ============ */
function dataContoh(){
  var r=rng(20261121);
  var nm=["Adit Pradana","Bunga Larasati","Cahya Nugraha","Dimas Saputra","Elsa Wulandari","Fajar Kusuma","Gita Rahmawati","Hanif Ramadhan","Intan Permatasari","Joko Santoso","Kirana Putri","Lutfi Hakim","Maya Anggraini","Naufal Rizki","Oktavia Sari","Panji Wicaksono","Qonita Azzahra","Rafi Firmansyah","Salsa Nabila","Teguh Prasetyo","Umi Kalsum","Vino Ardiansyah","Wulan Dewi","Yoga Pamungkas","Zahra Kamila","Bagas Setiawan","Citra Ayu","Dewa Mahendra","Eka Puspita","Galih Wibowo"];
  var kls=["7A","7B","8A","8B","9A","9C"];
  var siswa=nm.map(function(n,i){return {id:"s"+(i+1),nama:n,kelas:kls[Math.floor(i/5)],jk:(i%2?"P":"L"),contoh:true};});
  function E(id,nama,jenis,bentuk,pembina,pelatih,jadwal,kuota,warna,ind,tujuan){return {id:id,nama:nama,jenis:jenis,bentuk:bentuk,pembina:pembina,pelatih:pelatih,jadwal:jadwal,kuota:kuota,warna:warna,indikator:ind,tujuan:tujuan,anggota:[],contoh:true};}
  var ek=[
    E("e1","Pramuka","wajib","Krida","Kak Wahyu Hidayat (contoh)","","[{\"hari\":4,\"mulai\":\"14:00\",\"selesai\":\"16:00\",\"tempat\":\"Lapangan utama\"}]",40,WARNA[0],["Kedisiplinan dan tanggung jawab","Keterampilan kepramukaan (tali-temali, sandi, P3K)","Kerja sama regu dan kepemimpinan"],"Membentuk karakter disiplin, mandiri, peduli, dan cinta tanah air melalui kegiatan kepanduan."),
    E("e2","Palang Merah Remaja","pilihan","Krida","Bu Rina Astuti (contoh)","Relawan PMI (contoh)","[{\"hari\":1,\"mulai\":\"14:00\",\"selesai\":\"15:30\",\"tempat\":\"Ruang UKS\"}]",20,WARNA[1],["Kedisiplinan","Keterampilan pertolongan pertama","Kepedulian dan kerja sama"],"Menumbuhkan kepedulian dan keterampilan pertolongan pertama."),

function hapusContoh(){

  S.siswa=S.siswa.filter(function(s){return !s.contoh;});
  S.presensi=S.presensi.filter(function(p){return !p.contoh&&es.indexOf(p.ekskul)<0;});
  S.prestasi=S.prestasi.filter(function(p){return !p.contoh&&es.indexOf(p.ekskul)<0;});

/* ============ Helper domain ============ */
function ek(id){for(var i=0;i<S.ekskul.length;i++)if(S.ekskul[i].id===id)return S.ekskul[i];return null;}
function sw(id){for(var i=0;i<S.siswa.length;i++)if(S.siswa[i].id===id)return S.siswa[i];return null;}
function isAnggota(e,sid){return e.anggota.some(function(a){return a.s===sid;});}
function ekskulSiswa(sid){return S.ekskul.filter(function(e){return isAnggota(e,sid);});}
function anggotaList(e){return e.anggota.map(function(a){var s=sw(a.s);return s?{s:s,p:a.p}:null;}).filter(Boolean).sort(function(x,y){return kelasSort(x.s.kelas,y.s.kelas)||x.s.nama.localeCompare(y.s.nama,"id");});}
function daftarKelas(){var k=[];S.siswa.forEach(function(s){if(s.kelas&&k.indexOf(s.kelas)<0)k.push(s.kelas);});return k.sort(kelasSort);}
function rentang(){var y=parseInt(S.p.ta,10)||new Date().getFullYear();return S.p.semester==="Genap"?[(y+1)+"-01-01",(y+1)+"-06-30"]:[y+"-07-01",y+"-12-31"];}
function rentangTA(){var y=parseInt(S.p.ta,10)||new Date().getFullYear();return [y+"-07-01",(y+1)+"-06-30"];}
function presSem(eid){var r=rentang();return S.presensi.filter(function(p){return p.ekskul===eid&&p.tanggal>=r[0]&&p.tanggal<=r[1];}).sort(function(a,b){return a.tanggal<b.tanggal?-1:1;});}
function hadirStat(eid,sid){var o={H:0,I:0,S:0,A:0,n:0};presSem(eid).forEach(function(p){var v=p.hadir[sid];if(v){o[v]++;o.n++;}});o.pct=o.n?Math.round(o.H/o.n*100):null;return o;}
function hadirEkskul(eid){var h=0,n=0;presSem(eid).forEach(function(p){for(var k in p.hadir){n++;if(p.hadir[k]==="H")h++;}});return n?Math.round(h/n*100):null;}
function jam(e){return e.jadwal.map(function(j){return HARI[j.hari]+" "+j.mulai+"–"+j.selesai+(j.tempat?" · "+j.tempat:"");}).join("; ")||"Belum terjadwal";}
function nk(eid){return eid+"|"+S.p.ta+"|"+S.p.semester;}
function nilaiRec(eid,sid,buat){var k=nk(eid);if(!S.nilai[k]){if(!buat)return null;S.nilai[k]={};}if(!S.nilai[k][sid]){if(!buat)return null;S.nilai[k][sid]={i:[0,0,0],d:"",m:false};}return S.nilai[k][sid];}
function hitung(eid,sid){
  var rec=nilaiRec(eid,sid,false),hs=hadirStat(eid,sid);
  var vals=rec?rec.i.filter(function(v){return v>0;}):[];
  if(!vals.length)return {nilai:null,pred:null,hadir:hs};
  var ind=vals.reduce(function(a,b){return a+b;},0)/vals.length/4*100;
  var w=Math.max(0,Math.min(100,+S.p.bobot||0))/100;
  var n=Math.round(hs.pct==null?ind:(1-w)*ind+w*hs.pct);
  var pr=n>=S.p.sb?"Sangat Baik":n>=S.p.b?"Baik":n>=S.p.c?"Cukup":"Kurang";
  return {nilai:n,pred:pr,hadir:hs};
}
function predKode(p){return p==="Sangat Baik"?"SB":p==="Baik"?"B":p==="Cukup"?"C":"K";}
var FRASA={"Sangat Baik":"menunjukkan capaian sangat baik","Baik":"menunjukkan capaian baik","Cukup":"menunjukkan capaian cukup","Kurang":"masih memerlukan pendampingan"};
function susunDesk(e,s){
  var h=hitung(e.id,s.id),rec=nilaiRec(e.id,s.id,false);if(!h.pred||!rec)return "";
  var kuat=[],lemah=[];e.indikator.forEach(function(lb,i){var v=rec.i[i];if(v>=4)kuat.push(lc1(lb));else if(v>0&&v<=2)lemah.push(lc1(lb));});
  var t="Ananda "+namaDepan(s.nama)+" "+FRASA[h.pred]+" dalam kegiatan "+e.nama;
  if(kuat.length)t+=", menonjol dalam "+kuat.join(" dan ");
  t+=".";
  if(lemah.length)t+=" Perlu meningkatkan "+lemah.join(" dan ")+".";
  else if(!kuat.length){var mi=0;rec.i.forEach(function(v,i){if(v>0&&(rec.i[mi]===0||v<rec.i[mi]))mi=i;});t+=" Terus kembangkan "+lc1(e.indikator[mi])+".";}
  if(h.hadir.pct!=null&&h.hadir.pct<S.p.ambang)t+=" Kehadiran latihan perlu ditingkatkan.";
  return t;
}
function deskAkhir(e,s){var rec=nilaiRec(e.id,s.id,false);if(rec&&rec.m&&rec.d)return rec.d;return susunDesk(e,s);}
function overlap(a,b){return a.hari===b.hari&&a.mulai<b.selesai&&b.mulai<a.selesai;}
function cekBentrok(){
  var out=[],E=S.ekskul;
  for(var i=0;i<E.length;i++)for(var j=i+1;j<E.length;j++){
    E[i].jadwal.forEach(function(a){E[j].jadwal.forEach(function(b){
      if(!overlap(a,b))return;
      if(a.tempat&&b.tempat&&a.tempat.trim().toLowerCase()===b.tempat.trim().toLowerCase())out.push({t:"tempat",hari:a.hari,a:E[i],b:E[j],d:a.tempat});
      var sama=E[i].anggota.filter(function(x){return isAnggota(E[j],x.s);}).map(function(x){var s=sw(x.s);return s?s.nama:"";}).filter(Boolean);
      if(sama.length)out.push({t:"siswa",hari:a.hari,a:E[i],b:E[j],d:sama});
    });});
  }
  return out;
}
function hapusJejakSiswa(sid){
  S.ekskul.forEach(function(e){e.anggota=e.anggota.filter(function(a){return a.s!==sid;});});
  S.presensi.forEach(function(p){delete p.hadir[sid];});
  S.prestasi.forEach(function(p){p.siswa=(p.siswa||[]).filter(function(x){return x!==sid;});});
  Object.keys(S.nilai).forEach(function(k){delete S.nilai[k][sid];});
}

  if(hk!=null&&hk<S.p.ambang)rek.push("Kehadiran rata-rata "+hk+"% di bawah ambang "+S.p.ambang+"%: tinjau waktu latihan, variasi kegiatan, dan komunikasi dengan wali kelas/orang tua.");
  if(e.kuota&&A.length>e.kuota)rek.push("Anggota melebihi kuota: bagi menjadi beberapa kelompok atau tambah pembina/pelatih.");
  if(e.kuota&&A.length<e.kuota*0.5)rek.push("Peminat masih sedikit: lakukan promosi (demo/pentas) dan identifikasi minat murid di awal tahun ajaran.");
  if(presSem(e.id).length<6)rek.push("Pertemuan semester ini baru "+presSem(e.id).length+" kali: pastikan latihan berjalan rutin sesuai program.");
  if(dist.K+dist.C>0&&A.length&&(dist.K+dist.C)/A.length>=0.3)rek.push("Sepertiga anggota atau lebih berpredikat Cukup/Kurang: rancang latihan berjenjang dan pendampingan sebaya.");
  if(pr.length)rek.push("Pertahankan dan publikasikan prestasi ("+pr.length+" capaian) untuk memotivasi murid lain.");
  if(!rek.length)rek.push("Program berjalan baik; lanjutkan dan dokumentasikan praktik baiknya.");
  return {A:A,kel:kel,jk:jk,dist:dist,pr:pr,hk:hk,rek:rek,pert:presSem(e.id).length};
}

    if(baru)S.prestasi.push(o);toast("Prestasi disimpan.");
  });
  $("#prEkSel").addEventListener("change",function(){$("#prList").innerHTML=prSiswaList(ek(this.value),[]);});
}
function prSiswaList(e,sel){if(!e||!e.anggota.length)return '<div class="empty">Ekskul ini belum memiliki anggota.</div>';return anggotaList(e).map(function(o){return '<label><input type="checkbox" name="ps" value="'+o.s.id+'"'+(sel.indexOf(o.s.id)>=0?" checked":"")+'> '+esc(o.s.nama)+' <span class="muted small">'+esc(o.s.kelas)+'</span></label>';}).join("");}

/* ============ AI ============ */
async function gemini(prompt){
  var key=getKey();if(!key)throw new Error("Kunci API Gemini belum diisi di Pengaturan.");
  var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(S.p.model||"gemini-2.5-flash")+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.6,responseMimeType:"application/json"}})});
  if(!r.ok)throw new Error("Gemini menolak permintaan (kode "+r.status+"). Periksa kunci API dan nama model.");
  var j=await r.json();
  return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(function(p){return p.text||"";}).join("");
}
async function aiDeskripsi(btn){
  var e=ek(ui.nEk),A=anggotaList(e).filter(function(o){return hitung(e.id,o.s.id).pred;});
  if(!A.length){toast("Belum ada murid yang dinilai.");return;}
  if(!konfirmasi("Kirim "+A.length+" data penilaian (tanpa nama murid) ke Gemini untuk memperhalus deskripsi?"))return;
  btn.disabled=true;btn.textContent="Memproses…";
  var data=A.map(function(o,i){var rec=nilaiRec(e.id,o.s.id,false),h=hitung(e.id,o.s.id);return {no:i+1,predikat:h.pred,kehadiran_persen:h.hadir.pct,skor:e.indikator.map(function(t,k){return t+": "+(rec.i[k]||"-");}),draf:deskAkhir(e,o.s).split(namaDepan(o.s.nama)).join("[NAMA]")};});
  var prompt="Anda membantu pembina ekstrakurikuler SMP di Indonesia menulis deskripsi rapor ekstrakurikuler. Ekskul: "+e.nama+". Skala skor 1-4. Untuk setiap data, tulis ulang draf menjadi 1-2 kalimat bahasa Indonesia yang positif, spesifik, dan membangun (maks 35 kata), wajib diawali 'Ananda [NAMA]', sesuai predikat dan skor, tanpa menambah fakta baru. Kembalikan HANYA array JSON berisi string sesuai urutan.\nDATA:\n"+JSON.stringify(data);
  try{
    var t=await gemini(prompt),arr=JSON.parse(t.replace(/^```json|```$/g,"").trim());
    if(!Array.isArray(arr))throw new Error("Format jawaban AI tidak dikenali.");
    A.forEach(function(o,i){if(typeof arr[i]==="string"&&arr[i].trim()){var rec=nilaiRec(e.id,o.s.id,true);rec.d=arr[i].split("[NAMA]").join(namaDepan(o.s.nama)).trim();rec.m=true;}});
    save();toast("Deskripsi diperhalus. Periksa kembali sebelum dipakai.");render();
  }catch(err){toast(err.message||"Gagal menghubungi Gemini.");btn.disabled=false;btn.textContent="Perhalus dengan AI (opsional)";}
}

function laporanEkskul(e){
  var r=rekapEk(e);

  h+='<h3 style="margin:14px 0 6px">Daftar anggota dan capaian</h3><table class="tbl"><thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Peran</th><th>Hadir</th><th>Predikat</th></tr></thead><tbody>'+r.A.map(function(o,i){var x=hitung(e.id,o.s.id);return '<tr><td>'+(i+1)+'</td><td>'+esc(o.s.nama)+'</td><td>'+esc(o.s.kelas)+'</td><td>'+esc(o.p)+'</td><td>'+(x.hadir.pct==null?"-":x.hadir.pct+"%")+'</td><td>'+(x.pred||"-")+'</td></tr>';}).join("")+'</tbody></table>';
  var P=presSem(e.id);
  h+='<h3 style="margin:14px 0 6px">Kegiatan latihan</h3>'+(P.length?'<table class="tbl"><thead><tr><th>Tanggal</th><th>Materi</th><th>Hadir</th></tr></thead><tbody>'+P.map(function(p){var t=0,hh=0;for(var k in p.hadir){t++;if(p.hadir[k]==="H")hh++;}return '<tr><td>'+tgl(p.tanggal)+'</td><td>'+esc(p.materi||"-")+'</td><td>'+hh+'/'+t+'</td></tr>';}).join("")+'</tbody></table>':'<p>Belum ada catatan.</p>');
  h+='<h3 style="margin:14px 0 6px">Prestasi tahun ajaran ini</h3>'+(r.pr.length?'<ul>'+r.pr.map(function(p){return '<li>'+tgl(p.tanggal)+' — '+esc(p.lomba)+' ('+esc(p.tingkat)+'): <b>'+esc(p.peringkat)+'</b></li>';}).join("")+'</ul>':'<p>Belum ada.</p>');
  h+='<h3 style="margin:14px 0 6px">Evaluasi dan rekomendasi tindak lanjut</h3><ul>'+r.rek.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul>';
  h+=ttd("Pembina "+e.nama,e.pembina);
  cetak("Laporan Ekstrakurikuler "+e.nama,h);
}

  if(t.id==="imporFile"&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||!Array.isArray(o.siswa)||!Array.isArray(o.ekskul))throw 0;if(!konfirmasi("Ganti seluruh data di perangkat ini dengan isi cadangan?"))return;S=o;migrate();save();render();toast("Cadangan berhasil dipulihkan.");}catch(e){toast("Berkas cadangan tidak valid.");}};fr.readAsText(t.files[0]);t.value="";}
