<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book to Game</title>
<meta name="description" content="Book to Game: unggah buku STEM (Word, PDF, atau proyek SERAT STEM) dan mesin langsung membangun game petualangan edukasi — setiap bab menjadi level dengan karakter, misi, lab virtual, kuis, hadiah, dan rapor capaian. Satu data untuk Android, Windows, dan Web.">
<meta name="theme-color" content="#3b2a86">
<link rel="manifest" href="manifest.webmanifest" id="lnkManifest">
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="ikon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ff;--paper:#fff;--paper2:#f1eefb;--ink:#1d1640;--mut:#5d5784;--line:#ddd6f3;
  --pri:#5b3fd1;--pri-ink:#fff;--S:#2f9e44;--T:#1c7ed6;--E:#f08c00;--M:#c2255c;--gold:#f5b700;--ok:#2b8a3e;--bad:#e03131;
  --shadow:0 2px 0 var(--line),0 16px 34px -20px rgba(40,20,110,.55);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120e26;--paper:#1d1838;--paper2:#262049;--ink:#f0ecff;--mut:#b2aad6;--line:#352d63;
  --pri:#8c74ff;--pri-ink:#140c33;--S:#51cf66;--T:#4dabf7;--E:#ffa94d;--M:#f06595;--gold:#ffd43b;--ok:#51cf66;--bad:#ff6b6b;
  --shadow:0 2px 0 #000,0 16px 34px -20px #000;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120e26;--paper:#1d1838;--paper2:#262049;--ink:#f0ecff;--mut:#b2aad6;--line:#352d63;
  --pri:#8c74ff;--pri-ink:#140c33;--S:#51cf66;--T:#4dabf7;--E:#ffa94d;--M:#f06595;--gold:#ffd43b;--ok:#51cf66;--bad:#ff6b6b;
  --shadow:0 2px 0 #000,0 16px 34px -20px #000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:Fredoka,Nunito,sans-serif;line-height:1.12;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--T);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.logo{width:42px;height:42px;border-radius:12px;flex:none}
.hd h1{font-size:clamp(20px,3.2vw,28px)}
.hd small{display:block;color:var(--mut);font-size:13px;line-height:1.2}
.sp{flex:1}
.ib{border:2px solid var(--line);background:var(--paper);border-radius:12px;min-width:44px;height:44px;padding:0 10px;display:inline-grid;place-items:center;font-weight:800}
.ib:hover{border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 16px;font-weight:800;min-height:48px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1d00}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px;border-radius:10px}
.btn.big{font-size:20px;min-height:58px;padding:12px 24px;border-radius:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
main{padding:18px 0 80px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.mt{margin-top:16px}
.lead{color:var(--mut);margin:6px 0 0}
.note{color:var(--mut);font-size:14.5px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);font-size:12.5px;font-weight:800;margin:0 4px 4px 0;white-space:nowrap}
.pill.ai{background:color-mix(in srgb,var(--E) 20%,var(--paper));border-color:var(--E)}
.pill.baru{background:color-mix(in srgb,var(--S) 22%,var(--paper));border-color:var(--S)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center}
@media (max-width:800px){.hero{grid-template-columns:1fr}}
.hero h2{font-size:clamp(30px,5vw,48px)}
.drop{border:3px dashed var(--line);border-radius:20px;padding:22px;text-align:center;background:var(--paper2)}
.drop.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--paper2))}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.flow div{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:14px;text-align:center}
.flow b{display:block;font:700 22px Fredoka}
@media (max-width:600px){.flow{grid-template-columns:1fr 1fr}}
.books{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
.book{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.book:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--S) 0 25%,var(--T) 25% 50%,var(--E) 50% 75%,var(--M) 75%)}
.book h3{font-size:22px;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-weight:800;font-size:14.5px}
.fld input,.fld select,.fld textarea{border:2px solid var(--line);background:var(--paper2);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
.fld textarea{min-height:120px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:0 12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:8px 14px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--paper2)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap}
.bar{height:12px;background:var(--paper2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:80px}
.bar i{display:block;height:100%;background:var(--pri)}

/* Peta level */
.mapwrap{position:relative;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--S) 18%,transparent),transparent 40%),radial-gradient(circle at 80% 60%,color-mix(in srgb,var(--T) 18%,transparent),transparent 45%),var(--paper);border:2px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow);overflow:hidden}
.map{position:relative;width:100%}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;text-align:center;border:0;background:none;padding:0}
.node .o{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:700 32px Fredoka;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px -8px rgba(0,0,0,.5);border:4px solid #fff;position:relative}
.node.kunci .o{filter:grayscale(1);opacity:.55}
.node.kini .o{animation:pulse 1.6s infinite}
.node .t{font-weight:800;font-size:14px;line-height:1.2;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px 8px;max-width:150px}
.node .st{font-size:16px;letter-spacing:1px;color:var(--gold);text-shadow:0 1px 0 #0006}
.node .bd{position:absolute;right:-6px;top:-6px;width:32px;height:32px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:17px;border:2px solid #fff}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow)}
.stat b{font:700 24px Fredoka;margin-right:4px}

/* Adegan dialog */
.scene{display:grid;gap:12px}
.bub{display:flex;gap:12px;align-items:flex-end;animation:muncul .3s}
.bub .av{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;border:3px solid #fff;box-shadow:var(--shadow)}
.bub .tx{background:var(--paper);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;box-shadow:var(--shadow);max-width:760px}
.bub .tx b{display:block;font:700 15px Fredoka;margin-bottom:2px}
.bub.kanan{flex-direction:row-reverse}.bub.kanan .tx{border-radius:18px 18px 4px 18px}
@keyframes muncul{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.misi{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
.mcard{border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:150px}
.mcard .ik{font-size:36px}
.mcard h3{font-size:20px}
.mcard .st{color:var(--gold);font-size:20px;letter-spacing:2px;margin-top:auto}
.mcard[disabled]{opacity:.5}

/* Layar misi */
.stage{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.prog{height:12px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:8px 0 14px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--S),var(--T));transition:width .3s}
.q{font:800 clamp(19px,2.4vw,26px)/1.35 Nunito}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{border:3px solid var(--line);background:var(--paper2);border-radius:16px;padding:12px 14px;text-align:left;font-weight:800;display:flex;gap:10px;align-items:center;min-height:62px}
.opt i{font-style:normal;flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--pri);color:var(--pri-ink);font-family:Fredoka}
.opt.benar{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.opt.salah{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--paper));animation:shake .35s}
.opt.hapus{opacity:.25;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{margin-top:12px;padding:10px 14px;border-radius:14px;font-weight:700}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--paper));border:2px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--paper));border:2px solid var(--bad)}
.timer{font:700 22px Fredoka;padding:4px 12px;border-radius:12px;background:var(--paper2);border:2px solid var(--line)}
.kartu{display:grid;grid-template-columns:1fr minmax(0,320px);gap:16px}
@media (max-width:800px){.kartu{grid-template-columns:1fr}}
.kartu ul{margin:6px 0 0;padding-left:20px}
.ilus{border-radius:16px;border:2px solid var(--line);overflow:hidden;background:var(--paper2)}
.ilus img{width:100%;display:block;max-height:300px;object-fit:contain;background:#fff}
.ilus .ph{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:14px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--T) 12%,var(--paper2)) 0 18px,var(--paper2) 18px 36px);font-weight:700;color:var(--mut)}
.ilus .ph span{font-size:44px;display:block}
.ilus figcaption{padding:8px 10px;font-size:14px;font-weight:700}
.stembox{border-left:5px solid var(--E);background:color-mix(in srgb,var(--E) 10%,var(--paper));padding:10px 14px;border-radius:0 14px 14px 0;margin-top:10px;font-size:15px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.chipq{border:3px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;min-height:54px}
.chipq.pilih{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--paper))}
.chipq.cocok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper));opacity:.75}
.chipq.salah{border-color:var(--bad);animation:shake .35s}
.chipq.art{font-weight:600;font-size:15px}
.steps .stp{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left;width:100%;font-weight:700}
.steps .stp b{flex:none;width:30px;height:30px;border-radius:9px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-family:Fredoka}
.steps .stp.salah{border-color:var(--bad);animation:shake .35s}
.sort2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steam4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:8px;margin-top:10px}
.steam4 div{border-radius:14px;padding:10px;color:#fff;font-size:14.5px}
.res{text-align:center;padding:10px}
.res .bintang{font-size:56px;letter-spacing:6px;color:var(--gold)}
.lencana{width:130px;height:130px;margin:10px auto;border-radius:50%;background:conic-gradient(var(--S),var(--T),var(--E),var(--M),var(--S));display:grid;place-items:center;box-shadow:var(--shadow);animation:muncul .5s}
.lencana div{width:104px;height:104px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 15px Fredoka;padding:8px;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:95;font-weight:800;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog{border:2px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink);padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(15,8,40,.6)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--line)}
.dh h2{flex:1;font-size:20px}
.db{padding:16px}
.busy{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:560px){.hd small{display:none}#btnFull{display:none}.hd h1{font-size:20px}}
@media print{header.top,.noprint,#toast{display:none!important}body{background:#fff;color:#000}.card,.stage{box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap hd">
  <img class="logo" src="ikon.svg" alt="" onerror="this.style.display='none'">
  <div><h1>Book to Game</h1><small id="sub">Buku STEM menjadi game petualangan edukasi</small></div>
  <span class="sp"></span>
  <button class="ib" id="btnPasang" hidden title="Pasang sebagai aplikasi (Android/Windows)">⬇ Pasang</button>
  <button class="ib" id="btnRapor" title="Rapor capaian" aria-label="Rapor capaian">📊</button>
  <button class="ib" id="btnTheme" title="Tema terang/gelap" aria-label="Ganti tema">◐</button>
  <button class="ib" id="btnFull" title="Layar penuh" aria-label="Layar penuh">⛶</button>
</div></header>
<main><div class="wrap" id="view"></div></main>
<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2><button class="ib" onclick="tutupDlg()" aria-label="Tutup">✕</button></div><div class="db" id="dlgB"></div></dialog>
<canvas id="confetti" hidden></canvas>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="bukuTertanam"></script>
<script src="inti.js"></script>
<script src="buku/pustaka.js"></script>
<script>
"use strict";
/* ===================== BOOK TO GAME — aplikasi =====================
   Buku (SERAT STEM .json, Word .docx, PDF, teks) → model BUKU (inti.js) → GAME.
   Semua diproses di perangkat. AI Gemini opsional memakai kunci milik pengguna. */
var SKELETON = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
var B2G = window.BookToGame;
var K = { prog: "b2g.progres", cfg: "b2g.atur", tema: "b2g.tema" };
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function acak(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function potong(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,"")+"…":s;}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},3400);}
function $(id){return document.getElementById(id);}
var V=function(){return $("view");};
function bintangStr(n){return "★★★".slice(0,n)+"☆☆☆".slice(0,3-n);}
function bintangDari(skor){return skor>=90?3:skor>=75?2:skor>=50?1:0;}
function predikat(p){return p>=85?"Sangat baik":p>=70?"Baik":p>=55?"Cukup":"Perlu bimbingan";}

/* ---------- Penyimpanan buku (IndexedDB, cadangan memori) ---------- */
var IDB=null,MEM={};
function idbBuka(){return new Promise(function(res){try{var r=indexedDB.open("book-to-game",1);r.onupgradeneeded=function(){r.result.createObjectStore("buku");};r.onsuccess=function(){IDB=r.result;res();};r.onerror=function(){res();};}catch(e){res();}});}
function idbSet(k,v){MEM[k]=v;return new Promise(function(res){if(!IDB)return res(false);try{var t=IDB.transaction("buku","readwrite");t.objectStore("buku").put(v,k);t.oncomplete=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});}
function idbDel(k){delete MEM[k];return new Promise(function(res){if(!IDB)return res();try{var t=IDB.transaction("buku","readwrite");t.objectStore("buku").delete(k);t.oncomplete=res;t.onerror=res;}catch(e){res();}});}
function idbSemua(){return new Promise(function(res){if(!IDB)return res(Object.keys(MEM).map(function(k){return MEM[k];}));try{var out=[],t=IDB.transaction("buku","readonly"),c=t.objectStore("buku").openCursor();c.onsuccess=function(){var x=c.result;if(x){out.push(x.value);x.continue();}else res(out);};c.onerror=function(){res([]);};}catch(e){res([]);}});}

/* ---------- Pengaturan & progres ---------- */
var CFG={aiKey:"",aiModel:"",jenjang:"",mode:"normal",suara:true};
try{Object.assign(CFG,JSON.parse(lsGet(K.cfg)||"{}"));}catch(e){}
function simpanCfg(){lsSet(K.cfg,JSON.stringify(CFG));}
function kunciAI(){if(CFG.aiKey)return {key:CFG.aiKey,model:CFG.aiModel||"gemini-3.8-flash",asal:"Pengaturan"};try{var s=JSON.parse(lsGet("serat-stem-cfg")||"{}");if(s.key)return {key:s.key,model:CFG.aiModel||s.model||"gemini-3.8-flash",asal:"SERAT STEM"};}catch(e){}return null;}
var PROG={aktif:"",pemain:{}};
try{Object.assign(PROG,JSON.parse(lsGet(K.prog)||"{}"));}catch(e){}
function simpanProg(){if(!lsSet(K.prog,JSON.stringify(PROG)))toast("Progres tidak bisa disimpan di browser ini.");}
function progBuku(id){var p=PROG.pemain[PROG.aktif];if(!p)return null;p.buku=p.buku||{};return p.buku[id]=p.buku[id]||{misi:{},lencana:{},bos:{}};}

/* ---------- Tema, layar penuh, suara, konfeti ---------- */
function applyTheme(){var t=lsGet(K.tema);if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");}
applyTheme();

async function barisDariHTML(html){
  var doc=new DOMParser().parseFromString(html,"text/html"),out=[];
  async function jalan(el){
    for(var i=0;i<el.children.length;i++){
      var n=el.children[i],tag=n.tagName.toLowerCase();
      var imgs=n.querySelectorAll?n.querySelectorAll("img"):[];
      for(var j=0;j<imgs.length;j++){var src=await kompres(imgs[j].getAttribute("src"),900);if(src)out.push({t:"img",src:src});}
      if(/^h[1-6]$/.test(tag))out.push({t:+tag[1]<=1?"h1":+tag[1]===2?"h2":"h3",text:n.textContent});
      else if(tag==="p"){var tx=n.textContent.trim(),b=n.querySelector("strong");var tebal=b&&b.textContent.trim()===tx&&tx.length<80;if(tx)out.push({t:tebal&&!/^\d+[.)]/.test(tx)?"h2":"p",text:tx});}
      else if(tag==="ul"||tag==="ol"){n.querySelectorAll(":scope > li").forEach(function(li,k){out.push({t:"li",text:(tag==="ol"?(k+1)+". ":"")+li.textContent});});}
      else if(tag==="table"){n.querySelectorAll("tr").forEach(function(tr){var c=[].map.call(tr.children,function(td){return td.textContent.trim();}).filter(Boolean);if(c.length)out.push({t:"p",text:c.join(" : ")});});}
      else if(n.children.length)await jalan(n);
    }
  }
  await jalan(doc.body);return out;
}

    H.L.forEach(function(l){var t=l.t.replace(/\s+/g," ").trim();if(/^\d{1,3}$/.test(t))return;if(gbr&&/^gambar\s+\d/i.test(t)){out.push(gbr);gbr=null;}var tp=l.h>med*1.6?"h1":l.h>med*1.22?"h2":/^[•\-–]\s/.test(t)?"li":"p";out.push({t:tp,text:t.replace(/^[•\-–]\s/,"")});});

}

async function bukuDariBerkas(f,lapor,meta){

function statusMisi(l,m){var r=rekMisi(l,m);if(!r)return {selesai:false,bintang:0};if(r.sidik!==m.sidik)return {selesai:false,bintang:0,diperbarui:true,lama:r};return {selesai:true,bintang:r.bintang,skor:r.skor};}
function levelSelesai(l){var w=l.misi.filter(function(m){return m.wajib;});var cek=w.length?w:l.misi.slice(0,1);return cek.every(function(m){var s=statusMisi(l,m);return s.selesai&&s.bintang>=1;});}
function levelTerbuka(i){return i===0||levelSelesai(GAME.level[i-1]);}
function bintangLevel(l){var s=0;l.misi.forEach(function(m){s+=statusMisi(l,m).bintang;});return {dapat:s,maks:l.misi.length*3};}
function xpBuku(){var p=progBuku(GAME.bukuId),x=0;if(p)for(var k in p.misi)x+=p.misi[k].poin||0;return x;}

/* ---------- Pengaturan ---------- */
function vAtur(){
  var k=kunciAI();
  V().innerHTML='<div class="row"><button class="btn sm" onclick="vBeranda()">← Kembali</button></div><section class="card mt"><h2>Pengaturan</h2><h3 class="mt">AI Gemini (opsional)</h3><p class="note">Dipakai hanya saat Anda menekan “Perkaya dengan AI”. Teks bab dikirim ke Google Gemini memakai kunci Anda; kunci disimpan di perangkat ini. Bila kosong, kunci dari SERAT STEM di perangkat ini dipakai.</p><div class="fgrid"><div class="fld"><label for="ak">Kunci API Gemini</label><input id="ak" type="password" value="'+esc(CFG.aiKey)+'" autocomplete="off"></div><div class="fld"><label for="am">Model</label><input id="am" value="'+esc(CFG.aiModel||(k&&k.model)||"gemini-3.8-flash")+'"></div></div><p class="note">Status: '+(k?'kunci tersedia ('+esc(k.asal)+')':'belum ada kunci')+'</p>'+
    '<h3 class="mt">Suara</h3><label class="row"><input type="checkbox" id="sn"'+(CFG.suara?' checked':'')+'> Efek suara</label><div class="row mt"><button class="btn pri" id="sv">Simpan</button></div></section>';
  $("sv").onclick=function(){CFG.aiKey=$("ak").value.trim();CFG.aiModel=$("am").value.trim();CFG.suara=$("sn").checked;simpanCfg();toast("Pengaturan disimpan.");vBeranda();};
}

document.querySelector(".hd").insertAdjacentHTML("beforeend",'<button class="ib" onclick="vAtur()" title="Pengaturan" aria-label="Pengaturan">⚙</button>');

/* ---------- Mulai ---------- */
document.addEventListener("keydown",function(e){var opts=document.querySelectorAll(".opt:not([disabled])");if(/^[1-5]$/.test(e.key)&&opts.length&&document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="INPUT"){var b=opts[+e.key-1];if(b)b.click();}});
(async function(){
  await idbBuka();await muatRak();cekSerat(true);
  var q=new URLSearchParams(location.search);
  if(TERTANAM){bukaPeta(RAK[0].buku.id);return;}
  if(q.get("buku")&&rakById(q.get("buku"))){bukaPeta(q.get("buku"));return;}
  if(q.get("sumber")==="serat-stem"){var r=RAK.filter(function(x){return x.langsung;})[0];if(r){bukaPeta(r.buku.id);return;}}
  vBeranda();
})();
window.addEventListener("message",function(e){var d=e.data;if(!d||d.type!=="b2g-buku"||!d.buku)return;try{var b=B2G.dariSerat(d.buku);var lama=rakById(b.id);simpanRak({buku:b,ai:lama?lama.ai:{},asal:"Dikirim dari SERAT STEM",ditambah:Date.now()}).then(muatRak).then(function(){bukaPeta(b.id);toast("Game dibangun dari buku SERAT STEM.");});}catch(err){toast("Gagal: "+err.message);}});
try{if(window.opener)window.opener.postMessage({type:"b2g-minta"},"*");}catch(e){}

</script>
