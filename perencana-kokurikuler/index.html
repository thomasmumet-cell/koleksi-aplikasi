.stage{border-left:4px solid var(--sc);padding:4px 0 4px 12px;margin:14px 0}

.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:18px}

.muted{color:var(--muted)}

  .chip{border:1px solid #777!important;color:#000!important;background:#fff!important}
}

const $ = s=>document.querySelector(s);
const uid = ()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTgl = d=>{if(!d)return"–";const t=new Date(d+"T00:00:00");return isNaN(t)?d:t.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"})};
const fmtPendek = d=>{if(!d)return"–";const t=new Date(d+"T00:00:00");return isNaN(t)?d:t.toLocaleDateString("id-ID",{day:"numeric",month:"short"})};
const todayStr = ()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const addDays = (d,n)=>{const t=new Date(d+"T00:00:00");t.setDate(t.getDate()+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const toMin = t=>{if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function dchip(k){const d=DIMK[k];return d?`<span class="chip dchip" style="--dc:var(${d.c})">${esc(d.n)}</span>`:""}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function download(name,text,type){const b=new Blob([text],{type:type||"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(rows){return "﻿"+rows.map(r=>r.map(v=>{v=String(v==null?"":v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n")}
function weekStart(d){const t=new Date(d+"T00:00:00");const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}

const guruNama = id=>{const g=S.guru.find(x=>x.id===id);return g?g.nama:"(guru terhapus)"};
const K = id=>S.kegiatan.find(k=>k.id===id);

/* ====================== ANALISIS ====================== */
function semuaSesi(){const out=[];S.kegiatan.forEach(k=>k.sesi.forEach(s=>out.push({k,s})));return out}
function bentrok(){
  const list=semuaSesi().filter(x=>x.s.tanggal&&x.s.jamMulai&&x.s.jamSelesai);const res=new Map();
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];if(a.s.tanggal!==b.s.tanggal)continue;
    const a1=toMin(a.s.jamMulai),a2=toMin(a.s.jamSelesai),b1=toMin(b.s.jamMulai),b2=toMin(b.s.jamSelesai);
    if(!(a1<b2&&b1<a2))continue;
    const gs=a.s.guru.filter(g=>b.s.guru.includes(g));
    const ks=a.k.id!==b.k.id?a.k.kelas.filter(c=>b.k.kelas.includes(c)):[];
    if(gs.length||ks.length){
      const msg=(gs.length?"guru "+gs.map(guruNama).join(", "):"")+(gs.length&&ks.length?" dan ":"")+(ks.length?"kelas "+ks.join(", "):"");
      [[a,b],[b,a]].forEach(([x,y])=>{if(!res.has(x.s.id))res.set(x.s.id,[]);res.get(x.s.id).push(`Bentrok ${msg} dengan “${y.s.aktivitas||y.k.judul}”`)});
    }
  }
  return res;
}
function jpKelas(){const r={7:0,8:0,9:0};S.kegiatan.forEach(k=>{const jp=k.sesi.reduce((a,s)=>a+(+s.jp||0),0);k.kelas.forEach(c=>r[c]=(r[c]||0)+jp)});return r}
function peta(){const m={};DIM.forEach(d=>{m[d.k]={7:0,8:0,9:0}});S.kegiatan.forEach(k=>k.dimensi.forEach(d=>k.kelas.forEach(c=>{if(m[d])m[d][c]++})));return m}
function bebanGuru(){
  return S.guru.map(g=>{let sesi=0,jp=0;const keg=new Set(),peran=[];
    S.kegiatan.forEach(k=>{k.peran.forEach(p=>{if(p.guru===g.id){keg.add(k.id);peran.push(p.peran+" – "+k.judul)}});k.sesi.forEach(s=>{if(s.guru.includes(g.id)){sesi++;jp+=(+s.jp||0);keg.add(k.id)}})});
    return {g,sesi,jp,keg:keg.size,peran}});
}
function peringatan(){
  const a=[];const b=bentrok();
  S.kegiatan.forEach(k=>{
    const nm=`<b>${esc(k.judul)}</b>`;
    if(!k.dimensi.length)a.push(["bad",`${nm}: belum memilih dimensi profil lulusan.`,k.id]);
    if(k.dimensi.length>3)a.push(["",`${nm}: membidik ${k.dimensi.length} dimensi. Fokuskan pada 2–3 dimensi agar asesmen bermakna.`,k.id]);
    if(k.bentuk==="lintas"&&k.mapel.length<2)a.push(["",`${nm}: kegiatan lintas disiplin sebaiknya melibatkan minimal 2 mapel.`,k.id]);
    if(!k.sesi.length)a.push(["",`${nm}: belum ada jadwal sesi.`,k.id]);
    if(!k.peran.some(p=>p.peran==="Koordinator"))a.push(["",`${nm}: belum ada guru koordinator.`,k.id]);
    if(!k.rubrik.length)a.push(["",`${nm}: belum ada rubrik asesmen.`,k.id]);
    ["memahami","mengaplikasi","merefleksi"].forEach(t=>{if(!k.pengalaman[t].filter(x=>x.trim()).length)a.push(["",`${nm}: tahap <i>${TAHAP[t]}</i> belum diisi.`,k.id])});
    k.sesi.forEach(s=>{if(s.tanggal&&k.mulai&&k.selesai&&(s.tanggal<k.mulai||s.tanggal>k.selesai))a.push(["",`${nm}: sesi “${esc(s.aktivitas)}” (${fmtPendek(s.tanggal)}) di luar periode kegiatan.`,k.id])});
  });
  const seen=new Set();semuaSesi().forEach(({k,s})=>{if(b.has(s.id)&&!seen.has(s.id)){seen.add(s.id);a.push(["bad",`${fmtPendek(s.tanggal)} ${esc(s.jamMulai)}: ${esc(b.get(s.id)[0])} (${esc(k.judul)}).`,k.id])}});
  const p=peta();[7,8,9].forEach(c=>{const kosong=DIM.filter(d=>!p[d.k][c]).map(d=>d.n);if(kosong.length&&kosong.length<8)a.push(["",`Kelas ${c}: dimensi belum tersentuh tahun ini → ${kosong.join(", ")}.`]);if(kosong.length===8)a.push(["bad",`Kelas ${c}: belum ada kegiatan kokurikuler.`])});
  const jp=jpKelas();[7,8,9].forEach(c=>{const t=+S.sekolah.target[c];if(t&&jp[c]>t)a.push(["",`Kelas ${c}: JP terjadwal (${jp[c]}) melebihi target alokasi (${t}).`])});
  return a;
}

function fld(lbl,path,val,type,ph,hint){
  const id="f_"+path.replace(/\W/g,"_");

  return `<label class="f" for="${id}">${lbl}</label>${inp}${hint?`<p class="hint">${hint}</p>`:""}`;
}
function sel(lbl,path,val,opts){const id="f_"+path.replace(/\W/g,"_");return `<label class="f" for="${id}">${lbl}</label><select id="${id}" data-f="${path}">${Object.entries(opts).map(([k,v])=>`<option value="${k}" ${k===val?"selected":""}>${esc(v)}</option>`).join("")}</select>`}

   <div><label class="f" for="s_${s.id}">Selesai</label><input id="s_${s.id}" type="time" data-l="sesi" data-id="${s.id}" data-k="jamSelesai" value="${esc(s.jamSelesai)}"></div>
   <div><label class="f" for="j_${s.id}">JP</label><input id="j_${s.id}" type="number" min="0" max="20" data-l="sesi" data-id="${s.id}" data-k="jp" value="${esc(s.jp)}"></div></div>

async function usulAI(k){
  if(!SET.key){toast("Isi kunci API Gemini di Pengaturan & Sumber terlebih dulu.");return}
  const btn=document.querySelector('[data-act="ai"]');if(btn){btn.disabled=true;btn.textContent="Menyusun usulan…"}
  const prompt=`Anda perancang kegiatan kokurikuler SMP di Indonesia (Permendikdasmen 13/2025, pembelajaran mendalam: berkesadaran, bermakna, menggembirakan).
Judul: ${k.judul}\nTema: ${k.tema}\nKelas: ${k.kelas.join(", ")}\nMapel: ${k.mapel.join(", ")}\nDimensi profil lulusan: ${k.dimensi.map(d=>DIMK[d].full).join(", ")}\nKonteks: ${k.identifikasi.konteks}\nProduk: ${k.produk}
Buat usulan ringkas dalam bahasa Indonesia. Balas HANYA JSON valid: {"tujuan":"1-2 kalimat","memahami":["3 langkah"],"mengaplikasi":["3 langkah"],"merefleksi":["2-3 langkah"],"asesmen":"1 kalimat"}. Sebut mapel yang berperan di tiap langkah.`;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(SET.model)}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":SET.key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:.7}})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||("HTTP "+r.status));
    const txt=j.candidates[0].content.parts.map(p=>p.text||"").join("");const o=JSON.parse(txt.replace(/^```json|```$/g,"").trim());
    dialog(`<h2>Usulan Gemini</h2><p class="hint">Periksa dan sesuaikan sebelum dipakai.</p>
     <p><b>Tujuan:</b> ${esc(o.tujuan||"")}</p>${["memahami","mengaplikasi","merefleksi"].map(t=>`<b>${TAHAP[t]}</b><ol>${(o[t]||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`).join("")}<p><b>Asesmen:</b> ${esc(o.asesmen||"")}</p>
     <div class="row"><button class="btn pri" type="button" id="aiPakai">Tambahkan ke rancangan</button><button class="btn" type="button" data-close>Tutup</button></div>`);
    $("#aiPakai").onclick=()=>{["memahami","mengaplikasi","merefleksi"].forEach(t=>k.pengalaman[t].push(...(o[t]||[]).map(String)));if(o.tujuan&&!k.desain.tujuan)k.desain.tujuan=o.tujuan;if(o.asesmen&&!k.asesmen.proses)k.asesmen.proses=o.asesmen;save();$("#dlg").close();render();toast("Usulan ditambahkan.")};
  }catch(e){toast("Gagal memanggil Gemini: "+e.message)}
  finally{if(btn){btn.disabled=false;btn.textContent="✦ Usulkan dengan Gemini"}}
}

  if(t.dataset.sub){UI.sub=t.dataset.sub;render();return}
  if(t.hasAttribute("data-close")){$("#dlg").close();return}
  if(t.dataset.tpl!==undefined){const i=+t.dataset.tpl;const k=i>=0?dariTemplat(TEMPLAT[i]):dariTemplat({judul:"Kegiatan baru",tema:"",bentuk:"lintas",pola:"blok",kelas:[7],mapel:[],dimensi:[]});k.mulai=todayStr();k.selesai=addDays(todayStr(),21);S.kegiatan.unshift(k);save();$("#dlg").close();openKeg(k.id);toast("Kegiatan dibuat. Lengkapi rancangan dan jadwalnya.");return}
  const act=t.dataset.act;if(!act)return;const k=cur();
  const A={
    hapusContoh(){if(!confirm("Hapus semua guru dan kegiatan berlabel contoh?"))return;S.kegiatan=S.kegiatan.filter(x=>!x.contoh);const ids=new Set(S.guru.filter(g=>g.contoh).map(g=>g.id));S.guru=S.guru.filter(g=>!g.contoh);S.kegiatan.forEach(x=>{x.peran=x.peran.filter(p=>!ids.has(p.guru));x.sesi.forEach(s=>s.guru=s.guru.filter(g=>!ids.has(g)))});if(S.sekolah.nama==="SMP Contoh Nusantara")S.sekolah={nama:"",tahun:S.sekolah.tahun,target:{7:"",8:"",9:""}};S.contoh=false;UI.sel=null;save();render();toast("Data contoh dihapus.")},
    muatContoh(){const c=contoh();S.guru.push(...c.guru);S.kegiatan.push(...c.kegiatan);S.contoh=true;if(!S.sekolah.nama)S.sekolah=c.sekolah;save();render()},
    kosongkan(){if(!confirm("Kosongkan SEMUA data? Unduh cadangan dulu bila perlu."))return;S=kosong();UI.sel=null;save();render()},
    baru:dlgBaru,guruBaru:dlgGuru,
    kembali(){UI.sel=null;render()},
    duplikat(){const c=JSON.parse(JSON.stringify(k));c.id=uid();c.judul+=" (salinan)";c.contoh=false;c.status="rancang";c.sesi.forEach(s=>s.id=uid());c.peran.forEach(p=>p.id=uid());c.rubrik.forEach(r=>{r.id=uid();r.jml=[0,0,0,0]});c.dok=[];S.kegiatan.unshift(c);save();openKeg(c.id);toast("Kegiatan diduplikat.")},
    hapusKeg(){if(!confirm("Hapus kegiatan “"+k.judul+"”?"))return;S.kegiatan=S.kegiatan.filter(x=>x!==k);UI.sel=null;save();render()},
    tambahStep(){k.pengalaman[t.dataset.t].push("");save();render();const ins=document.querySelectorAll(`[data-step="${t.dataset.t}"]`);if(ins.length)ins[ins.length-1].focus()},
    hapusStep(){k.pengalaman[t.dataset.t].splice(+t.dataset.i,1);save();render()},
    tambahSesi(){const last=k.sesi[k.sesi.length-1];k.sesi.push({id:uid(),tanggal:last?addDays(last.tanggal,7):(k.mulai||todayStr()),jamMulai:last?last.jamMulai:"07:30",jamSelesai:last?last.jamSelesai:"09:30",jp:last?last.jp:2,tahap:"memahami",aktivitas:"",tempat:"",guru:[]});save();render()},
    urutSesi(){k.sesi.sort((a,b)=>(a.tanggal+a.jamMulai).localeCompare(b.tanggal+b.jamMulai));save();render()},
    tambahPeran(){k.peran.push({id:uid(),guru:"",peran:k.peran.some(p=>p.peran==="Koordinator")?"Fasilitator kelas":"Koordinator",tugas:""});save();render()},
    tambahRubrik(){k.rubrik.push(rubrikDari($("#addDim").value));save();render()},
    resetRubrik(){const r=k.rubrik.find(x=>x.id===t.dataset.id);const d=DIMK[r.dimensi];r.kriteria=d.kr;r.lv=[...d.lv];save();render()},
    tambahDok(){k.dok.push({id:uid(),tanggal:todayStr(),judul:"",catatan:"",tautan:"",foto:""});save();render()},
    hapusFoto(){k.dok.find(x=>x.id===t.dataset.id).foto="";save();render()},
    hapusItem(){const l=t.dataset.l;if(!confirm("Hapus item ini?"))return;k[l]=k[l].filter(x=>x.id!==t.dataset.id);save();render()},
    hapusGuru(){const id=t.dataset.id;if(!confirm("Hapus guru ini dari semua kegiatan?"))return;S.guru=S.guru.filter(g=>g.id!==id);S.kegiatan.forEach(x=>{x.peran=x.peran.filter(p=>p.guru!==id);x.sesi.forEach(s=>s.guru=s.guru.filter(g=>g!==id))});save();render()},
    ai(){usulAI(k)},
    cetakKeg(){cetak(htmlRancangan(k))},cetakProgram(){cetak(htmlProgram())},
    ekspor(){download("kokurikuler-"+todayStr()+".json",JSON.stringify(S,null,1),"application/json")},
    salin(){const s=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("JSON disalin."),()=>toast("Tidak bisa menyalin; gunakan Unduh."))},
    csvJadwal(){download("jadwal-kokurikuler.csv",csv([["Tanggal","Mulai","Selesai","JP","Tahap","Aktivitas","Tempat","Kegiatan","Kelas","Guru"],...semuaSesi().sort((a,b)=>(a.s.tanggal+a.s.jamMulai).localeCompare(b.s.tanggal+b.s.jamMulai)).map(({k,s})=>[s.tanggal,s.jamMulai,s.jamSelesai,s.jp,TAHAP[s.tahap],s.aktivitas,s.tempat,k.judul,k.kelas.join("/"),s.guru.map(guruNama).join("; ")])]),"text/csv")},
    csvGuru(){download("beban-guru-kokurikuler.csv",csv([["Guru","Mapel","Jumlah kegiatan","Sesi","JP","Peran"],...bebanGuru().map(x=>[x.g.nama,x.g.mapel,x.keg,x.sesi,x.jp,x.peran.join(" | ")])]),"text/csv")},
    csvRekap(){download("rekap-kokurikuler.csv",csv([["Kegiatan","Tema","Bentuk","Pola","Kelas","Mulai","Selesai","Status","Mapel","Dimensi","Sesi","JP","% Cakap/Mahir"],...S.kegiatan.map(k=>{const t=k.rubrik.reduce((a,r)=>a+r.jml.reduce((x,y)=>x+(+y||0),0),0),c=k.rubrik.reduce((a,r)=>a+(+r.jml[2]||0)+(+r.jml[3]||0),0);return [k.judul,k.tema,BENTUK[k.bentuk],POLA[k.pola],k.kelas.join("/"),k.mulai,k.selesai,STATUS[k.status],k.mapel.join("; "),k.dimensi.map(d=>DIMK[d].full).join("; "),k.sesi.length,k.sesi.reduce((a,s)=>a+(+s.jp||0),0),t?Math.round(c/t*100):""]})]),"text/csv")},
    hapusKey(){SET.key="";saveSet();render();toast("Kunci API dihapus dari perangkat.")}
  };
  if(A[act])A[act]();
});
document.addEventListener("input",e=>{
  const t=e.target,k=cur();
  if(t.dataset.f&&k){setPath(k,t.dataset.f,t.value);save();return}
  if(t.dataset.step&&k){k.pengalaman[t.dataset.step][+t.dataset.i]=t.value;save();return}
  if(t.dataset.l&&k&&t.tagName!=="SELECT"){const it=k[t.dataset.l].find(x=>x.id===t.dataset.id);if(it){it[t.dataset.k]=t.type==="number"?(t.value===""?"":+t.value):t.value;save();updateDerived(k)}return}
  if(t.dataset.rl&&k){k.rubrik.find(r=>r.id===t.dataset.rl).lv[+t.dataset.i]=t.value;save();return}
  if(t.dataset.rj&&k){const r=k.rubrik.find(x=>x.id===t.dataset.rj);r.jml[+t.dataset.i]=Math.max(0,+t.value||0);save();const tot=r.jml.reduce((a,b)=>a+(+b||0),0);const d1=document.querySelector(`[data-derived="dist_${r.id}"]`),d2=document.querySelector(`[data-derived="distt_${r.id}"]`);if(d1)d1.innerHTML=distHTML(r);if(d2)d2.textContent=distTeks(r,tot);return}
  if(t.dataset.g){const g=S.guru.find(x=>x.id===t.dataset.g);if(g){g[t.dataset.k]=t.value;save()}return}
  if(t.dataset.sk){S.sekolah[t.dataset.sk]=t.value;save();$("#hdrSekolah").textContent=(S.sekolah.nama||"")+(S.sekolah.tahun?" · TA "+S.sekolah.tahun:"");return}
  if(t.dataset.target){S.sekolah.target[t.dataset.target]=t.value;save();return}
  if(t.dataset.set){SET[t.dataset.set]=t.value.trim();saveSet();return}
});
document.addEventListener("change",e=>{
  const t=e.target,k=cur();
  if(t.dataset.f&&k&&t.tagName==="SELECT"){setPath(k,t.dataset.f,t.value);save();if(t.dataset.f==="bentuk")render();return}
  if(t.dataset.arr&&k){const arr=k[t.dataset.arr];let v=t.value;if(t.dataset.arr==="kelas"||t.dataset.arr==="kaih")v=+v;const i=arr.indexOf(v);if(t.checked&&i<0)arr.push(v);if(!t.checked&&i>=0)arr.splice(i,1);
    if(t.dataset.arr==="kelas")arr.sort();
    if(t.dataset.arr==="dimensi"&&t.checked&&!k.rubrik.some(r=>r.dimensi===v))k.rubrik.push(rubrikDari(v));
    save();updateDerived(k);return}
  if(t.dataset.l&&k&&t.tagName==="SELECT"){const it=k[t.dataset.l].find(x=>x.id===t.dataset.id);if(it){it[t.dataset.k]=t.value;save()}return}
  if(t.dataset.l==="sesi"&&k&&(t.type==="date"||t.type==="time")){render();const el=document.getElementById(t.id);if(el)el.focus();return}
  if(t.dataset.sg&&k){const s=k.sesi.find(x=>x.id===t.dataset.sg);const i=s.guru.indexOf(t.value);if(t.checked&&i<0)s.guru.push(t.value);if(!t.checked&&i>=0)s.guru.splice(i,1);save();return}
  if(t.dataset.filter){UI[t.dataset.filter]=t.value;render();const el=document.getElementById(t.id);if(el)el.focus();return}
  if(t.dataset.foto&&k&&t.files[0]){kompres(t.files[0]).then(url=>{k.dok.find(x=>x.id===t.dataset.foto).foto=url;save();render();toast("Foto disimpan (dikompres).")}).catch(()=>toast("Foto tidak bisa dibaca."));return}
  if(t.id==="impor"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.kegiatan)||!Array.isArray(o.guru))throw 0;if(!confirm("Ganti semua data dengan isi file ini?"))return;S=o;S.sekolah=S.sekolah||{nama:"",tahun:"",target:{7:"",8:"",9:""}};UI.sel=null;save();render();toast("Data diimpor.")}catch(x){toast("File JSON tidak valid.")}};r.readAsText(t.files[0]);t.value=""}
});
document.addEventListener("keydown",e=>{
  const t=e.target;if(!t.matches('[role="tab"]')||!["ArrowLeft","ArrowRight"].includes(e.key))return;
  const tabs=[...t.parentElement.querySelectorAll('[role="tab"]')];const i=tabs.indexOf(t);const n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length];n.focus();n.click();
  const again=document.querySelector(`[role="tab"][data-view="${n.dataset.view}"],[role="tab"][data-sub="${n.dataset.sub}"]`);if(again)again.focus();
});
function kompres(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=800,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.6))};img.onerror=rej;img.src=u})}
$("#btnTheme").addEventListener("click",()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;SET.theme=n;saveSet()});

load();
if(SET.theme)document.documentElement.dataset.theme=SET.theme;
render();
</script>
