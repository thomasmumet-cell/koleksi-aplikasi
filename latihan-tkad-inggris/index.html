1:['Notice – Peringatan keselamatan',`<div class="box"><h5>DANGER</h5><p><b>Lake Michigan is a dangerous body of water.</b> Participation in activities on or near the water involves risk that may cause serious injury or death. Be aware of changing weather and water conditions.</p><h5>FLAG WARNING SYSTEM</h5><p>The absence of flags does not assure safe waters. Swim bans and advisories may be implemented based on weather conditions such as lightning or high winds, surf conditions such as high waves, or poor water quality. Please be aware of the current swim status when you go to the beach, and follow all instructions from lifeguards. Swim status may change throughout the day as water and weather conditions change.</p><p>🟩 <b>GREEN</b>: Swimming is permitted. No restrictions.<br>🟨 <b>YELLOW</b>: Swim Advisory in place. Use caution when in water.<br>🟥 <b>RED</b>: Swim Ban. No swimming due to hazardous conditions.</p><h5>RIP CURRENTS – Break the Grip of the Rip!</h5><p><b>If trapped in a dangerous current:</b> Don’t fight the current · Swim out of the current, then to shore · If you can’t escape, float and tread water · Swim parallel to shore · Call or wave for help.<br><b>Remember:</b> Only swim when lifeguards are on duty · Never swim alone · When in doubt, don’t go out!</p><p><i>Emergency: Call 911 · Questions? Call 311 · City of Evanston</i></p></div>`],
2:['Label – Makanan/obat',`<div class="box"><h5>Abbott – Nutrition Facts (PediaSure Strawberry Shake Mix)</h5><p>8 servings per container · Serving size 1/3 cup (49 g) of powder · Calories 220<br>Total Fat 9 g (12%) · Saturated Fat 2 g (10%) · Trans Fat 0 g · Cholesterol 10 mg (3%) · Sodium 130 mg (6%) · Total Carbohydrate 29 g (11%) · Dietary Fiber &lt;1 g (3%) · Total Sugars 9 g (includes 8 g Added Sugars, 16%) · Protein 6 g (12%)<br>Vitamins &amp; minerals: Vitamin D 20%, Calcium 15%, Iron 15%, Vitamin C 20%, Vitamin B12 20%, Zinc 10%, and others.</p><p><b>NO ARTIFICIAL GROWTH HORMONES* · NON-GMO†</b><br>Suitable for lactose intolerance‡ · Kid-approved taste · Gluten free</p><p><b>INGREDIENTS:</b> Corn syrup, blend of vegetable oils (high oleic sunflower oil, canola oil, corn oil), maltodextrin, sugar, milk protein concentrate, soy protein isolate, short-chain fructooligosaccharides, less than 2% of: vitamins and minerals, natural and artificial flavors, medium chain triglycerides, beet powder color, salt, soy lecithin, taurine, inositol, Schizochytrium oil, and L-carnitine tartrate.<br><b>CONTAINS: MILK AND SOY INGREDIENTS.</b> Abbott Nutrition, Columbus, Ohio, USA. Product of the Netherlands.</p><p><small>* Milk ingredients are derived from milk of non-rbST-treated cows. † Ingredients not genetically engineered. ‡ Studied in children at risk for malnutrition, 2 servings per day.</small></p></div>`],
3:['Announcement – Community events',`<div class="box"><h5>ANNOUNCEMENT – SCHOOL DONATION DRIVE</h5><p>Let’s support people affected by the recent earthquake in Flores, East Nusa Tenggara (NTT).</p><p><b>WHAT TO DONATE:</b> Clean and usable clothes · Blankets · School supplies · Voluntary cash donation</p><p><b>WHERE &amp; WHEN:</b> Collection table in front of the library. Before Thursday afternoon. Give to Student Council members.</p><p><b>IMPORTANT NOTES:</b> You do not need to leave your regular classes to make donations. Donations will be collected during break time and after school.</p><p><b>VOLUNTEERS NEEDED:</b> Students who would like to help sort and pack donations can register with the Student Council by Wednesday.</p><p><i>Let us show our care and solidarity by helping those in need. – Student Council</i></p></div>`],
4:['Narrative – Fable',`<div class="box"><h5>The Snake Who Was Terrible at Being Scary</h5><p>Every morning, Pip the little bird disappeared from his nest. His mother was worried. “Where are you going?” she asked. “Just flying around!” Pip replied. His mother did not believe him.</p><p>One morning, she saw a snake under the tree. “Aha!” she shouted. “You must be taking my baby!” The snake looked shocked. “Me? Taking your baby? I am afraid of birds!” “You’re a snake!” “Yes,” he said. “But that doesn’t mean I enjoy being scary.” The mother bird crossed her wings. “Stay away from my nest!” The snake sighed and moved away.</p><p>The next morning, Pip disappeared again. His mother followed him quietly. She found Pip at the river. He was trying to fly from one tree to another. Flap! He missed. Splash! He fell into the water. Pip climbed out, shook his feathers, and tried again.</p><p>Suddenly, an eagle flew down toward him. Before Pip could escape, the snake appeared from the grass. “HISS!” The eagle flew away. Pip stared at him. “Wow! That was scary!” The snake smiled proudly. “Thank you. I’ve been practicing.” Pip laughed.</p><p>When the mother bird arrived, she finally understood. The snake had not been stealing her baby. He had been protecting him. She looked at the snake. “I’m sorry I accused you.” The snake nodded. “That’s okay. But next time, please ask before shouting.” The mother laughed. And from that day on, the snake became the forest’s official bodyguard even though he still screamed whenever he saw a mouse.</p></div>`],
5:['Advertisement – Produk',`<div class="box"><h5>Ad 1 – LitePack: LIGHT BAG, BIG DREAMS!</h5><p>The Lightweight Backpack for Active Students. Super lightweight (only 450 grams) · Spacious &amp; organized (fits books, laptop, and your essentials) · Water-resistant (protects your items in light rain) · Ergonomic design (padded straps &amp; back panel). Choose your favorite color: Mint Purple, Sweet Pink, Classic Black, Sky Blue. Perfect for: school, lessons, hangouts, travel. <b>Special price Rp229.000</b> (normal Rp299.000). Buy online (Shopee, Tokopedia, Lazada, website) or offline (LitePack Store, Jakarta, and selected outlets).</p><h5>Ad 2 – AIGER Leather Edition: CARRY MORE. LOOK CLASSY.</h5><p>A stylish and spacious leather bag designed for your everyday journey. Made from premium leather, built to last and look better every day. Key features: Spacious (fits your laptop, books, and daily essentials) · Laptop-friendly · For school &amp; work · Only 3 pockets · Simple &amp; classic. Perfect for everyone: students and working adults. Available in 3 dark colors: Navy, Brown, Black. <b>Special price Rp399.000</b>, 10% off for Aiger members. Available at Aiger online marketplace and Aiger offline stores.</p></div>`],
6:['Descriptive – Review text',`<div class="box"><h5>Reviews – aisyah.f ★★★★☆ (Variation: Purple)</h5><p>I bought the <b>SmoothPress Steam Iron</b> about two weeks ago, and so far, I’m quite happy with it. The iron has a simple and compact design, so it doesn’t take up much space. It has a ceramic soleplate, a 250-milliliter water tank, and three temperature settings. The handle feels comfortable in my hand, and the power cable is long enough to make ironing easier. It also looks nice and doesn’t feel too heavy.</p><p>What I like most is how quickly it heats up. I usually use it for school uniforms, shirts, and trousers, and it removes wrinkles quite well. The ceramic soleplate moves smoothly over the clothes, and the steam function is really helpful for stubborn wrinkles. I also like the temperature settings because I can choose the heat depending on the fabric. However the water tank feels like a tiny cup when I have a mountain of laundry to iron, so I sometimes have to refill it.</p><p>For me, this iron is a good choice for everyday use. It is easy to use and doesn’t require much effort. The small water tank is a little annoying, but it isn’t a big problem when I only have a few clothes to iron.</p><p>Overall, I’m satisfied with this product. It works well, heats up quickly, and is easy to handle. I would recommend it to anyone who regularly irons a small or moderate number of clothes. <b>Four stars from me!</b></p></div>`],
7:['Procedure – Manual',`<div class="box"><h5>How to Make Healthy Seblak</h5><p><i>Seblak</i> is a favourite food among many teenagers. I hope you enjoy cooking this simple and delicious dish.</p><h5>INGREDIENTS</h5><p>100 g garlic crackers, 100 g sliced meat, beaten eggs, 100 g vegetables (Chinese cabbage or other vegetables), 1 tsp salt, 1 tsp sugar, 1 tsp chicken powder, and 600–700 ml water.</p><h5>TO BLEND</h5><p>1 cm sand ginger, 3 shallots, 4 garlic cloves, 2 candlenuts, 4 large chillies, 2 small chillies, and ¼ cup vegetable oil.</p><h5>GARNISH</h5><p>Spring onions</p><h5>DIRECTIONS</h5><p>1. Soak the crackers in hot water for about 20 minutes until they are soft. You can also soak them overnight in cold water to shorten the cooking time. Make sure the crackers are properly softened so the seblak cooks evenly.<br>2. Blend all the spice ingredients until they form a smooth paste.<br>3. Preheat a pan or wok over medium-high heat. Add the blended spice paste. You don’t need to add any extra vegetable oil because the paste already contains oil. Stir for a few seconds until fragrant.<br>4. Add the meat and mix well with the spice paste.<br>5. Add the water and softened crackers. Stir well and bring the mixture to a boil. This should take a few minutes.<br>6. Slowly pour in the beaten eggs in a circular motion to give the soup a better texture. Then, add the chopped Chinese cabbage.<br>7. Cook for another minute or two until the mixture is boiling and all the ingredients are fully cooked. The seblak is now ready to serve. Sprinkle with chopped spring onions.</p><p>The ingredients used for the spice paste are quite simple, but the key to achieving a really delicious flavour is sugar.</p></div>`],
8:['Recount – Inspiring experience',`<div class="box"><p>Nobody in my family knew what my 72-year-old grandmother, Rosa, was doing on her laptop every night. We all assumed she was playing digital card games or watching cooking tutorials. However, her secret was far more extraordinary. Sad about the increasing number of lost pet posters in our neighborhood, she had spent eight months secretly completing online coding bootcamps.</p><p>One evening, during our family dinner, she casually announced that she had just launched a mobile application. We were absolutely stunned. The app, called “PawsFound,” used community mapping and a simple photo-recognition algorithm she pieced together to match lost pets with local street sightings. Initially, we thought it was just a cute hobby project, but within three weeks, it went viral across the city.</p><p>The most unpredictable moment happened a month later when the city’s mayor awarded her a memento of civic honor. During her acceptance speech, Rosa revealed that she had failed her science classes in high school and had spent her whole life believing she wasn’t “smart enough” for technology. She proved that a deep desire to help others can push you to achieve the impossible, regardless of your age. Today, her app has reunited over 2,000 pets with their families.</p></div>`],
9:['Short message',`<div class="box"><h5>WhatsApp – Mia, Adik, Kakak</h5><p><b>Mia:</b> Hey, sis and bro! 👋 (19:30)<br><b>Mia:</b> We’re going to make soto and bakwan for our family lunch tomorrow! (19:30)<br><b>Mia:</b> We need some fresh ingredients, so let’s go to the traditional market at 7:00 a.m. ⏰🧺 (19:31)<br><b>Mia:</b> Please bring the shopping bags! (19:31)<br><b>Mia:</b> After that, we’ll come home and prepare the dishes together. (19:31)<br><b>Mia:</b> Don’t be late! 😊 (19:31)<br><b>Kakak:</b> Okayyy! I’ll bring a big bag and help with the shopping 💪 (19:32)<br><b>Adik:</b> Yayy! Let’s do this! I’ll help with the veggies! 🥦🥕 (19:32)<br><b>Kakak:</b> Yeah! Teamwork! 😆❤️ (19:33)</p></div>`],
10:['Report – Fenomena alam',`<div class="box"><p><b>[Paragraph 1]</b> The Venus flytrap is a unique carnivorous plant native to the wetland areas of the United States. Unlike most plants that get their food only from the sun and soil, the Venus flytrap catches and eats small insects. This diet helps the plant survive in environments where the soil is very poor in nutrients.</p><p><b>[Paragraph 2]</b> The plant has special leaves that act like mouth-like traps. Inside each trap, there are tiny, highly sensitive hairs. When an insect, such as a fly or a spider, lands on the leaf and touches these hairs twice within twenty seconds, the trap snaps shut <u><b>immediately</b></u>. The plant then releases special liquids to digest the insect over several days before opening up again.</p><p><b>[Paragraph 3]</b> Although it is an amazing plant, the Venus flytrap is currently facing serious threats in the wild. People often take them from their natural habitat to sell, and their wetland environments are slowly being destroyed. Because of this, many conservationists are trying hard to protect this fascinating plant from extinction.</p></div>`],
11:['Infographic – Pendidikan',`<div class="box"><h5>THE STATE OF EDUCATION – Key Facts and Figures</h5><p><b>Global access:</b> Around the world, 244 million children and youth are still out of school. 8 out of 10 children and youth are in school, but millions are being left behind.</p><p><b>Education levels (gross enrollment ratio):</b> World – Primary 90%, Lower Secondary 75%, Upper Secondary 53%, Tertiary 38%. Low-income countries – Primary 72%, Lower Secondary 56%, Upper Secondary 32%, Tertiary 11%.</p><p><b>Gender parity:</b> In primary education, more girls than boys are in school in many regions (1.01 girls per boy). GPI: Sub-Saharan Africa 0.97, South Asia 0.93, Latin America &amp; the Caribbean 1.02, Europe &amp; Central Asia 1.01, East Asia &amp; Pacific 1.00.</p><p><b>Learning poverty</b> is the inability of children to read and understand a simple text by age 10. <b>70%</b> of children in low-income countries cannot read and understand a simple text by age 10.</p><p><b>Teachers:</b> The world needs 69 million new teachers by 2030 to achieve universal primary and secondary education.</p><p><b>Education spending:</b> Countries with higher investment in education tend to have better learning outcomes. Government spending as a percentage of GDP: High-income 4.6%, Middle-income 3.6%, Low-income 2.9%.</p><p><b>Benefits:</b> Economic growth – each additional year of schooling can increase a person’s earnings by up to 10%. Better health – more education leads to better health outcomes and longer lives. Stronger societies – education promotes tolerance, reduces inequality and builds peaceful communities. Empowerment – educating girls leads to stronger communities and more equal societies.</p><p><i>Education is a human right, a powerful driver of development, and one of the strongest investments we can make for a better future. Source: UNESCO UIS, World Bank, GEM Report.</i></p></div>`],
12:['Descriptive – Personal',`<div class="box"><p>When someone asks me about someone I admire, I will say, “Laura!” Laura is my cousin, and she is five years older than me. She is 19 years old now and lives in Bristol. She has long, wavy, brown hair and greeny-brown eyes. She is medium height, slim, and very fit because she likes dancing. I like her appearance, especially her long hair and greeny-brown eyes.</p><p>Laura is very active and confident. She has been dancing since she was six. She trains every day at her dance school because she wants to become a professional dancer. She often performs in shows, and I love watching her dance. Besides dancing, she studies photography and has taken many amazing photos, some of them have won prizes.</p><p>I admire Laura because she inspires me to work hard and follow my dreams. She always works hard to improve her talents and never gives up on her goals. When I see her practise dancing every day and achieve success, I feel motivated to do my best too. She teaches me that we can achieve our dreams if we are confident, patient, and hardworking. I feel lucky to have Laura as my cousin, and I hope I can be as confident and talented as her one day.</p></div>`]};

const $=id=>document.getElementById(id),E=s=>s;
const isAns=k=>{const a=A[k],t=Q[k][1];return t=='p'?a!==null:t=='m'?a.length>0:a.every(x=>x!==null)};
const ok=k=>{const q=Q[k],a=A[k];return q[1]=='p'?a===q[4]:q[1]=='m'?[...a].sort().join()==q[4].join():a.join()==q[4].join()};
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return[h,m,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function draw(){const q=Q[i],st=S[q[0]];let h='';
if(q[1]=='p'||q[1]=='m'){h=q[3].map((o,j)=>{const on=q[1]=='p'?A[i]===j:A[i].includes(j);return`<div class="opt ${on?'on':''}" onclick="pick(${j})"><span class="cb ${q[1]=='p'?'rd':''}">${on?'✓':''}</span><span>${o}</span></div>`}).join('')}
else{const lb=L[q[5]];h=`<table><tr><th>#</th><th>Statements</th><th>${lb[0]}</th><th>${lb[1]}</th></tr>`+q[3].map((o,r)=>`<tr><td>${r+1}</td><td>${o}</td>${[0,1].map(c=>`<td class="c ${A[i][r]===c?'on':''}" onclick="pickT(${r},${c})"><span class="dot"></span></td>`).join('')}</tr>`).join('')+'</table>'}
$('app').innerHTML=`<div class="top"><div><div style="font-size:20px">Soal nomor ${i+1}</div><div style="font-size:12px;margin-top:4px">Ukuran font soal: <a href="#" onclick="zoom(.9);return false">A</a> &nbsp;<a href="#" onclick="zoom(1);return false" style="font-size:15px">A</a> &nbsp;<a href="#" onclick="zoom(1.2);return false" style="font-size:18px">A</a></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="pill b" onclick="info()">INFORMASI SOAL</button><span class="pill">Sisa Waktu : <b id="tm">${fmt(sec)}</b></span><button class="pill b" onclick="list()">Daftar Soal ☰</button></div></div>
<div style="text-align:right;margin-top:4px;font-size:15px">Bahasa Inggris – SMP Sederajat (Paket A · Tahap 1)</div>
<div class="main"><div class="stim"><h4>Teks Ulasan ${q[0]}</h4>${st[1]}</div><div class="qa"><div>${q[2]}</div><div class="ins">${q[1]=='m'?M:P}</div>${h}</div></div>
<div class="nav"><button class="btn rdb" onclick="go(i-1)" ${i?'':'disabled style="opacity:.4"'}>◀ Soal sebelumnya</button><label class="btn ylb"><input type="checkbox" ${F[i]?'checked':''} onchange="F[i]=this.checked"> Ragu-ragu</label>${i<N-1?'<button class="btn blb" onclick="go(i+1)">Soal berikutnya ▶</button>':'<button class="btn blb" onclick="fin()">Selesai ✔</button>'}</div>`}
function pick(j){const q=Q[i];if(q[1]=='p')A[i]=j;else{const a=A[i],x=a.indexOf(j);x<0?a.push(j):a.splice(x,1)}const y=document.querySelector('.qa').scrollTop;draw();document.querySelector('.qa').scrollTop=y}
function pickT(r,c){A[i][r]=c;draw()}
function go(k){if(k>=0&&k<N){i=k;draw()}}function zoom(f){document.body.style.setProperty('--f',f)}
function show(h){$('mb').innerHTML=h;$('m').classList.add('s')}function hide(){$('m').classList.remove('s')}
$('m').onclick=e=>{if(e.target.id=='m')hide()};
function info(){const q=Q[i];show(`<h3>Informasi Soal ${i+1}</h3><p>Jenis teks: <span class="tag">${S[q[0]][0]}</span></p><p>Bentuk soal: <span class="tag">${{p:'Pilihan Ganda',m:'Pilihan Ganda Kompleks (MCMA)',tf:'PG Kompleks Kategori ('+(q[5]&&L[q[5]].join('/'))+')'}[q[1]]}</span></p><button class="btn blb" onclick="hide()">Tutup</button>`)}
function list(){show(`<h3>Daftar Soal</h3><div style="font-size:12px"><span class="g d" style="padding:2px 8px">Dijawab</span> <span class="g f" style="padding:2px 8px">Ragu-ragu</span></div><div class="grid">${Q.map((_,k)=>`<button class="g ${F[k]?'f':isAns(k)?'d':''} ${k==i?'cur':''}" onclick="hide();go(${k})">${k+1}</button>`).join('')}</div><button class="btn blb" onclick="fin()">Selesaikan ujian</button> <button class="btn rdb" onclick="hide()">Tutup</button>`)}
function fin(){const u=Q.filter((_,k)=>!isAns(k)).length;show(`<h3>Selesaikan latihan?</h3><p>${u?`Masih ada <b>${u}</b> soal belum dijawab.`:'Semua soal sudah dijawab.'}</p><button class="btn blb" onclick="hide();result()">Ya, selesai</button> <button class="btn rdb" onclick="hide()">Kembali</button>`)}
const nm=(q,k)=>q[1]=='p'?'ABCD'[q[4]]:q[1]=='m'?q[4].map(x=>x+1).join(', '):q[4].map((v,r)=>(r+1)+'='+L[q[5]][v]).join(', ');
const ya=(q,k)=>{const a=A[k];return q[1]=='p'?(a===null?'–':'ABCD'[a]):q[1]=='m'?(a.length?[...a].sort().map(x=>x+1).join(', '):'–'):a.map((v,r)=>(r+1)+'='+(v===null?'–':L[q[5]][v])).join(', ')};
function result(){done=true;clearInterval(T);const c=Q.filter((_,k)=>ok(k)).length;
$('app').innerHTML=`<h2>Hasil Latihan</h2><p style="font-size:18px">Benar: <b>${c}</b> dari ${N} soal · Skor: <b>${Math.round(c/N*100)}</b></p><p style="color:var(--mut);font-size:12px">Soal PG: 1 jawaban benar. Soal kompleks: seluruh pilihan/pernyataan harus benar.</p><div class="res">${Q.map((q,k)=>`<div class="r"><span>No. ${k+1} · ${S[q[0]][0]}</span><span class="${ok(k)?'y':'n'}">${ok(k)?'✔ Benar':'✘ Salah'} · Jawaban Anda: ${ya(q,k)} · Kunci: ${nm(q,k)}</span></div>`).join('')}</div><p><button class="btn blb" onclick="location.reload()">Ulangi latihan</button></p>`}
const T=setInterval(()=>{if(done)return;sec--;const t=$('tm');if(t)t.textContent=fmt(sec);if(sec<=0)result()},1000);
draw();
</script></body></html>
