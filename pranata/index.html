<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRANATA — Administrasi Kepala Sekolah</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#172044; --ink2:#4a5275; --mute:#8189a8; --line:#e4e7f2; --bg:#f3f4fa; --card:#fff;
  --side:#161d42; --side2:#222b5c; --brand:#2f3fa0; --brand-soft:#e9ecfb; --gold:#e3a51f; --gold-soft:#fdf3d9;
  --ok:#17824f; --ok-soft:#e0f4ea; --warn:#b06a00; --warn-soft:#fdeed3; --bad:#c2372f; --bad-soft:#fde5e3; --info:#2f5fc4; --info-soft:#e4ecfc;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* layout */
.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--side);color:#c9cdea;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;gap:11px;align-items:center;padding:20px 20px 16px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--side);display:grid;place-items:center;font-weight:800;font-size:18px}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.06em}
.brand span{font-size:11px;color:#9aa1cf}
.nav{flex:1;overflow:auto;padding:4px 12px 16px}
.nav h4{margin:16px 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7c84b8;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side2);color:#fff}
.nav a.on{background:var(--gold);color:var(--side);font-weight:700}
.nav a i{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px}
.nav a.on i{background:rgba(22,29,66,.16)}
.sch{padding:14px 20px;border-top:1px solid rgba(255,255,255,.09);font-size:12px}
.sch b{display:block;color:#fff;font-size:13px}
.main{margin-left:250px;min-height:100%;padding:26px 30px 60px;max-width:1280px}
.top{display:none}
.shade{display:none}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head h1{font-size:24px;font-weight:800}
.head p{margin:3px 0 0;color:var(--ink2)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c7cce3}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#26348a}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--side)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--brand-soft);color:var(--brand)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{min-height:84px;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.bar .inp{max-width:280px}
.bar select.inp{max-width:200px}
.bar .sp{flex:1}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 a{font-size:12px;font-weight:600;color:var(--brand);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:13px;align-items:flex-start;text-decoration:none;color:inherit}
.stat:hover{border-color:#c7cce3}
.stat .dot{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.stat small{display:block;color:var(--ink2);font-weight:600;font-size:12px}
.stat b{font-size:26px;font-weight:800;line-height:1.15}
.stat b span{font-size:14px;color:var(--mute);font-weight:600}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px}
.t-brand{background:var(--brand-soft);color:var(--brand)} .t-gold{background:var(--gold-soft);color:#9a6c00}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.rowi{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.rowi:first-of-type{border-top:0;padding-top:2px}
.rowi .when{flex:none;width:46px;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:5px 0;font-weight:800;font-size:16px;line-height:1.1}
.rowi .when small{display:block;font-size:10px;font-weight:700;text-transform:uppercase}
.rowi b{display:block;font-weight:600}
.rowi span{color:var(--ink2);font-size:12.5px}
.rowi .tag{margin-left:auto;flex:none}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.pb{height:8px;background:#eceef7;border-radius:99px;overflow:hidden;min-width:70px}
.pb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.pb.done i{background:var(--ok)}
.prog{padding:9px 0;border-top:1px solid var(--line)}
.prog:first-of-type{border-top:0}
.prog div.l{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-weight:600}
.prog div.l span{color:var(--ink2);font-weight:700}

/* table */
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfe}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td b{font-weight:600}
td small{display:block;color:var(--ink2);font-size:12.5px;max-width:420px}
td.act{white-space:nowrap;text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--info-soft);color:var(--info)}
.tag.mute{background:#eef0f6;color:var(--ink2)}
.ckr{display:grid;grid-template-columns:28px 1fr 120px 240px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ckr .no{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;display:grid;place-items:center}
.ckr b{display:block;font-weight:600}.ckr span{font-size:12.5px;color:var(--ink2)}.ckr a{color:var(--brand);font-weight:600;text-decoration:none}
@media (max-width:900px){.ckr{grid-template-columns:28px 1fr}.ckr select,.ckr input{grid-column:2}}
.late{color:var(--bad);font-weight:700;font-size:11.5px;display:block}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.cal .dh{background:#fafbfe;padding:8px;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;text-align:center}
.cal .d{background:#fff;min-height:86px;padding:6px;cursor:pointer;border:0;text-align:left;display:block;width:100%}
.cal .d:hover{background:#fafbff}
.cal .d.off{background:#fafbfe;cursor:default}
.cal .d .n{font-weight:700;font-size:12.5px;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%}
.cal .d.today .n{background:var(--brand);color:#fff}
.cal .d.sun .n{color:var(--bad)} .cal .d.today.sun .n{color:#fff}
.ev{display:block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.a{background:var(--brand-soft);color:var(--brand)} .ev.s{background:var(--gold-soft);color:#8a6100} .ev.t{background:var(--bad-soft);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(18,23,54,.5);display:none;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:50;overflow:auto}
.ov.show{display:flex}
.dlg{background:#fff;border-radius:16px;width:100%;max-width:620px;padding:22px;box-shadow:0 20px 60px rgba(10,15,50,.3)}
.dlg.sm{max-width:420px}
.dlg h2{font-size:18px;font-weight:800;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.fg label.w{grid-column:1/-1}
.fg label .inp{margin-top:5px;font-weight:400;color:var(--ink)}
.fg label em{color:var(--bad);font-style:normal}
.df{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--side);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{background:var(--gold-soft);border:1px solid #f2dca0;color:#6d4d00;border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:13px}

/* report */
.rep{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:34px 38px;max-width:900px}
.rep .kop{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px;margin-bottom:18px}
.rep .kop h2{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.rep .kop p{margin:3px 0 0;color:var(--ink2)}
.rep h3{font-size:14.5px;margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.rep table{font-size:12.5px;border:1px solid var(--line)}
.rep th,.rep td{padding:7px 9px;border:1px solid var(--line)}
.rep .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rep .sum div{border:1px solid var(--line);border-radius:10px;padding:10px}
.rep .sum b{display:block;font-size:20px;font-weight:800}
.rep .sum span{font-size:11.5px;color:var(--ink2)}
.rep .ttd{margin-top:36px;margin-left:auto;width:260px;text-align:left}
.rep .ttd .sp{height:64px}

@media (max-width:900px){
  .side{transform:translateX(-100%)} body.menu .side{transform:none}
  body.menu .shade{display:block;position:fixed;inset:0;background:rgba(18,23,54,.45);z-index:25}
  .main{margin-left:0;padding:74px 14px 50px}
  .top{display:flex;position:fixed;inset:0 0 auto 0;height:56px;background:var(--side);color:#fff;align-items:center;gap:12px;padding:0 14px;z-index:20}
  .top button{background:var(--side2);border:0;color:#fff;border-radius:9px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
  .top b{letter-spacing:.06em}
  .stats{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr} .rep{padding:20px 16px} .rep .sum{grid-template-columns:1fr 1fr}
  .cal .d{min-height:62px;padding:3px} .ev{font-size:9.5px;padding:0 3px}
  .head h1{font-size:20px}
}
@media print{
  .side,.top,.bar,.head,.noprint,.toast{display:none!important}
  body{background:#fff} .main{margin:0;padding:0;max-width:none} .rep{border:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><div class="logo">P</div><div><b>PRANATA</b><span>Administrasi Kepala Sekolah</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="sch" id="sch"></div>
</aside>
<div class="shade" data-act="menu"></div>
<div class="top"><button data-act="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>PRANATA</b></div>
<main class="main" id="main"></main>
<div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= util ================= */
const KEY='pranata-ks-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const toDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=(s,o)=>s?toDate(s).toLocaleDateString('id-ID',o||{day:'numeric',month:'short',year:'numeric'}):'—';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ICON={
 dasbor:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 program:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 rapat:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.5c1.9.8 3 2.6 3 5.5"/>',
 tugas:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
 supervisi:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
 kesiswaan:'<path d="m2 9 10-5 10 5-10 5L2 9Z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5M22 9v6"/>',
 agenda:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 sarana:'<path d="M4 21V6l8-3 8 3v15M2 21h20M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/>',
 laporan:'<path d="M6 3h8l5 5v13H6V3Z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
 pengaturan:'<path d="M4 6h10M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 tupoksi:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/>',
 jurnal:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>',
 wira:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
 gtk:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${ICON[n]}</svg>`;
const TONE={Selesai:'ok',Tuntas:'ok',Terlaksana:'ok',Baik:'ok',Prestasi:'ok',Berjalan:'info',Proses:'info',Terjadwal:'info',Sedang:'info',
 Rencana:'mute',Belum:'mute',Rendah:'mute','Perlu Tindak Lanjut':'warn','Rusak Ringan':'warn',Konseling:'warn',Tinggi:'bad','Rusak Berat':'bad',Pelanggaran:'bad',Manajerial:'info','Pengembangan Kewirausahaan':'warn','Supervisi Guru & Tendik':'ok',Guru:'info','Tenaga Kependidikan':'mute'};
const tag=v=>v?`<span class="tag ${TONE[v]||'mute'}">${esc(v)}</span>`:'—';
const pbar=n=>{n=Math.max(0,Math.min(100,Number(n)||0));return `<div style="display:flex;align-items:center;gap:8px"><div class="pb ${n>=100?'done':''}" style="flex:1"><i style="width:${n}%"></i></div><b style="font-size:12px">${n}%</b></div>`};
const due=(d,done)=>`${fmt(d)}${d&&!done&&d<today()?'<span class="late">Terlambat</span>':''}`;
const cut=(s,n=90)=>{s=String(s||'');return s.length>n?s.slice(0,n)+'…':s};

/* ================= data ================= */
let db={profil:{sekolah:'',kepala:'',nip:'',tahun:'',kota:''},program:[],rapat:[],tugas:[],supervisi:[],kesiswaan:[],agenda:[],sarana:[],jurnal:[],wira:[],gtk:[],ceklis:{}};
let storageOK=true;
function load(){try{const s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){storageOK=false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOK=false}}

/* ================= modul ================= */
const MODS={
 program:{label:'Program & Target',one:'Program',desc:'Program kerja sekolah, target, penanggung jawab, dan capaiannya.',filter:'status',sort:'tenggat',dir:1,
  fields:[
   {k:'nama',l:'Nama program',req:1,w:1},
   {k:'bidang',l:'Bidang',t:'select',o:['Kurikulum','Kesiswaan','Sarana Prasarana','Humas','Keuangan','SDM / GTK','Lainnya']},
   {k:'pj',l:'Penanggung jawab'},
   {k:'target',l:'Target / indikator keberhasilan',w:1},
   {k:'tenggat',l:'Tenggat',t:'date'},
   {k:'status',l:'Status',t:'select',o:['Rencana','Berjalan','Selesai']},
   {k:'progres',l:'Progres (%)',t:'number',def:0},
   {k:'catatan',l:'Catatan',t:'textarea',w:1}],
  cols:[['Program',r=>`<b>${esc(r.nama)}</b><small>${esc(r.target)}</small>`],['Bidang',r=>esc(r.bidang)],['Penanggung jawab',r=>esc(r.pj)||'—'],
   ['Tenggat',r=>due(r.tenggat,r.status==='Selesai')],['Progres',r=>pbar(r.progres)],['Status',r=>tag(r.status)]]},
 rapat:{label:'Rapat',one:'Rapat',desc:'Notulen, keputusan rapat, dan tindak lanjutnya.',filter:'jenis',sort:'tanggal',dir:-1,
  fields:[
   {k:'judul',l:'Agenda / judul rapat',req:1,w:1},
   {k:'tanggal',l:'Tanggal',t:'date',req:1,def:'today'},
   {k:'jenis',l:'Jenis',t:'select',o:['Rapat Dinas','Koordinasi','Komite Sekolah','Orang Tua / Wali','Lainnya']},
   {k:'pimpinan',l:'Pimpinan rapat'},{k:'peserta',l:'Peserta'},
   {k:'notulen',l:'Notulen / pembahasan',t:'textarea',w:1},
   {k:'keputusan',l:'Keputusan',t:'textarea',w:1}],
  cols:[['Tanggal',r=>fmt(r.tanggal)],['Rapat',r=>`<b>${esc(r.judul)}</b><small>${esc(cut(r.notulen))}</small>`],['Jenis',r=>tag(r.jenis)],['Keputusan',r=>`<small>${esc(cut(r.keputusan,120))||'—'}</small>`]],
  extra:[['Buat tugas','toTugas']]},
 tugas:{label:'Tugas & Tindak Lanjut',one:'Tugas',desc:'Penugasan dan tindak lanjut hasil rapat, supervisi, atau disposisi.',filter:'status',sort:'tenggat',dir:1,
  fields:[
   {k:'tugas',l:'Uraian tugas',req:1,w:1},
   {k:'pj',l:'Penanggung jawab'},{k:'sumber',l:'Sumber (rapat, supervisi, dll.)'},
   {k:'tenggat',l:'Tenggat',t:'date'},
   {k:'prioritas',l:'Prioritas',t:'select',o:['Sedang','Tinggi','Rendah']},
   {k:'status',l:'Status',t:'select',o:['Belum','Proses','Selesai']},
   {k:'catatan',l:'Catatan / hasil',t:'textarea',w:1}],

function drawTable(m){
  const M=MODS[m],q=ui.q.trim().toLowerCase();

  $('#cnt').textContent=rows.length+' dari '+db[m].length+' data';

function drawCal(){
  if(!ui.cal){const d=new Date();ui.cal={y:d.getFullYear(),m:d.getMonth()}}
  const {y,m}=ui.cal,first=new Date(y,m,1),lead=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=today();
  const ev={};const push=(d,c,s)=>{if(d)(ev[d]=ev[d]||[]).push([c,s])};
  db.agenda.forEach(a=>push(a.tanggal,'a',(a.waktu?a.waktu+' ':'')+a.kegiatan));
  db.supervisi.forEach(s=>push(s.tanggal,'s','Supervisi '+s.guru));
  db.tugas.filter(x=>x.status!=='Selesai').forEach(x=>push(x.tenggat,'t','Tenggat: '+x.tugas));
  let cells='';for(let i=0;i<lead;i++)cells+='<div class="d off"></div>';
  for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),e=ev[k]||[],dow=new Date(y,m,d).getDay();
    cells+=`<button class="d ${k===t?'today':''} ${dow===0?'sun':''}" data-act="calday" data-d="${k}" title="Tambah agenda ${fmt(k)}"><span class="n">${d}</span>${e.slice(0,3).map(x=>`<span class="ev ${x[0]}">${esc(x[1])}</span>`).join('')}${e.length>3?`<span class="ev" style="color:var(--mute)">+${e.length-3} lagi</span>`:''}</button>`}
  const tail=(7-(lead+n)%7)%7;for(let i=0;i<tail;i++)cells+='<div class="d off"></div>';
  $('#calbox').innerHTML=`<div class="bar"><button class="btn sm" data-act="calnav" data-n="-1">‹</button><b style="font-size:16px;min-width:150px;text-align:center">${first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button class="btn sm" data-act="calnav" data-n="1">›</button><button class="btn sm ghost" data-act="calnav" data-n="0">Hari ini</button><span class="sp"></span>
   <span class="legend"><span><i style="background:var(--brand)"></i>Agenda</span><span><i style="background:var(--gold)"></i>Supervisi</span><span><i style="background:var(--bad)"></i>Tenggat tugas</span></span></div>
   <div class="cal">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="dh">${d}</div>`).join('')}${cells}</div>`;
}

function openForm(m,id,preset){

function saveForm(frm){
  const m=frm.dataset.m,id=frm.dataset.id,M=MODS[m],fd=new FormData(frm),r={};
  M.fields.forEach(f=>{let v=(fd.get(f.k)||'').toString().trim();if(f.t==='number'&&v!=='')v=Number(v);r[f.k]=v});
  if(m==='program'){if(r.status==='Selesai')r.progres=100;else if(Number(r.progres)>=100)r.status='Selesai'}
  if(id)Object.assign(db[m].find(x=>x.id===id),r);else db[m].push(Object.assign({id:uid()},r));
  save();closeModal();if(ui.view!==m&&ui.view!=='dasbor'){location.hash=m}else render();toast('Tersimpan');
}

/* ================= peristiwa ================= */
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const {act,m,id}=b.dataset;
  if(act==='menu')document.body.classList.toggle('menu');
  else if(act==='add')openForm(m);
  else if(act==='edit')openForm(m,id);
  else if(act==='del')askDelete(m,id);
  else if(act==='delok'){db[m]=db[m].filter(x=>x.id!==id);save();closeModal();render();toast('Dihapus')}
  else if(act==='close')closeModal();
  else if(act==='done'){const r=db.tugas.find(x=>x.id===id);r.status='Selesai';save();render();toast('Tugas ditandai selesai')}
  else if(act==='toTugas'){const r=db[m].find(x=>x.id===id);
    openForm('tugas',null,m==='rapat'?{sumber:`Rapat: ${r.judul} (${fmt(r.tanggal)})`,catatan:r.keputusan||''}:{tugas:r.tindak||`Tindak lanjut supervisi ${r.guru}`,pj:r.guru,sumber:`Supervisi ${r.guru} (${fmt(r.tanggal)})`})}
  else if(act==='calday')openForm('agenda',null,{tanggal:b.dataset.d});
  else if(act==='calnav'){const n=+b.dataset.n;if(!n){const d=new Date();ui.cal={y:d.getFullYear(),m:d.getMonth()}}else{const d=new Date(ui.cal.y,ui.cal.m+n,1);ui.cal={y:d.getFullYear(),m:d.getMonth()}}drawCal()}
  else if(act==='seed'){if(Object.keys(MODS).some(k=>db[k].length))modal(`<h2>Ganti dengan data contoh?</h2><p style="margin:0;color:var(--ink2)">Seluruh data dan profil di perangkat ini akan <b>diganti</b> dengan data contoh.</p><div class="df"><button class="btn" data-act="close">Batal</button><button class="btn danger" data-act="seedok">Ganti</button></div>`,1);else seed()}
  else if(act==='seedok'){closeModal();seed()}
  else if(act==='ckreset')modal(`<h2>Kosongkan ceklis tupoksi?</h2><p style="margin:0;color:var(--ink2)">Semua status dan catatan ceklis kembali ke Belum, misalnya untuk tahun ajaran baru. Data modul lain tidak berubah.</p><div class="df"><button class="btn" data-act="close">Batal</button><button class="btn danger" data-act="ckresetok">Kosongkan</button></div>`,1);
  else if(act==='ckresetok'){db.ceklis={};save();closeModal();viewTupoksi();toast('Ceklis dikosongkan')}
  else if(act==='print'){try{window.print()}catch(x){}}
  else if(act==='copyrep')copy($('#rep').innerText,'Teks laporan disalin');
  else if(act==='backup'){const j=JSON.stringify(db,null,1);
    modal(`<h2>Cadangkan data</h2><p style="margin:0 0 10px;color:var(--ink2)">Unduh berkas cadangan, atau salin teks di bawah dan simpan di tempat aman.</p><textarea class="inp" id="bk" readonly style="min-height:160px;font-family:monospace;font-size:12px">${esc(j)}</textarea><div class="df"><button class="btn" data-act="close">Tutup</button><button class="btn" data-act="bkcopy">Salin teks</button><button class="btn pri" data-act="bkdl">Unduh berkas</button></div>`)}
  else if(act==='bkcopy'){$('#bk').select();copy($('#bk').value,'Cadangan disalin')}
  else if(act==='bkdl'){download('cadangan-pranata-'+today()+'.json',$('#bk').value);toast('Jika unduhan tidak muncul, gunakan Salin teks')}
  else if(act==='restore')modal(`<h2>Pulihkan dari cadangan</h2><p style="margin:0 0 10px;color:var(--ink2)">Pilih berkas cadangan atau tempel teksnya. Data saat ini akan <b>diganti</b>.</p><input type="file" id="rf" accept=".json,application/json" class="inp" style="margin-bottom:10px"><textarea class="inp" id="rt" placeholder="Tempel teks cadangan di sini" style="min-height:140px;font-family:monospace;font-size:12px"></textarea><div class="df"><button class="btn" data-act="close">Batal</button><button class="btn pri" data-act="restoreok">Pulihkan</button></div>`);
  else if(act==='restoreok'){try{const o=JSON.parse($('#rt').value);if(!o||typeof o!=='object'||!o.profil)throw 0;
      const n={profil:Object.assign({sekolah:'',kepala:'',nip:'',tahun:'',kota:''},o.profil)};Object.keys(MODS).forEach(k=>n[k]=Array.isArray(o[k])?o[k]:[]);n.ceklis=o.ceklis&&typeof o.ceklis==='object'?o.ceklis:{};n.demo=!!o.demo;n.seeded=true;db=n;save();closeModal();render();toast('Data dipulihkan')}
    catch(x){toast('Teks cadangan tidak valid')}}
  else if(act==='reset')modal(`<h2>Hapus semua data?</h2><p style="margin:0;color:var(--ink2)">Seluruh catatan dan profil sekolah di perangkat ini akan dihapus permanen. Cadangkan dulu bila masih diperlukan.</p><div class="df"><button class="btn" data-act="close">Batal</button><button class="btn danger" data-act="resetok">Hapus semua</button></div>`,1);
  else if(act==='resetok'){db={profil:{sekolah:'',kepala:'',nip:'',tahun:'',kota:''},ceklis:{},seeded:true};Object.keys(MODS).forEach(k=>db[k]=[]);save();closeModal();render();toast('Semua data dihapus')}
});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='frm')saveForm(e.target);
  else if(e.target.id==='prof'){new FormData(e.target).forEach((v,k)=>db.profil[k]=v.toString().trim());save();drawNav();toast('Profil disimpan')}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;drawTable(ui.view)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('ck')){const o=db.ceklis[t.dataset.id]=db.ceklis[t.dataset.id]||{};o[t.dataset.f]=t.value.trim();save();if(t.dataset.f==='s')viewTupoksi();toast('Tersimpan')}
  else if(t.id==='f'){ui.f=t.value;drawTable(ui.view)}
  else if(t.id==='ra'||t.id==='rb'){if(t.value){ui.rep[t.id==='ra'?'a':'b']=t.value;viewLaporan()}}
  else if(t.id==='rf'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$('#rt').value=fr.result};fr.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',route);
load();
if(!db.seeded&&(Object.keys(MODS).every(k=>!db[k].length)||db.program.some(x=>x.nama==='Gerakan Literasi 15 Menit')&&db.program.length<=4)){ui.view='dasbor';seed()}
route();
