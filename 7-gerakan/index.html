<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>7 Gerakan Indonesia Hebat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#667085;--pri:#d62828;--ok:#1b9a5a;--bd:#e4e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa3b5;--bd:#2c3140;--pri:#ff6b6b;--ok:#3ecf8e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mut:#9aa3b5;--bd:#2c3140;--pri:#ff6b6b;--ok:#3ecf8e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--mut);font-size:.9rem;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:140px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:.95rem;cursor:pointer}
button.alt{background:var(--bd);color:var(--tx)}
.habit{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.habit.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.ico{font-size:1.6rem}
.habit b{display:block}
.habit small{color:var(--mut)}
.chk{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.done .chk{background:var(--ok);border-color:var(--ok)}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.msg{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:6px 4px;text-align:center;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
@media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🇮🇩 7 Gerakan Indonesia Hebat</h1>
  <p class="sub">Ceklis kebiasaan harian: centang yang sudah dilakukan hari ini.</p>

  <div class="card noprint">
    <div class="row">
      <input id="nama" placeholder="Nama siswa" aria-label="Nama siswa">
      <input id="tgl" type="date" aria-label="Tanggal">
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><b id="ttl">Hari ini</b><span id="pct">0/7</span></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="list"></div>

  <div class="card">
    <b>Rekap 7 hari terakhir</b>
    <div class="scroll"><table id="rekap"></table></div>
  </div>

  <div class="row noprint">
    <button onclick="window.print()">🖨️ Cetak</button>
    <button class="alt" onclick="reset()">Reset hari ini</button>
  </div>
</div>

<script>
const H=[
 ["🌅","Bangun Pagi","Bangun lebih awal, rapikan tempat tidur"],
 ["🕌","Beribadah","Menjalankan ibadah sesuai agama dan kepercayaan"],
 ["🏃","Berolahraga","Bergerak aktif, minimal 15–30 menit"],
 ["🥗","Makan Sehat dan Bergizi","Sarapan, sayur, buah, minum air putih"],
 ["📚","Gemar Belajar","Membaca dan mengulang pelajaran"],
 ["🤝","Bermasyarakat","Membantu keluarga dan lingkungan"],
 ["😴","Tidur Cepat","Tidur lebih awal agar cukup istirahat"]
];
const MSG=["Ayo mulai dari satu kebiasaan!","Awal yang baik, lanjutkan!","Terus semangat!","Hampir separuh jalan!","Bagus, tinggal sedikit lagi!","Hebat, sedikit lagi lengkap!","Luar biasa!","Indonesia Hebat! Semua kebiasaan terlaksana 🎉"];
let data={nama:"",log:{}};
try{const s=localStorage.getItem("7gih");if(s)data=JSON.parse(s)}catch(e){}
const $=id=>document.getElementById(id);
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
$("tgl").value=iso(new Date());
$("nama").value=data.nama||"";
function save(){try{localStorage.setItem("7gih",JSON.stringify(data))}catch(e){}}
function day(){return data.log[$("tgl").value]||(data.log[$("tgl").value]=[])}
function render(){
  const d=day();
  $("list").innerHTML=H.map((h,i)=>`<div class="habit ${d.includes(i)?"done":""}" onclick="tog(${i})"><span class="ico">${h[0]}</span><span><b>${i+1}. ${h[1]}</b><small>${h[2]}</small></span><span class="chk">${d.includes(i)?"✓":""}</span></div>`).join("");
  $("pct").textContent=d.length+"/7";
  $("fill").style.width=(d.length/7*100)+"%";
  $("msg").textContent=MSG[d.length];
  $("ttl").textContent=($("nama").value?$("nama").value+" · ":"")+new Date($("tgl").value+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  rekap();
}
function tog(i){const d=day();const k=d.indexOf(i);k<0?d.push(i):d.splice(k,1);save();render()}
function rekap(){
  const base=new Date($("tgl").value+"T00:00");const days=[];
  for(let i=6;i>=0;i--){const x=new Date(base);x.setDate(x.getDate()-i);days.push(x)}
  let h="<tr><th>Kebiasaan</th>"+days.map(x=>`<th>${x.getDate()}/${x.getMonth()+1}</th>`).join("")+"<th>Σ</th></tr>";
  H.forEach((v,i)=>{let n=0;h+=`<tr><td>${v[0]} ${v[1]}</td>`+days.map(x=>{const l=data.log[iso(x)]||[];const on=l.includes(i);if(on)n++;return `<td>${on?"✅":"·"}</td>`}).join("")+`<td><b>${n}</b></td></tr>`});
  $("rekap").innerHTML=h;
}
function reset(){if(confirm("Hapus ceklis hari ini?")){data.log[$("tgl").value]=[];save();render()}}
$("tgl").onchange=render;
$("nama").oninput=()=>{data.nama=$("nama").value;save();render()};
render();
</script>
</body>
</html>
